한 일을 바르게 짝지으세요.","L":"사람","R":"한 일","pairs":[["잇대","가드 사람으로 끝까지 따르겠다고 함"],["후새","옷을 찢고 흙을 쓴 채 나온 아렉 사람"],["시바","나귀 두 마리에 떡과 포도주를 싣고 옴"],["시므이","바후림에서 저주하며 돌을 던짐"],["아비새","저주하는 자의 머리를 베겠다고 함"],["사독","레위 사람들과 하나님의 궤를 메고 옴"]],"ex":"가드 사람 잇대는 따르겠다고 맹세했고, 아렉 사람 후새는 옷을 찢고 흙을 쓰고 나왔어요. 시바는 나귀에 먹을 것을 싣고 왔고, 게라의 아들 시므이는 저주하며 돌을 던졌으며, 아비새는 그 머리를 베겠다고 했고, 사독은 레위 사람들과 궤를 메고 왔어요."},{"type":"piece","ref":"사무엘하 18:19-28","q":"압살롬이 죽은 뒤, 구스 사람보다 늦게 출발했지만 들길로 달려 먼저 다윗에게 도착한 사독의 아들은?","w":["아히","마아","스"],"d":["아비","마스","아사","도벨"],"ex":"사무엘하 18장에서 사독의 아들 아히마아스는 들길로 달려 구스 사람을 앞질렀고, 먼저 왕에게 이르러 승리 소식을 전했어요."},{"ref":"역대상 25:1, 5","ex":"다윗은 아삽과 헤만과 여두둔의 자손을 노래하는 일에 구별했는데, 하나님은 왕의 선견자 헤만에게 열네 아들과 세 딸을 주셨어요.","v":[["역대상 25장에서 하나님이 열네 아들과 세 딸을 주셨다고 한 '왕의 선견자'는?",["헤만","아삽","여두둔","그나냐","에단","갓"]],["역대상 25장에서 하나님이 왕의 선견자 헤만에게 주신 자녀는?",["열네 아들과 세 딸","열두 아들과 세 딸","열네 아들과 두 딸","일곱 아들과 세 딸","열 아들과 세 딸","열네 아들과 일곱 딸"]]]},{"ref":"역대상 24:7-10","ex":"제사장 24반열을 제비 뽑을 때 첫째는 여호야립이었고, 아비야는 여덟째로 뽑혔어요.","v":[["역대상 24장에서 제사장 반열을 제비 뽑을 때 여덟째로 뽑힌 이름은?",["아비야","여호야립","하림","학고스","예수아","말기야"]],["역대상 24장 제사장 24반열에서 아비야는 몇째 제비였나요?",["여덟째","첫째","셋째","일곱째","아홉째","열두째"]]]},{"ref":"역대상 22:8-9","ex":"다윗은 땅에 피를 많이 흘렸기 때문에 성전을 짓지 못한다는 말씀을 들었고, 아들 솔로몬의 생전에는 하나님이 이스라엘에게 평안과 안일함을 주시겠다고 하셨어요.","v":[["역대상 22장에서 다윗이 하나님의 성전을 건축하지 못하리라는 말씀을 들은 이유는?",["땅에 피를 많이 흘렸기 때문","인구를 조사했기 때문","밧세바를 취했기 때문","나이가 많았기 때문","궤를 수레에 실었기 때문","블레셋 땅에 피했기 때문"]],["역대상 22장에서 하나님이 솔로몬의 생전에 이스라엘에게 주시겠다고 한 것은?",["평안과 안일함","지혜와 총명","부와 영광","넓은 영토","풍년과 비","장수와 존귀"]]]},{"ref":"역대상 14:1","ex":"두로 왕 히람이 사신들과 백향목, 석수와 목수를 다윗에게 보내 그의 궁전을 짓게 했어요.","v":[["역대상 14장에서 다윗의 궁전을 지으라고 사신과 백향목, 석수와 목수를 보낸 두로 왕은?",["히람","아기스","하눈","나하스","도이","하닷에셀"]],["역대상 14장에서 두로 왕 히람이 다윗의 궁전을 짓도록 보낸 나무는?",["백향목","종려나무","감람나무","조각목","뽕나무","상수리나무"]]]},{"type":"verse","l":["1ch",29,14],"ref":"역대상 29:14","q":"이 구절에서 다윗은 자기들이 주께 드린 것을 어디에서 받은 것이라고 고백했나요?","a":["주의 손","조상들","이방 나라들","백성의 손","왕의 곳간","땅의 소산"],"ex":"다윗은 모든 것이 주께로 말미암았으니 주의 손에서 받은 것으로 주께 드렸을 뿐이라고 고백했어요."},{"type":"multi","ref":"역대상 3:1-8","q":"역대상 3장에서 다윗이 예루살렘에서 낳은 아들을 모두 고르세요.","yes":["시므아","소밥","나단","솔로몬","입할","엘리사마"],"no":["암논","압살롬","아도니야","다니엘"],"ex":"예루살렘에서 낳은 아들은 시므아, 소밥, 나단, 솔로몬, 입할, 엘리사마 등이고, 암논, 다니엘, 압살롬, 아도니야는 헤브론에서 낳은 아들이에요."},{"type":"multi","ref":"역대상 15:5-11","q":"역대상 15장에서 다윗이 궤를 메어 올리려고 불러 모은 레위 사람 족장을 모두 고르세요.","yes":["우리엘","아사야","요엘","스마야","엘리엘","암미나답"],"no":["웃사","아히오","요압","아브넬"],"ex":"다윗은 제사장 사독과 아비아달, 그리고 레위 사람 우리엘, 아사야, 요엘, 스마야, 엘리엘, 암미나답을 불렀어요. 웃사와 아히오는 13장에서 새 수레를 몬 사람이에요."},{"type":"multi","ref":"역대상 15:28","q":"역대상 15장에서 언약궤를 메어 올릴 때 이스라엘 무리가 울린 악기를 모두 고르세요.","yes":["뿔나팔","나팔","제금","비파","수금"],"no":["피리","퉁소","방울"],"ex":"이스라엘 무리는 크게 부르며 뿔나팔과 나팔을 불고, 제금을 치며, 비파와 수금을 힘있게 타면서 언약궤를 메어 올렸어요."},{"type":"order","ref":"역대상 1:1-4","q":"역대상 1장 첫머리의 족보를 본문 순서대로 놓으세요.","seq":["아담","셋","에노스","게난","마할랄렐","야렛","에녹","므두셀라","라멕","노아"],"ex":"역대상은 아담, 셋, 에노스, 게난, 마할랄렐, 야렛, 에녹, 므두셀라, 라멕, 노아 순으로 족보를 시작해요."},{"type":"order","ref":"역대상 28:11; 29:3, 6, 10, 22, 28","q":"다윗의 마지막 때에 있었던 일을 본문 순서대로 놓으세요.","seq":["다윗이 솔로몬에게 성전 설계도를 줌","다윗이 자기 소유의 금과 은을 드림","가문의 지도자들이 즐거이 드림","다윗이 온 회중 앞에서 여호와를 송축함","무리가 솔로몬을 다시 왕으로 삼음","다윗이 늙도록 존귀를 누리다 죽음"],"ex":"28장의 설계도, 29장의 다윗의 예물과 지도자들의 예물, 송축 기도, 솔로몬을 다시 왕으로 삼음, 다윗의 죽음 순이에요."},{"type":"match","ref":"역대상 12:2, 8, 32-34","q":"다윗에게 온 용사들의 지파와 본문의 묘사를 바르게 짝지으세요.","L":"지파","R":"묘사","pairs":[["베냐민","좌우 손으로 물매를 던지고 화살을 쏨"],["갓","얼굴은 사자 같고 빠르기는 산의 사슴 같음"],["잇사갈","시세를 알고 마땅히 행할 것을 앎"],["스불론","두 마음을 품지 않고 싸움을 잘함"],["납달리","방패와 창을 가진 자 삼만 칠천 명"]],"ex":"베냐민 사람은 좌우 손으로 물매와 화살을 썼고, 갓 사람은 얼굴이 사자 같고 산의 사슴처럼 빨랐어요. 잇사갈은 시세를 알았고, 스불론은 두 마음을 품지 않았으며, 납달리에서는 방패와 창을 가진 자가 삼만 칠천 명 왔어요."},{"type":"match","ref":"역대상 3:1-5","q":"다윗의 아들과 그 어머니를 바르게 짝지으세요.","L":"아들","R":"어머니","pairs":[["암논","이스르엘 여인 아히노암"],["다니엘","갈멜 여인 아비가일"],["압살롬","그술 왕 달매의 딸 마아가"],["아도니야","학깃"],["이드르암","에글라"],["솔로몬","암미엘의 딸 밧수아"]],"ex":"역대상 3장에서 암논은 아히노암, 다니엘은 아비가일, 압살롬은 마아가, 아도니야는 학깃, 이드르암은 에글라, 솔로몬은 밧수아의 아들이에요."},{"type":"piece","ref":"역대상 13:13-14","q":"웃사가 죽은 뒤 다윗이 하나님의 궤를 옮겨 두어 석 달 동안 머물게 했고, 여호와께서 그 집과 모든 소유에 복을 내리신 가드 사람은?","w":["오벧","에","돔"],"d":["오바","에벳","아비","답"],"ex":"역대상 13장에서 다윗은 궤를 다윗 성으로 들이지 못하고 가드 사람 오벧에돔의 집으로 옮겼어요. 궤가 석 달 머무는 동안 여호와께서 그 집에 복을 내리셨어요."},{"type":"piece","ref":"역대상 14:11; 사무엘하 5:20","q":"르바임 골짜기에 쳐들어온 블레셋을 다윗이 물리친 뒤, 하나님이 물을 쪼갬 같이 대적을 흩으셨다 하여 붙인 그곳 이름은?","w":["바알","브라","심"],"d":["브엘","라심","하솔","바라"],"ex":"역대상 14장에서 다윗은 블레셋을 쳐서 이기고, 하나님이 물을 쪼갬 같이 대적을 흩으셨다고 하여 그곳을 바알브라심이라 불렀어요."},{"ref":"역대하 1:3, 5-6","ex":"솔로몬은 온 회중과 함께 기브온 산당에 가서, 훌의 손자 우리의 아들 브살렐이 만든 놋 제단 위에 천 마리 희생으로 번제를 드렸어요.","v":[["솔로몬이 온 회중과 함께 가서 천 마리 희생으로 번제를 드린 곳은?",["기브온 산당","실로의 성막","벧엘 제단","모리아 산","길갈","헤브론"]],["솔로몬이 기브온에서 번제를 드린 놋 제단을 만든 사람은?",["브살렐","오홀리압","히람","후람","아사랴","사독"]]]},{"ref":"역대하 7:5","ex":"솔로몬 왕은 하나님의 성전을 봉헌하며 소 이만 이천 마리와 양 십이만 마리를 제물로 드렸어요.","v":[["솔로몬이 성전을 봉헌할 때 제물로 드린 소의 수는?",["22,000마리","12,000마리","20,000마리","32,000마리","24,000마리","2,200마리"]],["솔로몬이 성전을 봉헌할 때 제물로 드린 양의 수는?",["120,000마리","100,000마리","12,000마리","200,000마리","220,000마리","150,000마리"]]]},{"ref":"역대하 9:9, 13","ex":"스바 여왕은 솔로몬 왕에게 금 백이십 달란트와 많은 향품과 보석을 드렸고, 솔로몬의 세입금은 무게가 금 육백육십육 달란트였어요.","v":[["스바 여왕이 솔로몬 왕에게 드린 금의 양은?",["120달란트","100달란트","150달란트","200달란트","60달란트","420달란트"]],["역대하 9장에서 솔로몬의 세입금 무게로 적힌 금의 양은?",["666달란트","600달란트","660달란트","616달란트","700달란트","420달란트"]]]},{"ref":"역대하 13:4-5","ex":"아비야는 에브라임 산 중의 스마라임 산 위에 서서 여로보암과 이스라엘에게 외쳤고, 여호와께서 소금 언약으로 나라를 다윗과 그 자손에게 주셨다고 말했어요.","v":[["아비야가 여로보암과 싸우기 전에 올라서서 이스라엘에게 외친 산은?",["스마라임 산","길보아 산","갈멜 산","에발 산","그리심 산","다볼 산"]],["아비야가 여호와께서 나라를 다윗과 그 자손에게 주셨다며 말한 언약의 이름은?",["소금 언약","무지개 언약","할례 언약","피의 언약","평화의 언약","돌판 언약"]]]},{"ref":"역대하 19:5-6, 11","ex":"여호사밧은 견고한 성읍마다 재판관을 세우고, 사람을 위하지 말고 여호와를 위해 재판하라고 했어요. 왕에게 속한 일은 이스마엘의 아들 스바댜가 다스렸어요.","v":[["여호사밧이 재판관들에게, 재판은 사람을 위해서가 아니라 누구를 위해 하는 것이라고 했나요?",["여호와","왕","백성","가난한 자","장로들","제사장"]],["여호사밧 때 왕에게 속한 모든 일을 다스린 유다 지파의 어른은?",["스바댜","아마랴","예후","야하시엘","엘리에셀","아사랴"]]]},{"ref":"역대하 35:20, 22-25","ex":"요시야는 갈그미스를 치러 올라온 애굽 왕 느고와 므깃도 골짜기에서 변장하고 싸우다 활에 맞아 죽었고, 예레미야가 그를 위해 애가를 지었어요.","v":[["요시야가 변장하고 애굽 왕 느고와 싸우다 활에 맞은 곳은?",["므깃도 골짜기","브라가 골짜기","스바다 골짜기","소금 골짜기","힌놈의 아들 골짜기","아골 골짜기"]],["요시야가 죽은 뒤 그를 위하여 애가를 지은 사람은?",["예레미야","이사야","훌다","힐기야","사반","스바냐"]]]},{"type":"multi","ref":"역대하 14:3-5; 15:8, 16","q":"아사 왕이 개혁하며 한 일로 역대하 14~15장에 나오는 것을 모두 고르세요.","yes":["이방 제단과 산당을 없앰","주상을 깨뜨림","아세라 상을 찍음","태양상을 없앰","여호와의 제단을 다시 쌓음","어머니 마아가를 태후의 자리에서 폐함"],"no":["성전에서 발견한 율법책을 백성에게 읽어 줌","성 밖의 물 근원을 막음","성전 문 밖에 궤를 두어 세를 거둠","금 방패 대신 놋 방패를 만듦"],"ex":"아사는 이방 제단과 산당, 태양상을 없애고 주상을 깨뜨리며 아세라 상을 찍었어요. 또 여호와의 제단을 새로 쌓고, 아세라 목상을 만든 어머니 마아가를 태후 자리에서 폐했어요."},{"type":"multi","ref":"역대하 32:3-5","q":"앗수르 왕 산헤립이 쳐들어오려 할 때 히스기야가 한 일로 본문에 나오는 것을 모두 고르세요.","yes":["성 밖의 물 근원을 막음","무너진 성벽을 보수함","망대를 높이 쌓음","외성을 쌓음","다윗 성의 밀로를 견고하게 함","무기와 방패를 많이 만듦"],"no":["금 방패 대신 놋 방패를 만듦","성전 문들을 닫음","스마라임 산에 올라 적에게 외침","아세라 상을 찍어 기드론 시냇가에서 불사름"],"ex":"히스기야는 성 밖의 물 근원과 시내를 막고, 무너진 성벽을 보수하며 망대를 높이 쌓고 외성을 쌓았어요. 다윗 성의 밀로를 견고하게 하고 무기와 방패도 많이 만들었어요."},{"type":"order","ref":"역대하 34:3, 8, 14-19, 30-31","q":"요시야 왕 때 있었던 일을 역대하 34장 순서대로 놓으세요.","seq":["다윗의 하나님을 찾기 시작함","유다와 예루살렘을 정결하게 하기 시작함","성전을 수리하게 함","제사장 힐기야가 율법책을 발견함","서기관 사반이 왕 앞에서 율법책을 읽음","왕이 율법의 말씀을 듣고 옷을 찢음","왕이 백성 앞에서 언약을 세움"],"ex":"요시야는 왕위 제팔년에 하나님을 찾기 시작했고, 제십이년에 정결 작업을, 제십팔년에 성전 수리를 시작했어요. 그때 힐기야가 율법책을 발견하자 사반이 읽었고, 왕은 옷을 찢은 뒤 백성 앞에서 언약을 세웠어요."},{"type":"match","ref":"역대하 12:5; 15:1-2; 19:2; 32:20; 34:22","q":"역대하의 선지자와, 그가 말씀을 전하거나 함께한 왕을 바르게 짝지으세요.","L":"선지자","R":"왕","pairs":[["스마야","르호보암"],["아사랴(오뎃의 아들)","아사"],["예후(하나니의 아들)","여호사밧"],["이사야","히스기야"],["훌다","요시야"]],"ex":"스마야는 르호보암에게, 오뎃의 아들 아사랴는 아사에게 나아갔고, 선견자 예후는 여호사밧을 꾸짖었어요. 이사야는 히스기야와 함께 기도했고, 요시야는 사람들을 여선지자 훌다에게 보냈어요."},{"type":"match","ref":"역대하 24:1; 33:1; 26:1-3; 28:1; 33:21; 29:1","q":"역대하의 유다 왕과 왕이 될 때의 나이를 바르게 짝지으세요.","L":"왕","R":"왕이 될 때 나이","pairs":[["요아스","7세"],["므낫세","12세"],["웃시야","16세"],["아하스","20세"],["아몬","22세"],["히스기야","25세"]],"ex":"요아스는 일곱 살, 므낫세는 열두 살, 웃시야는 열여섯 살, 아하스는 스무 살, 아몬은 스물두 살, 히스기야는 스물다섯 살에 왕이 되었어요."},{"type":"verse","l":["2ch",36,23],"ref":"역대하 36:23","q":"이 구절에서 고레스가 하늘의 하나님 여호와께서 자기에게 주셨다고 말한 것은?","a":["세상 만국","큰 지혜","부와 영광","바벨론 땅","강 건너편 온 땅","열방의 금과 은"],"ex":"역대하 마지막 절에서 바사 왕 고레스는 여호와께서 세상 만국을 자기에게 주시고, 유다 예루살렘에 성전을 건축하라고 명하셨다고 말했어요."},{"type":"piece","ref":"역대하 22:10-12","q":"아달랴가 왕의 씨를 진멸할 때, 왕자 요아스를 몰래 빼내 유모와 함께 침실에 숨긴 여호람 왕의 딸은?","w":["여호","사브","앗"],"d":["여호사","밧","야다","사밧"],"ex":"여호람 왕의 딸이며 제사장 여호야다의 아내인 여호사브앗이 요아스를 숨겼고, 요아스는 아달랴가 다스리는 육 년 동안 하나님의 성전에 숨어 있었어요."},{"ref":"에스라 2:64, 69","ex":"포로에서 돌아온 온 회중의 합계는 사만 이천삼백육십 명이었고, 족장들은 힘자라는 대로 금 육만 일천 다릭과 은 오천 마네, 제사장의 옷 백 벌을 드렸어요.","v":[["에스라 2장에서 포로에서 돌아온 온 회중의 합계는?",["42,360명","43,260명","42,630명","41,360명","45,360명","40,360명"]],["돌아온 족장들이 성전 공사를 위해 힘자라는 대로 드린 금은?",["61,000다릭","60,000다릭","16,000다릭","6,100다릭","51,000다릭","71,000다릭"]]]},{"ref":"에스라 6:1-3","ex":"다리오 왕이 바벨론의 보물 서고를 조사하게 했는데, 고레스의 조서가 적힌 두루마리는 메대도 악메다 궁성에서 발견되었어요. 그 조서에는 성전의 높이와 너비를 각각 육십 규빗으로 하라고 적혀 있었어요.","v":[["다리오 왕 때 고레스의 조서가 적힌 두루마리가 발견된 곳은?",["악메다 궁성","수산 궁","바벨론의 보물전각","니느웨 왕궁","다메섹 성","갈그미스 성"]],["다리오 왕 때 찾아낸 고레스의 조서에 적힌 성전의 높이는?",["60규빗","30규빗","40규빗","50규빗","70규빗","120규빗"]]]},{"ref":"에스라 7:1-6","ex":"에스라 7장의 족보는 스라야에서 시작해 아론까지 거슬러 올라가요. 에스라는 이스라엘의 하나님 여호와께서 주신 모세의 율법에 익숙한 학자로 소개돼요.","v":[["에스라 7장에 나오는 에스라의 족보에서 맨 끝에 나오는 조상은?",["아론","사독","비느하스","엘르아살","레위","모세"]],["에스라는 무엇에 익숙한 학자로 소개되나요?",["모세의 율법","갈대아 사람의 학문","바사의 법률","선지자들의 글","왕의 역대 일기","성전 노래"]]]},{"type":"multi","ref":"에스라 7:13-26","q":"아닥사스다 왕이 에스라에게 준 조서(에스라 7장)에 들어 있는 내용을 모두 고르세요.","yes":["올라갈 뜻이 있는 자는 누구든지 에스라와 함께 갈 수 있음","왕과 일곱 자문관이 에스라를 보냄","강 건너편 창고지기들이 은은 백 달란트까지 주게 함","소금은 정량 없이 주게 함","제사장과 레위 사람 등에게 조공과 관세와 통행세를 받지 않게 함","에스라가 법관과 재판관을 세우게 함"],"no":["예루살렘 성벽을 다시 쌓게 함","이방 아내를 내보내게 함","조서를 변조하는 자는 집의 들보를 빼내어 매달게 함","성전 높이를 육십 규빗으로 하게 함"],"ex":"아닥사스다의 조서는 원하는 자들이 함께 올라가게 하고, 은 백 달란트와 소금 등을 대주며, 성전 섬기는 자들에게 세금을 면제하고, 에스라가 재판관을 세우게 했어요. 들보 이야기와 육십 규빗은 다리오가 찾은 6장의 조서 내용이에요."},{"type":"order","ref":"에스라 4:2-8, 23","q":"성전 재건을 방해한 일들을 에스라 4장 순서대로 놓으세요.","seq":["대적들이 함께 성전을 건축하자고 청함","스룹바벨과 예수아 등이 그 청을 거절함","관리들에게 뇌물을 주어 계획을 막음","아하수에로가 즉위할 때 고발장을 올림","아닥사스다 왕에게 고발하는 편지를 올림","왕의 조서를 듣고 급히 가서 권력으로 공사를 그치게 함"],"ex":"대적들이 함께 짓겠다고 했다가 거절당하자 관리들에게 뇌물을 주어 방해했고, 아하수에로 때와 아닥사스다 때 차례로 고발했어요. 아닥사스다의 회답을 받은 뒤 그들은 예루살렘으로 가서 공사를 강제로 멈추게 했어요."},{"type":"order","ref":"에스라 10:1-9, 16","q":"이방 아내 문제를 처리한 과정을 에스라 10장 순서대로 놓으세요.","seq":["에스라가 성전 앞에 엎드려 울며 기도함","스가냐가 이스라엘에게 아직 소망이 있다고 말함","에스라가 제사장과 레위 사람과 온 이스라엘에게 맹세하게 함","에스라가 여호하난의 방에서 음식을 먹지 않음","사흘 안에 예루살렘에 모이라고 공포함","백성이 큰 비 속에 성전 앞 광장에 앉아 떪","열째 달 초하루에 조사를 시작함"],"ex":"에스라의 기도 뒤 스가냐가 언약을 세우자고 했고, 에스라는 무리에게 맹세하게 한 뒤 여호하난의 방에서 금식했어요. 사흘 안에 모이라는 공포에 백성이 아홉째 달 이십일에 큰 비 속에 모였고, 열째 달 초하루부터 조사했어요."},{"type":"match","ref":"에스라 4:2, 8; 7:1; 8:17; 10:15","q":"에스라서에 나오는 인물과 그를 설명하는 말을 바르게 짝지으세요.","L":"인물","R":"설명","pairs":[["르훔","편지를 쓴 방백"],["심새","편지를 쓴 서기관"],["잇도","가시뱌 지방의 족장"],["에살핫돈","대적들을 그 땅에 오게 한 앗수르 왕"],["스라야","에스라의 아버지"],["요나단","이방 아내 일을 반대한 아사헬의 아들"]],"ex":"방백 르훔과 서기관 심새가 아닥사스다에게 편지를 썼고, 대적들은 앗수르 왕 에살핫돈 때 왔다고 했어요. 잇도는 가시뱌 지방의 족장, 스라야는 에스라의 아버지, 요나단은 아사헬의 아들이에요."},{"type":"match","ref":"에스라 2:40-42, 58, 65-66","q":"포로에서 돌아온 무리와 그 수를 바르게 짝지으세요.","L":"무리","R":"수","pairs":[["레위 사람(예수아와 갓미엘 자손)","74명"],["노래하는 자(아삽 자손)","128명"],["문지기 자손","139명"],["느디님 사람과 솔로몬의 신하 자손","392명"],["노래하는 남녀","200명"],["말","736마리"]],"ex":"레위 사람은 74명, 아삽 자손 노래하는 자는 128명, 문지기 자손은 139명, 느디님 사람과 솔로몬 신하의 자손은 392명이었어요. 노래하는 남녀는 200명, 말은 736마리였어요."},{"type":"verse","l":["ezr",6,22],"ref":"에스라 6:22","q":"이 구절에서 여호와께서 마음을 돌려 성전 공사를 돕게 하셨다는 왕은 무엇이라고 불리나요?","a":["앗수르 왕","바사 왕","메대 왕","바벨론 왕","강 건너편 왕","애굽 왕"],"ex":"무교절을 지킨 백성에 대해, 여호와께서 그들을 즐겁게 하시고 앗수르 왕의 마음을 돌려 하나님의 성전 건축을 돕게 하셨다고 적혀 있어요."},{"type":"verse","l":["ezr",9,6],"ref":"에스라 9:6","q":"이 구절에서 에스라가 '우리 허물'이 커서 어디에 미쳤다고 기도했나요?","a":["하늘","정수리","땅 끝","바다","구름","성전 문"],"ex":"에스라는 부끄러워 얼굴을 들지 못하며, 우리 죄악은 정수리에 넘치고 우리 허물은 하늘에 미쳤다고 고백했어요."},{"type":"piece","ref":"에스라 2:62-63","q":"족보에서 이름을 찾지 못한 제사장들에게, 무엇을 가진 제사장이 일어나기 전에는 지성물을 먹지 말라고 했나요?","w":["우림","과","둠밈"],"a":"우림과 둠밈","d":["에봇","흉패","우리","밈과"],"ex":"족보를 찾지 못한 제사장들은 부정하게 여겨져 제사장 직분에서 쫓겨났고, 방백은 우림과 둠밈을 가진 제사장이 일어나기 전에는 지성물을 먹지 말라고 했어요."},{"type":"piece","ref":"에스라 5:3","q":"성전 공사가 다시 시작되자 강 건너편 총독 닷드내와 함께 와서 누가 건축을 명령했느냐고 물은 사람은?","w":["스달","보스","내"],"d":["닷드","스알","보살","드내"],"ex":"학개와 스가랴의 예언으로 공사가 다시 시작되자, 강 건너편 총독 닷드내와 스달보스내가 동관들과 함께 와서 누가 성전 건축을 명령했느냐고 물었어요."},{"type":"piece","ref":"에스라 4:10","q":"아닥사스다 왕에게 보낸 고발 편지에서, 여러 백성을 옮겨 사마리아 성과 강 건너편 땅에 두었다고 소개된 '존귀한' 사람은?","w":["오스","납","발"],"d":["에살","핫돈","오브","납달"],"ex":"고발 편지를 보낸 이들은 자신들을 존귀한 오스납발이 옮겨 사마리아 성과 강 건너편 땅에 둔 백성이라고 소개했어요."},{"ref":"느헤미야 1:3","ex":"하나니 일행은 남은 자들이 큰 환난과 능욕을 당하고, 예루살렘 성은 허물어지고 성문들은 불탔다고 전했어요.","v":[["느헤미야가 하나니 일행에게서 들은 예루살렘 성문들의 형편은?",["불탔다","부서졌다","굳게 잠겼다","원수에게 빼앗겼다","녹슬어 열리지 않았다","흙에 묻혔다"]],["느헤미야 1장에서 전해 들은 소식 속 예루살렘 성은 어떤 모습이었나요?",["허물어짐","불에 다 타서 재가 됨","물에 잠김","원수들이 차지함","새로 쌓는 중임","굳게 닫혀 있음"]]]},{"ref":"느헤미야 4:17-18","ex":"성벽 공사 때 건축하는 자는 각각 허리에 칼을 차고 일했고, 나팔 부는 자는 느헤미야 곁에 서 있었어요.","v":[["성벽을 건축하는 자들이 각각 허리에 차고 일한 것은?",["칼","활","물매","나팔","방패","창"]],["성벽 공사 때 느헤미야 곁에 서 있던 사람은?",["나팔 부는 자","창을 든 민장","제사장 에스라","노래하는 자","문지기","방패 든 자"]]]},{"ref":"느헤미야 5:14, 18","ex":"느헤미야는 아닥사스다 왕 제이십년부터 제삼십이년까지 십이 년 동안 총독의 녹을 먹지 않았어요. 백성의 부역이 무거웠기 때문이에요.","v":[["느헤미야와 그 형제들이 총독의 녹을 먹지 않은 기간은?",["십이 년","칠 년","십 년","십오 년","이십 년","팔 년"]],["느헤미야가 총독의 녹을 먹지 않은 기간을 왕의 연대로 말하면?",["아닥사스다 왕 제이십년부터 제삼십이년까지","아닥사스다 왕 제칠년부터 제이십년까지","아닥사스다 왕 제십년부터 제이십이년까지","아닥사스다 왕 제이십년부터 제사십년까지","아닥사스다 왕 제일년부터 제십이년까지","아닥사스다 왕 제삼십년부터 제사십이년까지"]]]},{"ref":"느헤미야 8:17","ex":"돌아온 회중이 초막을 짓고 그 안에서 지냈는데, 눈의 아들 여호수아 때로부터 그 날까지 이같이 행한 일이 없었기에 크게 기뻐했어요.","v":[["느헤미야 8장에서 백성이 초막을 짓고 거한 일은 누구 때부터 그 날까지 없었다고 하나요?",["눈의 아들 여호수아","모세","다윗","솔로몬","사무엘","히스기야"]],["느헤미야 8장의 초막절이 특별했던 까닭은 어느 인물의 때 이후로 이같이 행한 일이 없었기 때문인가요?",["여호수아","요시야","다윗","솔로몬","스룹바벨","모세"]]]},{"type":"verse","l":["neh",8,10],"ref":"느헤미야 8:10","q":"이 구절에서 느헤미야가 백성에게 '너희의 힘'이라고 말한 것은?","a":["여호와로 인하여 기뻐하는 것","율법의 말씀을 지키는 것","금식하며 회개하는 것","성벽을 굳게 쌓는 것","살진 것을 먹는 것","슬퍼하며 우는 것"],"ex":"율법을 듣고 우는 백성에게 느헤미야는 오늘은 성일이니 근심하지 말라며, 여호와로 인하여 기뻐하는 것이 너희의 힘이라고 했어요."},{"type":"verse","l":["neh",6,3],"ref":"느헤미야 6:3","q":"이 구절에서 느헤미야가 '내려가지 못하겠노라'고 한 까닭으로 말한 것은?","a":["큰 역사를 하고 있어서","왕의 허락이 없어서","몸에 병이 있어서","안식일이어서","금식하는 중이어서","길이 너무 멀어서"],"ex":"산발랏과 게셈이 오노 평지에서 만나자고 하자, 느헤미야는 큰 역사를 하고 있으니 내려갈 수 없다고 답했어요."},{"type":"multi","ref":"느헤미야 10:30-37","q":"느헤미야 10장에서 백성이 맹세하며 지키기로 한 것을 모두 고르세요.","yes":["딸들을 이 땅 백성에게 주지 않음","안식일이나 성일에 그들에게서 사지 않음","일곱째 해마다 땅을 쉬게 하고 빚을 탕감함","해마다 세겔의 삼분의 일을 바침","제비 뽑아 하나님의 전에 나무를 바침","산물의 십일조를 레위 사람들에게 줌"],"no":["해마다 세겔의 절반을 바침","매달 초하루에 금식함","오십 년마다 나팔을 불어 희년을 선포함","해마다 부림절을 지킴"],"ex":"백성은 통혼하지 않기, 안식일에 사지 않기, 일곱째 해의 쉼과 빚 탕감, 세겔 삼분의 일, 제비 뽑아 나무 바치기, 맏물과 십일조를 맹세했어요."},{"type":"multi","ref":"느헤미야 13:10, 15-16, 23, 28","q":"느헤미야 13장에서 느헤미야가 바로잡은 잘못을 모두 고르세요.","yes":["레위 사람들이 몫을 받지 못해 밭으로 도망함","안식일에 술틀을 밟고 짐을 나름","안식일에 두로 사람이 물고기를 팖","아스돗과 암몬과 모압 여인을 아내로 삼음","대제사장 집안 사람이 산발랏의 사위가 됨"],"no":["가난한 형제에게서 이자를 받음","금 송아지에게 절함","초막절을 지키지 않음"],"ex":"느헤미야 13장에서 느헤미야는 레위 사람의 몫, 안식일 장사, 이방 여인과의 통혼, 엘리아십의 손자 집안이 산발랏의 사위가 된 일을 바로잡았어요. 이자 문제는 5장 이야기예요."},{"type":"order","ref":"느헤미야 1:4; 2:5, 13; 4:17; 6:15; 8:3, 16; 10:1; 13:19","q":"느헤미야서의 일을 본문 순서대로 놓으세요.","seq":["예루살렘 소식을 듣고 금식하며 기도함","왕에게 유다로 보내 성을 건축하게 해 달라고 청함","밤에 골짜기 문으로 나가 성벽을 살핌","한 손으로 일하고 한 손에 병기를 잡음","성벽이 엘룰월 이십오일에 완공됨","수문 앞 광장에서 율법책을 낭독함","나뭇가지로 초막을 짓고 절기를 지킴","언약에 인봉함","안식일 전 어두워질 때 성문을 닫게 함"],"ex":"소식과 기도(1장), 왕에게 청함과 밤 순찰(2장), 무기를 든 공사(4장), 완공(6장), 율법 낭독과 초막절(8장), 언약 인봉(10장), 안식일 개혁(13장) 순이에요."},{"type":"order","ref":"느헤미야 2:13-15","q":"느헤미야가 밤에 성벽을 살핀 길을 본문 순서대로 놓으세요.","seq":["골짜기 문으로 나감","용정 쪽으로 감","분문에 이름","샘문과 왕의 못에 이름","시내를 따라 올라가며 성벽을 살핌","골짜기 문으로 돌아옴"],"ex":"느헤미야는 골짜기 문으로 나가 용정과 분문을 지나 샘문과 왕의 못에 이르렀는데, 짐승이 지나갈 곳이 없어 시내를 따라 올라가 살핀 뒤 골짜기 문으로 돌아왔어요."},{"type":"match","ref":"느헤미야 2:8, 19; 6:10, 14; 7:2","q":"느헤미야서의 인물과 본문의 소개를 바르게 짝지으세요.","L":"인물","R":"소개","pairs":[["산발랏","호론 사람"],["도비야","종이었던 암몬 사람"],["게셈","아라비아 사람"],["아삽","왕의 삼림 감독"],["하나냐","영문의 관원"],["노아댜","느헤미야를 두렵게 하려던 여선지"],["스마야","전의 외소에 숨자고 한 사람"]],"ex":"산발랏은 호론 사람, 도비야는 종이었던 암몬 사람, 게셈은 아라비아 사람이에요. 아삽은 왕의 삼림 감독, 하나냐는 영문의 관원, 노아댜는 여선지, 스마야는 뇌물을 받고 외소에 숨자고 했어요."},{"type":"piece","ref":"느헤미야 1:1-2","q":"아닥사스다 왕 제이십년, 느헤미야가 수산 궁에서 하나니에게 예루살렘 소식을 들은 달은?","w":["기슬","르","월"],"d":["엘룰","니산","데벳","시완"],"ex":"느헤미야 1장은 아닥사스다 왕 제이십년 기슬르월, 수산 궁에 있던 느헤미야가 하나니에게 예루살렘 형편을 묻는 장면으로 시작해요."},{"ref":"에스더 1:10-11","ex":"잔치 제칠일에 왕은 일곱 내시를 시켜 왕후 와스디가 왕후의 관을 정제하고 나아와 그 아리따움을 보이게 하라고 명했어요.","v":[["아하수에로 왕이 왕후 와스디에게 어떻게 하고 나아오라고 했나요?",["왕후의 관을 정제하고","왕후의 예복을 입고","금 규를 손에 들고","몸을 정결하게 하고","향품을 바르고","면류관과 홀을 들고"]],["왕이 와스디를 불러오게 한 것은 잔치 며칠째 되는 날이었나요?",["제칠일","제삼일","제일일","제십일","제오일","제팔일"]]]},{"ref":"에스더 2:10, 20","ex":"에스더는 모르드개가 명령한 대로 자기의 민족과 종족을 말하지 않았어요. 양육 받을 때처럼 모르드개의 말을 따른 거예요.","v":[["에스더가 왕궁에 들어가서 밝히지 않은 것은?",["자기의 민족과 종족","자기의 나이","자기의 본래 이름","모르드개와 함께 산 집","아버지의 이름","자기가 금식한 일"]],["모르드개가 에스더에게 말하지 말라고 명령한 것은?",["민족과 종족","빅단과 데레스의 음모","하만의 계략","자기의 직업","왕궁에 들어온 날짜","자기의 재산"]]]},{"ref":"에스더 5:1-2","ex":"제삼일에 에스더가 왕후의 예복을 입고 안뜰에 서자, 왕이 손에 잡았던 금 규를 내밀었고 에스더는 가까이 가서 금 규 끝을 만졌어요.","v":[["제삼일에 에스더가 왕궁 안뜰에 섰을 때 왕이 그에게 내민 것은?",["금 규","인장 반지","왕관","금 잔","은 지팡이","조서"]],["왕 앞에 나아간 에스더가 가까이 가서 만진 것은?",["금 규 끝","왕의 옷자락","왕좌의 발등상","왕의 반지","왕관의 끝","어전의 휘장"]]]},{"ref":"에스더 8:1-2","ex":"하만이 죽은 그 날 왕은 하만의 집을 에스더에게 주었고, 하만에게서 거둔 반지를 빼어 모르드개에게 주었어요.","v":[["왕이 하만에게서 거두어 모르드개에게 준 것은?",["반지","금 규","왕관","하만의 아내","금 사슬","왕의 말"]],["하만이 죽은 그 날 아하수에로 왕이 왕후 에스더에게 준 것은?",["하만의 집","나라의 절반","하만의 열 아들","은 일만 달란트","수산 궁","금관"]]]},{"type":"verse","l":["est",3,8],"ref":"에스더 3:8","q":"이 구절에서 하만이 그 민족의 무엇이 만민의 것과 다르다고 했나요?","a":["법률","언어","의복","음식","절기","섬기는 신"],"ex":"하만은 왕에게 한 민족이 각 지방에 흩어져 사는데 그 법률이 만민의 것과 달라 왕의 법률을 지키지 않는다고 모함했어요."},{"type":"verse","l":["est",9,26],"ref":"에스더 9:26","q":"이 구절에서 이 두 날을 '부림'이라 부르게 된 것은 무엇의 이름을 따른 것인가요?","a":["부르","하만","아달월","수산","모르드개","에스더"],"ex":"무리는 하만이 뽑은 제비인 부르의 이름을 따라 이 두 날을 부림이라 불렀어요."},{"type":"multi","ref":"에스더 9:21-22","q":"모르드개가 글을 보내 아달월 십사일과 십오일에 하라고 한 것을 모두 고르세요.","yes":["잔치를 베풂","즐김","서로 예물을 줌","가난한 자를 구제함"],"no":["초막을 짓고 거함","무교병을 먹음","나팔을 붊","첫 열매를 드림"],"ex":"모르드개는 슬픔이 기쁨으로 바뀐 이 두 날에 잔치를 베풀고 즐기며 서로 예물을 주고 가난한 자를 구제하라고 했어요."},{"type":"order","ref":"에스더 1:12; 2:17, 22; 3:7; 4:16; 5:4; 6:1; 7:10; 9:21","q":"에스더서의 일을 본문 순서대로 놓으세요.","seq":["와스디가 왕명을 따르지 않음","에스더가 왕후가 됨","모르드개가 내시들의 음모를 알림","하만 앞에서 부르를 뽑아 날을 정함","에스더가 삼 일 금식을 부탁함","에스더가 왕과 하만을 잔치에 청함","왕이 잠이 오지 않아 역대 일기를 읽게 함","하만이 모르드개를 달려던 나무에 달림","해마다 두 날을 지키는 규례를 세움"],"ex":"와스디 폐위(1장), 에스더 즉위와 모르드개의 공(2장), 부르(3장), 금식(4장), 잔치(5장), 잠 못 이룬 밤(6장), 하만의 몰락(7장), 부림절 제정(9장) 순이에요."},{"type":"order","ref":"에스더 6:1-14","q":"왕이 잠 못 이룬 밤부터 이어진 일을 본문 순서대로 놓으세요.","seq":["왕이 역대 일기를 가져다 읽게 함","모르드개에게 아무것도 베풀지 않았음을 앎","하만이 모르드개를 달자고 구하려 뜰에 들어옴","하만이 왕복과 왕의 말로 높이자고 말함","하만이 모르드개를 말에 태워 성 중 거리로 다님","하만이 머리를 싸고 급히 집으로 감","왕의 내시들이 와서 하만을 잔치로 데려감"],"ex":"왕은 역대 일기에서 모르드개의 공을 읽고 상을 주지 않았음을 알았어요. 하만은 자기 제안대로 모르드개를 높여야 했고, 머리를 싸고 집에 갔다가 내시들에게 이끌려 잔치에 갔어요."},{"type":"match","ref":"에스더 1:4-5; 2:12; 3:9; 9:6, 10, 16","q":"에스더서의 숫자와 그 내용을 바르게 짝지으세요.","L":"숫자","R":"내용","pairs":[["백팔십 일","왕이 나라의 부함과 위엄을 나타낸 기간"],["칠 일","도성 수산 백성을 위한 후원 뜰 잔치"],["열두 달","처녀들이 몸을 정결하게 한 기간"],["은 일만 달란트","하만이 왕의 금고에 드리겠다고 한 돈"],["오백 명","유다인이 도성 수산에서 죽인 사람"],["열 명","죽임을 당한 하만의 아들"],["칠만 오천 명","각 지방 유다인이 도륙한 대적"]],"ex":"왕은 백팔십 일 동안 위엄을 보이고 칠 일 잔치를 열었어요. 처녀들은 열두 달 몸을 정결하게 했고, 하만은 은 일만 달란트를 내겠다고 했어요. 유다인은 수산에서 오백 명, 하만의 열 아들, 지방에서 칠만 오천 명을 죽였어요."},{"type":"match","ref":"에스더 2:16; 3:7; 8:9; 9:1, 17-18","q":"에스더서의 달·날과 그때 있었던 일을 바르게 짝지으세요.","L":"달·날","R":"있었던 일","pairs":[["데벳월","에스더가 왕궁으로 이끌려 들어감"],["니산월","하만 앞에서 부르를 뽑음"],["시완월 이십삼일","왕의 서기관들이 소집되어 새 조서를 씀"],["아달월 십삼일","유다인이 자기를 미워하는 자들을 제거함"],["아달월 십사일","지방 유다인이 쉬며 잔치를 베풂"],["아달월 십오일","수산의 유다인이 쉬며 잔치를 베풂"]],"ex":"에스더는 데벳월에 왕궁에 들어갔고, 니산월에 부르를 뽑아 아달월이 정해졌어요. 시완월 이십삼일에 새 조서가 쓰였고, 아달월 십삼일에 유다인이 대적을 제거한 뒤 지방은 십사일, 수산은 십오일에 쉬었어요."},{"type":"piece","ref":"에스더 2:19-22","q":"대궐 문에 앉아 있다가 문지기 내시 두 사람이 왕을 암살하려는 음모를 알고 왕후에게 알린 베냐민 자손은?","w":["모르","드","개"],"d":["므르","데레","게","드고"],"ex":"모르드개는 대궐 문에 앉아 있다가 빅단과 데레스의 음모를 알고 에스더에게 알렸고, 이 일은 궁중 일기에 기록되었어요."},{"type":"piece","ref":"에스더 2:15","q":"모르드개의 삼촌이며 에스더의 아버지인 사람은?","w":["아비","하","일"],"d":["아비가","야일","하닷","일라"],"ex":"에스더 2:15에서 에스더는 모르드개의 삼촌 아비하일의 딸로 소개돼요."},{"ref":"욥기 2:7-8","ex":"사탄이 욥을 쳐서 발바닥부터 정수리까지 종기가 나자, 욥은 재 가운데 앉아 질그릇 조각으로 몸을 긁었어요.","v":[["온몸에 종기가 난 욥이 몸을 긁는 데 쓴 것은?",["질그릇 조각","깨진 기왓장","돌 조각","나뭇가지","쇠붙이","짐승의 뼈"]],["종기가 난 욥이 앉아 있던 곳은?",["재 가운데","성문 어귀","장막 문","거름더미 위","무화과나무 아래","들판"]]]},{"ref":"욥기 32:2, 4","ex":"엘리후는 람 종족 부스 사람 바라겔의 아들이에요. 세 친구의 나이가 자기보다 여러 해 위라서 말하기를 참고 있었어요.","v":[["욥기 32장에서 처음 말을 시작하는 엘리후의 아버지 이름은?",["바라겔","바락","브두엘","아미대","바르실래","아히둡"]],["엘리후가 그동안 욥에게 말하기를 참고 있었던 까닭은?",["세 친구의 나이가 자기보다 많아서","욥이 너무 아파 보여서","하나님께서 말하지 말라 하셔서","욥의 종이었기 때문에","뒤늦게 도착해서","욥의 아내가 막아서"]]]},{"ref":"욥기 42:7-8, 10","ex":"여호와께서 엘리바스와 두 친구에게 수소 일곱과 숫양 일곱을 가지고 욥에게 가서 번제를 드리게 하시고, 욥이 그들을 위해 기도하게 하셨어요.","v":[["여호와께서 욥의 세 친구에게 가지고 가서 번제로 드리라 하신 것은?",["수소 일곱과 숫양 일곱","수소 셋과 숫양 셋","숫양 일곱과 어린 양 일곱","수소 하나와 숫양 둘","수소 열과 숫양 열","숫염소 일곱"]],["그 번제 때 세 친구를 위하여 기도하게 하신 사람은?",["욥","엘리후","엘리바스","모세","사무엘","욥의 아내"]]]},{"ref":"욥기 2:12-13","ex":"세 친구는 밤낮 칠 일 동안 욥과 함께 땅에 앉아 있었지만, 고통이 심한 것을 보고 한마디도 하지 못했어요.","v":[["욥을 찾아온 세 친구가 욥과 함께 땅에 앉아 있었던 기간은?",["밤낮 칠 일","밤낮 삼 일","사십 일","하루 밤낮","열흘","한 달"]],["세 친구가 욥 곁에 앉아 있던 동안 욥에게 한 말은?",["한마디도 하지 않음","위로의 말을 함","죄를 회개하라고 함","함께 기도함","하나님을 원망함","찬송을 부름"]]]},{"type":"multi","ref":"욥기 38:39-41; 39:1-30","q":"욥기 38~39장에서 여호와께서 욥에게 말씀하실 때 나오는 짐승과 새를 모두 고르세요.","yes":["사자","까마귀","산 염소","들나귀","들소","타조","말","매","독수리"],"no":["비둘기","곰","여우","낙타"],"ex":"여호와께서 사자, 까마귀 새끼, 산 염소와 암사슴, 들나귀, 들소, 타조, 말, 매, 독수리를 들어 욥에게 물으셨어요."},{"type":"order","ref":"욥기 3:1; 4:1; 8:1; 11:1; 32:2; 38:1","q":"욥기의 장면을 본문 순서대로 놓으세요.","seq":["욥이 자기의 생일을 저주함","데만 사람 엘리바스의 첫 대답","수아 사람 빌닷의 첫 대답","나아마 사람 소발의 첫 대답","엘리후가 화를 내며 말을 시작함","여호와께서 폭풍우 가운데에서 말씀하심"],"ex":"3장 욥의 탄식, 4장 엘리바스, 8장 빌닷, 11장 소발의 첫 대답, 32장 엘리후, 38장 여호와의 말씀 순이에요."},{"type":"match","ref":"욥기 1:13-19; 2:7","q":"욥에게 닥친 재난과 그로 인해 잃거나 입은 것을 바르게 짝지으세요.","L":"닥친 재난","R":"잃거나 입은 것","pairs":[["스바 사람","소와 나귀"],["하나님의 불","양과 종들"],["갈대아 사람 세 무리","낙타"],["큰 바람","맏아들 집과 그 안의 자녀들"],["사탄이 침","발바닥부터 정수리까지 종기"]],"ex":"스바 사람은 소와 ,"v":[["잠언 22장에서, 아이에게 마땅히 행할 길을 가르치면 언제가 되어도 그 길을 떠나지 않는다고 했나요?",["늙어도","장가들어도","부자가 되어도","먼 땅에 가도","왕이 되어도","환난을 당해도"]],["잠언 22장에서 늙어도 떠나지 않도록 아이에게 가르치라고 한 것은?",["마땅히 행할 길","여호와의 율법","조상의 전통","지혜의 근본","의인의 길","명철의 길"]]],"ex":"잠언 22장 6절은 마땅히 행할 길을 아이에게 가르치면 늙어도 그 길을 떠나지 않는다고 말해요."},{"ref":"잠언 31:1, 4","v":[["잠언 31장은 르무엘 왕에게 누가 훈계한 잠언이라고 소개되나요?",["그의 어머니","그의 아버지","선지자","그의 스승","그의 아내","궁중의 지혜자"]],["잠언 31장에서 르무엘 왕의 어머니가 왕들에게 마땅하지 않다고 한 것은?",["포도주를 마시는 것","사냥하는 것","말을 많이 두는 것","금을 많이 쌓는 것","높은 성을 쌓는 것","먼 나라와 언약하는 것"]]],"ex":"잠언 31장은 르무엘 왕의 어머니가 그를 훈계한 잠언으로, 포도주를 마시는 것이 왕들에게 마땅하지 않다고 가르쳐요."},{"ref":"잠언 25:11","v":[["잠언 25장에서 '경우에 합당한 말'을 아로새긴 은 쟁반에 담긴 무엇에 비유했나요?",["금 사과","포도송이","석류","꿀송이","진주","감람 열매"]],["잠언 25장에서 경우에 합당한 말은 금 사과를 무엇에 담은 것과 같다고 했나요?",["아로새긴 은 쟁반","금 대접","놋 바구니","옥합","은 주머니","질그릇"]]],"ex":"잠언 25장 11절은 경우에 합당한 말을 아로새긴 은 쟁반에 놓인 금 사과에 비유해요."},{"ref":"잠언 16:18","v":[["잠언 16장에서 '패망의 선봉'이라고 한 것은?",["교만","게으름","분노","탐욕","거짓말","시기"]],["잠언 16장에서 거만한 마음은 무엇의 앞잡이라고 했나요?",["넘어짐","가난","수치","다툼","사망","멸망"]]],"ex":"잠언 16장 18절은 교만은 패망의 선봉이고, 거만한 마음은 넘어짐의 앞잡이라고 말해요."},{"ref":"잠언 26:13","v":[["잠언 26장에서 게으른 자가 밖에 나가지 않으려고 '길에 무엇이 있다'고 핑계하나요?",["사자","곰","뱀","도적","강도","원수"]],["잠언 26장에서 '길에 사자가 있다, 거리에 사자가 있다'고 말하는 사람은?",["게으른 자","미련한 자","거만한 자","겁 많은 자","악인","거짓말하는 자"]]],"ex":"잠언 26장 13절에서 게으른 자는 길에도 거리에도 사자가 있다고 핑계를 대요."},{"type":"verse","l":["pro",4,23],"ref":"잠언 4:23","q":"이 구절에서 모든 지킬 만한 것 중에 더욱 지키라고 한 것은?","a":["네 마음","네 입술","네 발","네 눈","네 혀","네 손"],"ex":"잠언 4장 23절은 무엇보다 마음을 지키라고 하며, 생명의 근원이 거기서 난다고 말해요."},{"type":"verse","l":["pro",27,17],"ref":"잠언 27:17","q":"이 구절에서 철이 철을 날카롭게 하듯, 사람이 그의 친구의 무엇을 빛나게 한다고 했나요?","a":["얼굴","마음","이름","눈","길","영혼"],"ex":"잠언 27장 17절은 철이 철을 날카롭게 하는 것처럼 사람이 친구의 얼굴을 빛나게 한다고 말해요."},{"type":"multi","ref":"잠언 8:10-11, 19","q":"잠언 8장에서 지혜(그 훈계·지식·열매·소득)가 그보다 낫다고 비교한 것을 모두 고르세요.","yes":["은","정금","진주","금","순은"],"no":["홍보석","청옥","상아","수정"],"ex":"잠언 8장에서 지혜는 은과 정금보다 훈계와 지식을 받으라 하고, 지혜가 진주보다 나으며, 그 열매는 금이나 정금보다, 소득은 순은보다 낫다고 해요."},{"type":"order","ref":"잠언 7:6-22","q":"잠언 7장에서 음녀에게 끌려가는 젊은이 이야기를 본문 순서대로 놓으세요.","seq":["창으로 내다보니 지혜 없는 젊은이가 보임","젊은이가 음녀의 골목 모퉁이를 지나감","기생의 옷을 입은 여인이 그를 맞음","여인이 그를 붙잡고 입맞춤","여인이 화목제를 드려 서원을 갚았다고 말함","여인이 침상에 애굽의 무늬 있는 이불을 폈다고 말함","여인이 남편은 먼 길을 갔다고 말함","젊은이가 소가 도수장으로 가듯 따라감"],"ex":"잠언 7장은 창밖으로 젊은이를 봄, 음녀의 골목으로 감, 기생의 옷을 입은 여인의 마중, 입맞춤, 화목제와 서원 이야기, 침상 자랑, 남편이 먼 길 갔다는 말, 도수장으로 가는 소처럼 따라감 순이에요."},{"type":"match","ref":"잠언 25:13-14, 18-19, 26, 28","q":"잠언 25장의 비유와 그것이 가리키는 사람이나 일을 바르게 짝지으세요.","L":"비유","R":"가리키는 것","pairs":[["추수하는 날의 얼음 냉수","충성된 사자"],["비 없는 구름과 바람","선물한다고 거짓 자랑하는 자"],["방망이와 칼과 뾰족한 화살","이웃을 쳐서 거짓 증거하는 사람"],["부러진 이와 위골된 발","환난 날에 진실하지 못한 자를 의뢰함"],["흐려진 우물과 더러워진 샘","악인 앞에 굴복하는 의인"],["무너지고 성벽이 없는 성읍","자기 마음을 제어하지 않는 자"]],"ex":"충성된 사자는 추수 날의 얼음 냉수, 거짓 자랑하는 자는 비 없는 구름과 바람, 거짓 증인은 방망이·칼·화살, 진실하지 못한 자를 의뢰함은 부러진 이와 위골된 발, 악인 앞에 굴복하는 의인은 흐려진 우물, 마음을 제어하지 못하는 자는 성벽 없는 성읍이에요."},{"type":"match","ref":"잠언 26:1-2, 11, 14, 17, 21","q":"잠언 26장의 비유와 그것이 가리키는 사람이나 일을 바르게 짝지으세요.","L":"비유","R":"가리키는 것","pairs":[["여름에 눈, 추수 때에 비","미련한 자에게 주는 영예"],["떠도는 참새와 날아가는 제비","까닭 없는 저주"],["토한 것을 도로 먹는 개","미련한 것을 거듭 행하는 자"],["돌쩌귀를 따라 도는 문짝","침상에서 도는 게으른 자"],["개의 귀를 잡는 자","상관없는 다툼에 간섭하는 자"],["숯불 위에 더하는 숯","시비를 일으키는 다툼 좋아하는 자"]],"ex":"잠언 26장은 미련한 자의 영예를 여름의 눈에, 까닭 없는 저주를 참새와 제비에, 미련함을 되풀이하는 자를 토한 것을 먹는 개에, 게으른 자를 문짝에, 남의 다툼에 끼어드는 자를 개의 귀를 잡는 자에, 다툼 좋아하는 자를 숯불에 더한 숯에 비유해요."},{"type":"piece","ref":"잠언 25:1","q":"잠언 25장에서 솔로몬의 잠언을 편집한 신하들은 어느 유다 왕의 신하들이었나요?","w":["히스","기","야"],"d":["요시","웃시","아하","므낫"],"ex":"잠언 25장 1절은 이것도 솔로몬의 잠언이며 유다 왕 히스기야의 신하들이 편집한 것이라고 소개해요."},{"ref":"전도서 1:9","v":[["전도서 1장에서 '해 아래에는 무엇이 없다'고 했나요?",["새 것","쉼","영원한 것","의인","참된 기쁨","끝"]],["전도서 1장에서 이미 있던 것은 후에 어떻게 된다고 했나요?",["다시 있게 된다","영원히 사라진다","더 크게 된다","새 것으로 바뀐다","바람에 날려 간다","땅에 묻힌다"]]],"ex":"전도서 1장 9절은 이미 있던 것이 후에 다시 있고 이미 한 일을 다시 하니, 해 아래에는 새 것이 없다고 말해요."},{"ref":"전도서 11:1","v":[["전도서 11장에서 물 위에 던지라고 한 것은?",["네 떡","네 그물","네 씨","네 은","네 짐","네 지팡이"]],["전도서 11장에서 물 위에 던진 떡을 언제 도로 찾는다고 했나요?",["여러 날 후에","이튿날","칠 일 후에","추수 때에","사십 일 후에","늙은 후에"]]],"ex":"전도서 11장 1절은 네 떡을 물 위에 던지라, 여러 날 후에 도로 찾으리라고 말해요."},{"type":"verse","l":["ecc",5,4],"ref":"전도서 5:4","q":"이 구절에서 하나님께 서원하였거든 무엇을 더디게 하지 말라고 했나요?","a":["갚기","기도하기","회개하기","제물 드리기","감사하기","찬송하기"],"ex":"전도서 5장 4절은 하나님께 서원했으면 갚기를 더디게 하지 말고 서원한 것을 갚으라고 해요."},{"type":"multi","ref":"전도서 1:4-7","q":"전도서 1장에서 끝없이 되풀이되는 모습으로 든 것을 모두 고르세요.","yes":["한 세대가 가고 한 세대가 옴","해가 떴던 곳으로 돌아감","바람이 남북으로 돌다 불던 곳으로 돌아감","강물이 바다로 흘러도 바다가 차지 않음"],"no":["달이 찼다가 기욺","비가 내려 땅을 적심","계절이 바뀌어 돌아옴"],"ex":"전도서 1장 4~7절은 세대가 가고 오는 것, 해가 떴던 곳으로 돌아가는 것, 바람이 돌아 불던 곳으로 가는 것, 강물이 바다로 흘러도 바다가 차지 않는 것을 들어요."},{"type":"order","ref":"전도서 2:4-8","q":"전도서 2장에서 전도자가 자기 사업을 크게 한 일들을 본문 순서대로 놓으세요.","seq":["집들을 짓고 포도원을 일굼","동산과 과원을 만들어 과목을 심음","삼림에 물을 주려고 못들을 팜","남녀 노비들을 삼","소와 양 떼를 많이 가짐","은 금과 왕들의 보배를 쌓음","노래하는 남녀들을 둠"],"ex":"전도서 2장은 집과 포도원, 동산과 과원, 못, 노비, 소와 양 떼, 은 금과 보배, 노래하는 남녀 순으로 이어져요."},{"type":"match","ref":"전도서 7:1-3, 5, 8","q":"전도서 7장에서 '~보다 낫다'고 한 것끼리 바르게 짝지으세요.","L":"더 나은 것","R":"그보다 못한 것","pairs":[["좋은 이름","좋은 기름"],["죽는 날","출생하는 날"],["초상집에 가는 것","잔칫집에 가는 것"],["슬픔","웃음"],["지혜로운 사람의 책망","우매한 자들의 노래"],["일의 끝","일의 시작"],["참는 마음","교만한 마음"]],"ex":"전도서 7장은 좋은 이름이 좋은 기름보다, 죽는 날이 출생하는 날보다, 초상집이 잔칫집보다, 슬픔이 웃음보다, 지혜자의 책망이 우매자의 노래보다, 일의 끝이 시작보다, 참는 마음이 교만한 마음보다 낫다고 해요."},{"ref":"아가 2:1","v":[["아가 2장에서 '나는 사론의 무엇'이라고 했나요?",["수선화","백합화","장미","석류","포도나무","사과나무"]],["아가 2장에서 '나는 골짜기의 무엇'이라고 했나요?",["백합화","수선화","샘물","노루","향초","종려나무"]]],"ex":"아가 2장 1절에서 신부는 자신을 사론의 수선화요 골짜기의 백합화라고 말해요."},{"type":"verse","l":["sng",1,5],"ref":"아가 1:5","q":"이 구절에서 신부가 자신은 검으나 아름답다며, 게달의 장막과 함께 견준 것은?","a":["솔로몬의 휘장","다윗의 망대","레바논의 백향목","솔로몬의 가마","헤스본의 연못","길르앗의 염소 떼"],"ex":"아가 1장 5절에서 신부는 예루살렘 딸들에게, 자신이 검으나 아름다워 게달의 장막 같고 솔로몬의 휘장과도 같다고 말해요."},{"type":"multi","ref":"아가 4:13-14","q":"아가 4장에서 신부의 동산에서 나는 것으로 이름이 나온 것을 모두 고르세요.","yes":["석류나무","고벨화","나도풀","번홍화","창포","계수","몰약","침향"],"no":["무화과나무","감람나무","종려나무","백향목"],"ex":"아가 4장 13~14절은 석류나무, 고벨화, 나도풀, 나도, 번홍화, 창포, 계수, 유향목, 몰약, 침향 같은 귀한 향품을 들어요."},{"type":"order","ref":"아가 5:11-15","q":"아가 5장에서 신부가 사랑하는 자의 모습을 묘사한 순서대로 놓으세요.","seq":["머리는 순금 같음","머리털은 까마귀 같이 검음","눈은 시냇가의 비둘기 같음","뺨은 향기로운 꽃밭 같음","입술은 백합화 같음","손은 황옥을 물린 황금 노리개 같음","몸은 청옥을 입힌 상아 같음","다리는 순금 받침의 화반석 기둥 같음"],"ex":"아가 5장은 머리, 머리털, 눈, 뺨, 입술, 손, 몸, 다리 순으로 위에서 아래로 내려가며 묘사해요."},{"type":"match","ref":"아가 4:1-5","q":"아가 4장에서 신부의 모습과 그것을 비유한 것을 바르게 짝지으세요.","L":"신부의 모습","R":"비유","pairs":[["눈","비둘기"],["머리털","길르앗 산 기슭에 누운 염소 떼"],["이","털 깎인 암양"],["입술","홍색 실"],["뺨","석류 한 쪽"],["목","다윗의 망대"],["두 유방","쌍태 어린 사슴"]],"ex":"아가 4장에서 눈은 비둘기, 머리털은 길르앗 산 기슭의 염소 떼, 이는 털 깎인 암양, 입술은 홍색 실, 뺨은 석류 한 쪽, 목은 다윗의 망대, 두 유방은 쌍태 어린 사슴에 비유돼요."},{"type":"piece","ref":"아가 7:4","q":"아가 7장에서 신부의 눈을 헤스본의 어느 문 곁에 있는 연못에 비유했나요?","w":["바드","랍","빔"],"d":["랍바","헤스","본","바알"],"ex":"아가 7장 4절은 신부의 눈을 헤스본 바드랍빔 문 곁의 연못에, 코를 다메섹을 향한 레바논 망대에 비유해요."},{"ref":"이사야 11:1, 10","ex":"이사야 11장은 이새의 줄기에서 한 싹이 나고 그 뿌리에서 가지가 나서 열매를 맺는다고 해요. 그날에 이새의 뿌리에서 난 싹이 만민의 기치로 선다고 했어요.","v":[["이사야 11장에서 한 싹이 나온다고 한 줄기는 누구의 줄기인가요?",["이새","다윗","아브라함","야곱","유다","보아스"]],["이사야 11장에서 그날에 이새의 뿌리에서 난 싹이 무엇으로 선다고 했나요?",["만민의 기치","열방의 빛","시온의 망대","이스라엘의 반석","백성의 목자","성전의 기둥"]]]},{"ref":"이사야 40:6-8","ex":"이사야 40장은 모든 육체가 풀이고 그 아름다움은 들의 꽃 같아서 여호와의 기운이 불면 마르고 시든다고 해요. 그러나 우리 하나님의 말씀은 영원히 선다고 했어요.","v":[["이사야 40장에서 모든 육체를 무엇에 비유했나요?",["풀","안개","그림자","티끌","물거품","연기"]],["이사야 40장에서 풀은 마르고 꽃은 시들어도 영원히 선다고 한 것은?",["우리 하나님의 말씀","시온의 성벽","다윗의 왕위","여호와의 성전","하늘과 땅","조상들의 언약"]]]},{"ref":"이사야 53:7","ex":"이사야 53장 7절은 그가 곤욕을 당해도 입을 열지 않았고, 도수장으로 끌려가는 어린 양과 털 깎는 자 앞의 잠잠한 양 같았다고 해요.","v":[["이사야 53장에서 그가 끌려가는 모습을 무엇에 비유했나요?",["도수장으로 끌려가는 어린 양","우리로 돌아가는 양 떼","제단으로 끌려가는 송아지","광야로 보내지는 염소","덫에 걸린 새","사냥꾼에게 쫓기는 사슴"]],["이사야 53장에서 그는 털 깎는 자 앞의 양처럼 어떠했다고 했나요?",["잠잠히 입을 열지 않음","크게 울부짖음","몸부림치며 달아남","주께 원망함","원수를 저주함","자기 죄를 고백함"]]]},{"type":"multi","ref":"이사야 11:2","q":"이사야 11장에서 이새의 줄기에서 난 이 위에 임하는 여호와의 영을 설명한 낱말을 모두 고르세요.","yes":["지혜","총명","모략","재능","지식","여호와를 경외함"],"no":["인내","온유","기쁨","겸손"],"ex":"11장 2절은 그 위에 지혜와 총명의 영, 모략과 재능의 영, 지식과 여호와를 경외하는 영이 임한다고 해요."},{"type":"order","ref":"이사야 6:3-13","q":"이사야 6장의 장면을 본문 순서대로 놓으세요.","seq":["스랍들이 '거룩하다'를 세 번 외침","이사야가 '화로다 나여' 하고 탄식함","스랍이 제단의 숯을 이사야의 입에 댐","'누가 우리를 위하여 갈꼬' 하시는 음성을 들음","'내가 여기 있나이다 나를 보내소서'라고 대답함","이사야가 '주여 어느 때까지니이까' 하고 물음","그루터기처럼 거룩한 씨가 남는다는 말씀을 들음"],"ex":"스랍들의 '거룩하다' 외침, 이사야의 탄식, 숯이 입에 닿음, 누가 갈까 하시는 음성, '나를 보내소서'라는 대답, '어느 때까지니이까'라는 물음, 거룩한 씨가 그루터기로 남는다는 말씀 순이에요."},{"type":"match","ref":"이사야 11:6-8","q":"이사야 11장 평화의 나라 장면에서 짐승·아이와 그 모습을 바르게 짝지으세요.","L":"짐승·아이","R":"모습","pairs":[["이리","어린 양과 함께 삶"],["표범","어린 염소와 함께 누움"],["암소","곰과 함께 먹음"],["사자","소처럼 풀을 먹음"],["젖 먹는 아이","독사의 구멍에서 장난함"],["젖 뗀 어린 아이","독사의 굴에 손을 넣음"]],"ex":"이리는 어린 양과 함께 살고, 표범은 어린 염소와 함께 누우며, 암소와 곰이 함께 먹고, 사자는 소처럼 풀을 먹어요. 젖 먹는 아이는 독사의 구멍에서 장난하고, 젖 뗀 아이는 독사의 굴에 손을 넣어요."},{"type":"verse","l":["isa",55,9],"ref":"이사야 55:9","q":"이 구절에서 하나님의 길과 생각이 우리 것보다 높다는 것을 무엇에 견주었나요?","a":["하늘이 땅보다 높음","산이 골짜기보다 높음","해가 달보다 밝음","바다가 강보다 깊음","독수리가 참새보다 높이 낢","백향목이 풀보다 큼"],"ex":"이사야 55장 9절은 하늘이 땅보다 높은 것처럼 하나님의 길과 생각이 우리의 길과 생각보다 높다고 해요."},{"type":"piece","ref":"이사야 37:37-38","q":"앗수르 왕 산헤립이 니스록의 신전에서 경배할 때, 사레셀과 함께 그를 칼로 죽인 아들은?","w":["아드","람","멜렉"],"d":["에벳","사레","아드라","멜기"],"ex":"이사야 37장 38절에서 산헤립은 니스록의 신전에서 경배하다가 아들 아드람멜렉과 사레셀의 칼에 죽었고, 두 사람은 아라랏 땅으로 도망했어요."},{"ref":"예레미야 29:7, 10","ex":"예레미야가 바벨론 포로들에게 보낸 편지는 끌려간 그 성읍의 평안을 구하고 그곳을 위해 여호와께 기도하라고 했어요. 또 바벨론에서 칠십 년이 차면 돌아오게 하시겠다고 했어요.","v":[["예레미야가 바벨론 포로들에게 보낸 편지에서, 바벨론에서 몇 년이 차면 돌아오게 하시겠다고 했나요?",["칠십 년","사십 년","오십 년","육십 년","팔십 년","백 년"]],["예레미야 29장 편지에서 포로들에게 그 평안을 구하고 그곳을 위해 여호와께 기도하라고 한 것은?",["사로잡혀 간 그 성읍","예루살렘 성전","유다 왕의 집","고향에 남은 가족","조상들의 땅","이스라엘의 남은 자"]]]},{"ref":"예레미야 31:31-33","ex":"예레미야 31장의 새 언약은 조상들을 애굽 땅에서 인도해 내던 날에 맺은 언약과 같지 않아요. 하나님이 그 법을 그들 속에 두고 마음에 기록하시겠다고 했어요.","v":[["예레미야 31장의 새 언약에서 하나님이 나의 법을 어디에 기록하겠다고 하셨나요?",["그들의 마음","돌판","성전 문설주","두루마리","손목","이마"]],["예레미야 31장에서 새 언약은 언제 맺은 언약과 같지 않다고 했나요?",["조상들을 애굽 땅에서 인도해 내던 날","아브라함에게 할례를 명하던 날","다윗을 왕으로 세우던 날","노아가 방주에서 나오던 날","솔로몬이 성전을 봉헌하던 날","요시야가 율법책을 찾던 날"]]]},{"ref":"예레미야 37:21","ex":"예레미야 37장 21절에서 시드기야 왕은 예레미야를 감옥 뜰에 두고, 떡 만드는 자의 거리에서 날마다 떡 한 개씩 가져다주게 했어요. 성중에 떡이 떨어질 때까지 그랬어요.","v":[["시드기야 왕이 감옥 뜰에 둔 예레미야에게 날마다 준 것은?",["떡 한 개","물 한 병","떡 두 개","보리떡 다섯 개","무화과 한 뭉치","고기 한 조각"]],["시드기야 왕이 예레미야에게 줄 떡을 가져오게 한 곳은?",["떡 만드는 자의 거리","왕궁 부엌","성전 곳간","베냐민 문 시장","제사장의 집","골짜기 문 곁 가게"]]]},{"type":"multi","ref":"예레미야 1:10","q":"예레미야 1장에서 하나님이 예레미야를 여러 나라와 왕국 위에 세워 하게 하신 일을 모두 고르세요.","yes":["뽑기","파괴하기","파멸하기","넘어뜨리기","건설하기","심기"],"no":["고치기","모으기","지키기","씻기"],"ex":"예레미야 1장 10절에서 하나님은 예레미야를 세워 뽑고 파괴하며 파멸하고 넘어뜨리며 건설하고 심게 하셨어요."},{"type":"order","ref":"예레미야 52:7-13","q":"예레미야 52장 예루살렘이 함락될 때의 일을 본문 순서대로 놓으세요.","seq":["성벽이 뚫려 군사들이 밤에 성에서 도망함","갈대아 군대가 여리고 평지에서 시드기야를 따라잡음","시드기야가 하맛 땅 리블라의 바벨론 왕에게 끌려감","시드기야의 눈 앞에서 그의 아들들이 죽임을 당함","시드기야의 두 눈을 뺌","놋사슬로 결박해 바벨론으로 끌고 감","느부사라단이 성전과 왕궁을 불사름"],"ex":"성벽이 뚫려 밤에 도망했지만 여리고 평지에서 잡혀 리블라로 끌려갔어요. 아들들이 눈 앞에서 죽고 두 눈이 뽑힌 뒤 놋사슬에 묶여 바벨론으로 갔고, 그 뒤 느부사라단이 성전과 왕궁을 불살랐어요."},{"type":"match","ref":"예레미야 20:1-2; 28:10; 37:13; 40:5, 13-14; 41:2","q":"예레미야서에 나오는 인물과 그가 한 일을 바르게 짝지으세요.","L":"인물","R":"한 일","pairs":[["바스훌","예레미야를 때리고 목에 나무 고랑을 씌움"],["하나냐","예레미야의 목에서 멍에를 빼앗아 꺾음"],["이리야","베냐민 문에서 예레미야를 붙잡음"],["느부사라단","예레미야에게 양식과 선물을 주어 보냄"],["요하난","그다랴에게 이스마엘을 조심하라고 경고함"],["이스마엘","미스바에서 그다랴를 칼로 쳐 죽임"]],"ex":"바스훌은 예레미야를 때리고 나무 고랑을 씌웠고, 하나냐는 멍에를 꺾었어요. 이리야는 베냐민 문에서 예레미야를 붙잡았고, 느부사라단은 양식과 선물을 주어 보냈어요. 요하난이 경고했지만 이스마엘은 미스바에서 그다랴를 죽였어요."},{"type":"piece","ref":"예레미야 23:5-6","q":"예레미야 23장에서 하나님이 다윗에게 일으키실 의로운 가지를 부를 이름은?","w":["여호와","우리의","공의"],"a":"여호와 우리의 공의","d":["의로운","가지","평강","우리는"],"ex":"예레미야 23장 5~6절은 다윗에게 일으키실 의로운 가지가 왕이 되어 다스리고, 그 이름을 '여호와 우리의 공의'라 부를 것이라고 해요."},{"ref":"예레미야애가 5:21","ex":"예레미야애가 5장 21절은 우리를 주께로 돌이켜 주시면 돌아가겠으니, 우리의 날들을 다시 새롭게 하사 옛적 같게 해 달라고 기도해요.","v":[["예레미야애가 5장 마지막 기도에서 우리의 날들을 어떻게 해 달라고 구했나요?",["다시 새롭게 하사 옛적 같게","길게 하사 장수하게","평안하게 하사 전쟁이 없게","풍성하게 하사 배부르게","거룩하게 하사 흠이 없게","짧게 하사 고난이 끝나게"]],["예레미야애가 5장에서 백성이 여호와께 자기들을 주께로 어떻게 해 달라고 구했나요?",["돌이켜 달라","데려가 달라","숨겨 달라","씻어 달라","들어 올려 달라","가까이 불러 달라"]]]},{"type":"multi","ref":"예레미야애가 3:24-27, 33","q":"예레미야애가 3장에 나오는 고백을 모 const NT6=[{"ref":"로마서 4:19","ex":"로마서 4장에서 아브라함은 백 세쯤 되어 자기 몸과 사라의 태가 죽은 것 같음을 알고도 믿음이 약해지지 않았어요.","v":[["로마서 4장에서 아브라함이 자기 몸이 죽은 것 같음을 알고도 믿음이 약해지지 않았을 때의 나이는?",["백 세","구십 세","칠십오 세","팔십육 세","백십 세","백이십 세"]],["로마서 4장에서 아브라함이 백 세쯤 되었을 때 '태가 죽은 것 같다'고 한 사람은?",["사라","하갈","리브가","그두라","라헬","밀가"]]]},{"ref":"로마서 5:14","ex":"로마서 5장은 아담부터 모세까지 사망이 왕 노릇 했다고 하며, 아담을 오실 자의 모형이라고 했어요.","v":[["로마서 5장에서 '오실 자의 모형'이라고 한 사람은?",["아담","아브라함","모세","노아","다윗","멜기세덱"]],["로마서 5장에서 사망이 왕 노릇 한 때는 아담부터 누구까지라고 했나요?",["모세","노아","아브라함","다윗","엘리야","세례 요한"]]]},{"ref":"로마서 9:21","ex":"로마서 9장에서 바울은 토기장이가 진흙 한 덩이로 귀히 쓸 그릇과 천히 쓸 그릇을 만들 권한이 있다고 했어요.","v":[["로마서 9장에서 진흙 한 덩이로 여러 그릇을 만들 권한이 있다고 한 사람은?",["토기장이","목수","대장장이","은장색","농부","장막 만드는 사람"]],["로마서 9장에서 토기장이가 진흙 한 덩이로 만든다고 한 두 가지 그릇은?",["귀히 쓸 그릇과 천히 쓸 그릇","금 그릇과 은 그릇","큰 그릇과 작은 그릇","새 그릇과 낡은 그릇","물 그릇과 기름 그릇","깨끗한 그릇과 더러운 그릇"]]]},{"ref":"로마서 11:17","ex":"로마서 11장에서 바울은 이방인 신자를 돌감람나무에 빗대며, 참감람나무에 접붙임을 받아 그 뿌리의 진액을 함께 받는다고 했어요.","v":[["로마서 11장에서 이방인 신자를 빗댄 나무는?",["돌감람나무","무화과나무","포도나무","참감람나무","백향목","뽕나무"]],["로마서 11장에서 돌감람나무 가지가 접붙임을 받아 그 뿌리의 진액을 함께 받는 나무는?",["참감람나무","무화과나무","포도나무","종려나무","백향목","상수리나무"]]]},{"type":"verse","l":["rom",1,16],"ref":"로마서 1:16","q":"이 구절에서 복음이 '먼저' 구원을 주시는 하나님의 능력이 된다고 한 사람들은?","a":["유대인","헬라인","로마인","이방인","제사장들","가난한 자들"],"ex":"로마서 1:16은 복음이 모든 믿는 자에게 구원의 능력이 되는데, 먼저는 유대인에게, 그리고 헬라인에게라고 했어요."},{"type":"verse","l":["rom",8,28],"ref":"로마서 8:28","q":"이 구절에서 하나님을 사랑하는 자들에게 모든 것이 합력하여 이룬다고 한 것은?","a":["선","의","화평","영광","소망","구원"],"ex":"로마서 8:28은 하나님을 사랑하는 자, 곧 그 뜻대로 부르심을 입은 자들에게 모든 것이 합력하여 선을 이룬다고 했어요."},{"type":"multi","ref":"로마서 8:35-39","q":"로마서 8장에서 우리를 그리스도의 사랑에서 끊을 수 없다고 든 것을 모두 고르세요.","yes":["환난","기근","적신","칼","사망","천사들","장래 일","높음"],"no":["질병","옥에 갇힘","풍랑","거짓 형제"],"ex":"로마서 8장은 환난, 곤고, 박해, 기근, 적신, 위험, 칼, 사망, 생명, 천사들, 권세자들, 현재 일, 장래 일, 능력, 높음, 깊음 그 무엇도 우리를 하나님의 사랑에서 끊을 수 없다고 했어요."},{"type":"multi","ref":"로마서 16:21, 23","q":"로마서 16장 끝(21절, 23절)에서 바울과 함께 있으며 로마 교회에 문안한 사람을 모두 고르세요.","yes":["디모데","누기오","야손","소시바더","가이오","에라스도","구아도"],"no":["실라","디도","바나바","누가"],"ex":"21절에는 디모데, 누기오, 야손, 소시바더가, 23절에는 가이오, 에라스도, 구아도가 문안한다고 나와요."},{"type":"order","ref":"로마서 8:29-30","q":"로마서 8장 29-30절에서 하나님이 하신 일을 본문 순서대로 놓으세요.","seq":["미리 아심","미리 정하심","부르심","의롭다 하심","영화롭게 하심"],"ex":"하나님은 미리 아신 자들을 미리 정하시고, 정하신 자들을 부르시고, 부르신 자들을 의롭다 하시고, 의롭다 하신 자들을 영화롭게 하셨어요."},{"type":"order","ref":"로마서 10:14-15","q":"로마서 10장 14-15절에서 '어찌 ~하리요' 하고 이어지는 물음 속 낱말을 본문에 나오는 순서대로 놓으세요.","seq":["부름","믿음","들음","전파함","보내심을 받음"],"ex":"본문은 믿지 않으면 어찌 부르며, 듣지 못하면 어찌 믿으며, 전파하는 자 없이 어찌 들으며, 보내심을 받지 않으면 어찌 전파하겠느냐고 거슬러 올라가며 물어요."},{"type":"match","ref":"로마서 16:4-13","q":"로마서 16장에서 바울이 문안한 사람과 그 사람에 대한 설명을 바르게 짝지으세요.","L":"사람","R":"바울의 설명","pairs":[["브리스가와 아굴라","바울의 목숨을 위해 목까지 내놓음"],["에배네도","아시아에서 그리스도께 처음 맺은 열매"],["마리아","너희를 위하여 많이 수고함"],["아벨레","그리스도 안에서 인정함을 받음"],["헤로디온","바울의 친척"],["루포","주 안에서 택하심을 입음"]],"ex":"브리스가와 아굴라는 목까지 내놓은 동역자, 에배네도는 아시아의 첫 열매, 마리아는 많이 수고한 사람, 아벨레는 인정받은 사람, 헤로디온은 친척, 루포는 택하심을 입은 사람이에요."},{"type":"piece","ref":"로마서 16:7","q":"로마서 16장에서 유니아와 함께 문안을 받은, 바울의 친척이며 바울과 함께 갇혔던 사람은?","w":["안드","로","니고"],"d":["안디","니가","데모","로데"],"ex":"로마서 16:7에서 바울은 친척이며 함께 갇혔던 안드로니고와 유니아에게 문안하라고 했어요. 이들은 사도들에게 존중히 여겨지고 바울보다 먼저 그리스도 안에 있었어요."},{"ref":"고린도전서 1:11","ex":"고린도전서 1장에서 바울은 글로에의 집 편으로 고린도 교회에 분쟁이 있다는 소식을 들었다고 했어요.","v":[["고린도전서 1장에서 고린도 교회에 분쟁이 있다는 소식을 바울에게 알린 사람들은?",["글로에의 집 사람들","그리스보의 집 사람들","가이오의 집 사람들","루디아의 집 사람들","디도와 형제들","아볼로를 따르는 사람들"]],["고린도전서 1장에서 바울이 글로에의 집 편으로 들은 고린도 교회 소식은?",["분쟁이 있다는 것","연보를 다 모았다는 것","기근이 들었다는 것","관리에게 박해를 받는다는 것","새 회당을 지었다는 것","아볼로가 떠났다는 것"]]]},{"ref":"고린도전서 1:14","ex":"고린도전서 1:14에서 바울은 그리스보와 가이오 외에는 고린도 사람 중 아무에게도 세례를 베풀지 않은 것을 감사한다고 했어요.","v":[["고린도전서 1:14에서 바울이 그리스보와 함께 이름을 든, 자기가 세례를 베푼 사람은?",["가이오","아볼로","디모데","실라","디도","아굴라"]],["고린도전서 1:14에서 바울이 가이오와 함께 이름을 든, 자기가 세례를 베푼 사람은?",["그리스보","아볼로","게바","디모데","아굴라","바나바"]]]},{"ref":"고린도전서 5:7-8","ex":"고린도전서 5장에서 바울은 묵은 누룩, 곧 악하고 악의에 찬 누룩을 버리고 누룩 없는 순전함과 진실함의 떡으로 명절을 지키자고 했어요.","v":[["고린도전서 5장에서 '누룩 없는 떡'으로 빗댄 것은?",["순전함과 진실함","사랑과 화평","믿음과 소망" "multi","ref":"갈라디아서 5:1, 13, 16, 26","q":"갈라디아서 5장에서 바울이 권면한 것을 모두 고르세요.","yes":["다시는 종의 멍에를 메지 말라","자유를 육체의 기회로 삼지 말라","사랑으로 서로 종 노릇 하라","성령을 따라 행하라","서로 노엽게 하거나 투기하지 말라"],"no":["할례를 받아 율법을 지키라","날과 달과 절기를 삼가 지키라","예루살렘 사도들에게 먼저 허락을 받으라","제물로 드린 고기를 먹지 말라"],"ex":"5장에서 바울은 종의 멍에를 다시 메지 말고, 자유를 육체의 기회로 삼지 말며 사랑으로 서로 종 노릇 하고, 성령을 따라 행하며 서로 노엽게 하거나 투기하지 말라고 했어요. 할례를 받으면 그리스도께서 아무 유익이 없다고도 했어요."},{"type":"multi","ref":"갈라디아서 2:1, 3, 8-9","q":"갈라디아서 2장에 이름이 나오는 사람을 모두 고르세요.","yes":["바나바","디도","야고보","게바","요한"],"no":["실라","디모데","마가","누가","아볼로"],"ex":"갈라디아서 2장에는 바나바, 디도, 야고보, 게바, 요한(그리고 베드로)의 이름이 나와요. 실라, 디모데, 마가, 누가, 아볼로는 나오지 않아요."},{"type":"order","ref":"갈라디아서 6:1-17","q":"갈라디아서 6장의 내용을 본문 순서대로 놓으세요.","seq":["범죄한 사람을 온유한 심령으로 바로잡으라","짐을 서로 지라","가르침을 받는 자는 가르치는 자와 좋은 것을 함께 하라","무엇으로 심든지 그대로 거두리라","선을 행하되 낙심하지 말라","그리스도의 십자가 외에 자랑할 것이 없다","내 몸에 예수의 흔적을 지니고 있다"],"ex":"6장은 온유한 심령으로 바로잡기(1절), 짐을 서로 지기(2절), 좋은 것을 함께 하기(6절), 심은 대로 거둠(7절), 낙심하지 않기(9절), 십자가 외에 자랑 없음(14절), 예수의 흔적(17절) 순이에요."},{"type":"order","ref":"갈라디아서 4:4-22","q":"갈라디아서 4장의 내용을 본문 순서대로 놓으세요.","seq":["때가 차매 하나님이 아들을 보내심","아들의 영을 우리 마음 가운데 보내심","날과 달과 절기와 해를 지키는 것을 걱정함","해산하는 수고를 다시 함","여종과 자유 있는 여자에게서 난 두 아들 이야기"],"ex":"때가 차매 아들을 보내심(4절), 아들의 영을 보내심(6절), 날과 달과 절기와 해를 지킴(10절), 해산하는 수고(19절), 두 아들 비유(22절) 순이에요."},{"type":"match","ref":"갈라디아서 1:7; 2:9; 3:13; 4:2; 5:9; 6:11","q":"갈라디아서의 내용과 그 내용이 나오는 장을 바르게 짝지으세요.","L":"내용","R":"장","pairs":[["다른 복음은 없다고 함","1장"],["기둥 같은 사람들과 친교의 악수를 함","2장"],["그리스도께서 율법의 저주에서 속량하심","3장"],["상속자가 어릴 때 후견인과 청지기 아래 있음","4장"],["적은 누룩이 온 덩이에 퍼짐","5장"],["이렇게 큰 글자로 친히 씀","6장"]],"ex":"다른 복음은 없다는 말은 1장, 친교의 악수는 2장, 율법의 저주에서 속량하심은 3장, 후견인과 청지기는 4장, 적은 누룩은 5장, 큰 글자로 쓴 것은 6장에 나와요."},{"type":"match","ref":"갈라디아서 4:22-26","q":"갈라디아서 4장의 두 여자 비유에서 대상과 본문의 설명을 바르게 짝지으세요.","L":"비유 속 대상","R":"본문의 설명","pairs":[["하갈","아라비아에 있는 시내 산"],["여종의 아들","육체를 따라 남"],["자유 있는 여자의 아들","약속으로 말미암아 남"],["지금 있는 예루살렘","그 자녀들과 함께 종 노릇 함"],["위에 있는 예루살렘","자유자이며 우리 어머니"]],"ex":"여종의 아들은 육체를 따라, 자유 있는 여자의 아들은 약속으로 말미암아 났어요. 하갈은 ","가시 면류관","사탄의 시험"],"ex":"믿음의 주요 온전하게 하시는 예수께서 앞에 있는 기쁨을 위하여 십자가를 참으시고 부끄러움을 개의치 않으셨으며, 하나님 보좌 우편에 앉으셨어요."},{"type":"multi","ref":"히브리서 1:2-3","q":"히브리서 1장 2~3절에서 아들을 설명한 말을 모두 고르세요.","yes":["만유의 상속자","모든 세계를 지으신 분","하나님의 영광의 광채","그 본체의 형상","능력의 말씀으로 만물을 붙드시는 분","지극히 크신 이의 우편에 앉으신 분"],"no":["섬기는 영","옛 언약의 중보자","낡아지고 쇠하는 첫 언약","광야에서 사십 년 동안 시험한 조상"],"ex":"아들은 만유의 상속자이고, 그로 말미암아 세계가 지어졌으며, 하나님의 영광의 광채요 본체의 형상으로 만물을 붙드시고, 죄를 정결하게 하신 뒤 지극히 크신 이의 우편에 앉으셨다고 했어요."},{"type":"multi","ref":"히브리서 6:1-2","q":"히브리서 6장 1~2절에서 다시 닦지 말자고 한 '터'로 나열된 것을 모두 고르세요.","yes":["죽은 행실을 회개함","하나님께 대한 신앙","세례들","안수","죽은 자의 부활","영원한 심판"],"no":["할례","안식일을 지킴","성전 제사","금식"],"ex":"그리스도의 도의 초보를 버리고, 죽은 행실의 회개, 하나님께 대한 신앙, 세례들, 안수, 죽은 자의 부활, 영원한 심판에 관한 터를 다시 닦지 말고 완전한 데로 나아가자고 했어요."},{"type":"order","ref":"히브리서 12:22-24","q":"히브리서 12장에서 '너희가 이른 곳'으로 나열된 것을 본문 순서대로 놓으세요.","seq":["시온 산","살아 계신 하나님의 도성인 하늘의 예루살렘","천만 천사","하늘에 기록된 장자들의 모임과 교회","만민의 심판자이신 하나님","온전하게 된 의인의 영들","새 언약의 중보자이신 예수"],"ex":"시온 산과 하늘의 예루살렘, 천만 천사, 장자들의 모임과 교회, 심판자이신 하나님, 의인의 영들, 새 언약의 중보자 예수 순으로 나와요."},{"type":"order","ref":"히브리서 13:1-17","q":"히브리서 13장의 권면을 본문 순서대로 놓으세요.","seq":["형제 사랑하기를 계속함","갇힌 자를 생각함","결혼을 귀히 여김","돈을 사랑하지 말고 있는 것으로 족하게 여김","인도하던 자들을 생각함","찬송의 제사를 드림","선을 행하고 서로 나누어 줌","인도하는 자들에게 순종함"],"ex":"13장은 형제 사랑(1절), 갇힌 자 생각(3절), 결혼(4절), 돈(5절), 인도하던 자들(7절), 찬송의 제사(15절), 선행과 나눔(16절), 인도하는 자들에게 순종(17절) 순으로 권면해요."},{"type":"match","ref":"히브리서 5:13-14; 6:19; 8:5; 10:20; 12:1","q":"히브리서의 표현과 그것이 가리키는 것을 바르게 짝지으세요.","L":"표현","R":"가리키는 것","pairs":[["영혼의 닻","앞에 있는 소망"],["휘장","그의 육체"],["젖을 먹는 자","어린 아이"],["단단한 음식","장성한 자의 것"],["구름 같이 둘러싼 것","허다한 증인들"],["땅의 제사장들이 섬기는 것","하늘에 있는 것의 모형과 그림자"]],"ex":"소망은 영혼의 닻 같고(6장), 휘장은 그의 육체이며(10장), 젖을 먹는 자는 어린 아이, 단단한 음식은 장성한 자의 것이에요(5장). 허다한 증인들이 구름 같이 둘러싸고 있고(12장), 땅의 제사장들은 하늘에 있는 것의 모형과 그림자를 섬긴다고 했어요(8장)."},{"type":"match","ref":"히브리서 3:5; 4:7-8; 5:4; 6:13-15","q":"히브리서에 나오는 구약 인물과 그에 대한 말씀을 바르게 짝지으세요.","L":"인물","R":"말씀","pairs":[["모세","하나님의 온 집에서 종으로서 신실함"],["아론","하나님의 부르심을 받은 대제사장의 본보기"],["여호수아","그들에게 안식을 주었더라면"],["다윗","그의 글에 '오늘'이라는 날을 정함"],["아브라함","오래 참아 약속을 받음"]],"ex":"모세는 종으로서 신실했고(3장), 다윗의 글에 '오늘'이 나오며 여호수아가 그들에게 안식을 주었더라면 하는 말씀도 나와요(4장). 대제사장은 아론처럼 하나님의 부르심을 받아야 하고(5장), 아브라함은 오래 참아 약속을 받았어요(6장)."},{"type":"piece","ref":"히브리서 2:10","q":"히브리서 2장에서 하나님이 고난을 통하여 온전하게 하셨다고 한, 예수님을 가리키는 칭호는?","w":["구원","의","창시","자"],"a":"구원의 창시자","d":["믿음","주","중보","창조"],"ex":"히브리서 2장 10절은 그들의 구원의 창시자를 고난을 통하여 온전하게 하셨다고 했어요."},{"ref":"야고보서 1:2-3","ex":"야고보서 1장은 여러 가지 시험을 만나거든 온전히 기쁘게 여기라고 하며, 믿음의 시련이 인내를 만들어 낸다고 했어요.","v":[["야고보서 1장에서 믿음의 시련이 만들어 낸다고 한 것은?",["인내","지혜","소망","겸손","순종","화평"]],["야고보서 1장에서 여러 가지 시험을 만나면 어떻게 여기라고 했나요?",["온전히 기쁘게","하나님의 징계로","잠깐 지나갈 바람으로","마땅한 벌로","부끄러운 일로","조상의 죄 때문으로"]]]},{"ref":"야고보서 1:19-20","ex":"듣기는 속히, 말하기와 성내기는 더디 하라고 했어요. 사람의 성냄은 하나님의 의를 이루지 못하기 때문이에요.","v":[["야고보서 1장에서 '속히' 하라고 한 것은?",["듣기","말하기","성내기","용서하기","구제하기","판단하기"]],["야고보서 1장에서 사람의 성냄이 이루지 못한다고 한 것은?",["하나님의 의","형제의 화목","믿음의 열매","온전한 인내","교회의 질서","마음의 평안"]]]},{"ref":"야고보서 2:2-3","ex":"회당에 금 가락지를 끼고 아름다운 옷을 입은 사람과 남루한 옷을 입은 가난한 사람이 들어올 때, 부자만 좋은 자리에 앉히는 차별을 꾸짖었어요.","v":[["야고보서 2장의 차별 이야기에서 부자가 손에 끼고 있던 것은?",["금 가락지","은 팔찌","인장 반지","진주 반지","금 팔찌","보석 반지"]],["야고보서 2장의 차별 이야기에서 가난한 사람이 입은 옷은?",["남루한 옷","베옷","털옷","흰 옷","자색 옷","가죽 옷"]]]},{"ref":"야고보서 2:19","ex":"하나님은 한 분이신 줄 귀신들도 믿고 떤다고 하며 행함 없는 믿음을 경계했어요.","v":[["야고보서 2장에서 하나님은 한 분이신 줄 믿고 떤다고 한 것은?",["귀신들","부자들","이방인들","선생들","거짓 선지자들","세리들"]],["야고보서 2장에서 귀신들도 믿고 떤다고 한 내용은?",["하나님은 한 분이심","예수는 그리스도이심","심판 날이 가까움","천사가 있음","죽은 자가 다시 삶","율법이 거룩함"]]]},{"type":"verse","l":["jas",5,14],"ref":"야고보서 5:14","q":"이 구절에서 병든 자가 청하라고 한 사람들은?","a":["교회의 장로들","제사장들","의원들","선지자들","집사들","사도들"],"ex":"병든 자는 교회의 장로들을 청하고, 장로들은 주의 이름으로 기름을 바르며 그를 위하여 기도하라고 했어요."},{"type":"multi","ref":"야고보서 3:17","q":"야고보서 3장에서 위로부터 난 지혜의 특징으로 나온 것을 모두 고르세요.","yes":["성결","화평","관용","양순","긍휼과 선한 열매가 가득함","편견과 거짓이 없음"],"no":["독한 시기","다툼","자랑","혼란"],"ex":"위로부터 난 지혜는 첫째 성결하고, 화평하고, 관용하고, 양순하며, 긍휼과 선한 열매가 가득하고, 편견과 거짓이 없다고 했어요. 시기와 다툼이 있는 곳에는 혼란과 악한 일이 있어요."},{"type":"multi","ref":"야고보서 4:7-10","q":"야고보서 4장 7~10절에서 명령한 것을 모두 고르세요.","yes":["하나님께 복종하라","마귀를 대적하라","하나님을 가까이하라","손을 깨끗이 하라","마음을 성결하게 하라","주 앞에서 낮추라"],"no":["하늘로 맹세하라","제물을 드리라","높은 자리에 앉으라","금식하며 재를 쓰라"],"ex":"하나님께 복종하고 마귀를 대적하며, 하나님을 가까이하고 손을 깨끗이, 마음을 성결하게 하고, 슬퍼하고 울며 주 앞에서 낮추라고 했어요."},{"type":"order","ref":"야고보서 1:14-15","q":"야고보서 1장에서 시험이 사망에 이르는 과정을 본문 순서대로 놓으세요.","seq":["자기 욕심에 끌려 미혹됨","욕심이 잉태함","죄를 낳음","죄가 장성함","사망을 낳음"],"ex":"각 사람이 자기 욕심에 끌려 미혹되고, 욕심이 잉태하면 죄를 낳고, 죄가 장성하면 사망을 낳는다고 했어요."},{"type":"order","ref":"야고보서 1:5; 2:8; 3:1; 4:1; 5:1","q":"야고보서의 말씀을 본문 순서대로 놓으세요.","seq":["지혜가 부족하면 하나님께 구하라","이웃 사랑의 '최고의 법'을 지키면 잘하는 것","선생 된 우리가 더 큰 심판을 받음","싸움과 다툼은 정욕으로부터 나옴","부한 자들아 울고 통곡하라"],"ex":"지혜를 구하라는 말씀은 1장, 최고의 법은 2장, 선생의 더 큰 심판은 3장, 정욕에서 나는 싸움은 4장, 부한 자들에 대한 경고는 5장에 나와요."},{"type":"match","ref":"야고보서 1:6, 10, 23-24; 2:26; 4:14","q":"야고보서의 비유와 그것이 가리키는 것을 바르게 짝지으세요.","L":"비유","R":"가리키는 것","pairs":[["바람에 밀려 요동하는 바다 물결","의심하는 자"],["풀의 꽃","부한 자"],["거울로 얼굴을 보고 곧 잊는 사람","말씀을 듣고 행하지 않는 자"],["잠깐 보이다가 없어지는 안개","너희 생명"],["영혼 없는 몸","행함이 없는 믿음"]],"ex":"의심하는 자는 바다 물결 같고, 부한 자는 풀의 꽃처럼 지나가며, 듣고 행하지 않는 자는 거울을 보고 잊는 사람 같아요(1장). 행함 없는 믿음은 영혼 없는 몸처럼 죽은 것이고(2장), 우리 생명은 잠깐 보이다 없어지는 안개예요(4장)."},{"type":"match","ref":"야고보서 2:21, 25; 5:7, 10-11","q":"야고보서에 나오는 사람과 그에 대한 말씀을 바르게 짝지으세요.","L":"사람","R":"말씀","pairs":[["아브라함","아들 이삭을 제단에 바침"],["기생 라합","사자들을 접대해 다른 길로 나가게 함"],["욥","그의 인내를 들었음"],["주의 이름으로 말한 선지자들","고난과 오래 참음의 본"],["농부","이른 비와 늦은 비를 길이 참아 기다림"]],"ex":"아브라함은 이삭을 제단에 바쳤고 라합은 사자들을 접대해 다른 길로 보냈어요(2장). 선지자들은 고난과 오래 참음의 본이고, 욥의 인내를 들었으며, 농부는 이른 비와 늦은 비를 길이 참아 기다린다고 했어요(5장)."},{"type":"piece","ref":"야고보서 2:23","q":"야고보서 2장에서 하나님을 믿어 의로 여김을 받은 아브라함이 칭함을 받았다고 한 이름은?","w":["하나님","의","벗"],"a":"하나님의 벗","d":["친구","종","아버지","백성"],"ex":"아브라함이 하나님을 믿으니 의로 여기셨다는 말씀이 이루어졌고, 그는 하나님의 벗이라 칭함을 받았다고 했어요."},{"type":"piece","ref":"야고보서 1:17","q":"야고보서 1장에서 온갖 좋은 은사와 온전한 선물이 내려온다고 한 분을 부른 이름은?","w":["빛들","의","아버","지"],"a":"빛들의 아버지","d":["별들","어머","영광","나라"],"ex":"야고보서 1장은 온갖 좋은 은사와 온전한 선물이 빛들의 아버지께로부터 내려온다고 했어요."},{"ref":"골로새서 1:20","ex":"골로새서 1장은 그리스도께서 십자가의 피로 화평을 이루시고, 만물이 그로 말미암아 하나님과 화목하게 되기를 기뻐하셨다고 했어요.","v":[["골로새서 1장에서 그리스도께서 화평을 이루신 것은 '그의 십자가의' 무엇으로라고 했나요?",["피","말씀","고난","순종","사랑","능력"]],["골로새서 1장에서 그리스도께서 그의 십자가의 피로 이루셨다고 한 것은?",["화평","승리","언약","정결","영광","자유"]]]},{"ref":"골로새서 2:8","ex":"골로새서 2장은 철학과 헛된 속임수에 사로잡히지 않게 주의하라고 하며, 그것은 사람의 전통과 세상의 초등학문을 따르는 것이지 그리스도를 따르는 것이 아니라고 했어요.","v":[["골로새서 2장에서 누가 너희를 사로잡을까 주의하라고 한 것은 '철학과 헛된' 무엇인가요?",["속임수","자랑","말","지식","꿈","예언"]],["골로새서 2장에서 철학과 헛된 속임수가 따르는 것이라고 한 것은?",["사람의 전통과 세상의 초등학문","모세의 율법과 할례","조상의 유전과 장로들의 규례","이방의 신들과 우상","점술과 별자리","왕의 명령과 법률"]]]},{"type":"multi","ref":"골로새서 2:16","q":"골로새서 2장에서 이것을 이유로 누구든지 너희를 비판하지 못하게 하라고 한 것을 모두 고르세요.","yes":["먹는 것","마시는 것","절기","초하루","안식일"],"no":["십일조","금식","서원","제물"],"ex":"골로새서 2장은 먹고 마시는 것과 절기나 초하루나 안식일 때문에 누구에게도 비판받지 않게 하라고 했어요."},{"type":"order","ref":"골로새서 3:1-17","q":"골로새서 3장의 권면을 본문에 나오는 순서대로 놓으세요.","seq":["위의 것을 찾으라","땅에 있는 지체를 죽이라","옛 사람을 벗고 새 사람을 입음","그리스도의 평강이 마음을 주장하게 하라","그리스도의 말씀이 풍성히 거하게 하라","말에나 일에나 다 주 예수의 이름으로"],"ex":"위의 것을 찾으라(1절), 땅의 지체를 죽이라(5절), 옛 사람을 벗고 새 사람을 입음(9~10절), 그리스도의 평강(15절), 그리스도의 말씀(16절), 주 예수의 이름으로(17절) 순이에요."},{"type":"match","ref":"골로새서 3:18-4:1","q":"골로새서 3~4장에서 권면을 받은 사람과 그 권면을 바르게 짝지으세요.","L":"받는 사람","R":"권면","pairs":[["아내들","남편에게 복종하라"],["남편들","아내를 사랑하며 괴롭게 하지 말라"],["자녀들","모든 일에 부모에게 순종하라"],["아비들","자녀를 노엽게 하지 말라"],["종들","눈가림만 하지 말고 성실한 마음으로"],["상전들","의와 공평을 종들에게 베풀라"]],"ex":"아내는 남편에게 복종하고, 남편은 아내를 사랑하며 괴롭게 하지 말고, 자녀는 부모에게 순종하고, 아비는 자녀를 노엽게 하지 말며, 종은 성실한 마음으로, 상전은 의와 공평을 베풀라고 했어요."},{"type":"verse","l":["col",4,6],"ref":"골로새서 4:6","q":"이 구절에서 너희 말을 항상 은혜 가운데서 무엇으로 맛을 냄과 같이 하라고 했나요?","a":["소금","꿀","기름","향품","포도주","누룩"],"ex":"바울은 말을 늘 은혜 가운데서 소금으로 맛을 내듯 하라고 했고, 그러면 각 사람에게 마땅히 대답할 것을 알게 된다고 했어요."},{"type":"piece","ref":"골로새서 4:12-13","q":"골로새서 4장에서 에바브라가 골로새, 라오디게아와 함께 그곳 사람들을 위해서도 많이 수고한다고 바울이 증언한 곳은?","w":["히에","라","볼리"],"d":["데가","라오","볼","디게"],"ex":"골로새서 4:13에서 바울은 에바브라가 골로새 교인들과 라오디게아, 히에라볼리에 있는 사람들을 위해 많이 수고한다고 증언했어요."},{"ref":"빌레몬서 1:7","ex":"빌레몬서 7절에서 바울은 빌레몬으로 말미암아 성도들의 마음이 평안함을 얻었다고 하며, 그의 사랑으로 많은 기쁨과 위로를 받았다고 했어요.","v":[["빌레몬서에서 빌레몬으로 말미암아 평안함을 얻었다고 한 것은 성도들의 무엇인가요?",["마음","몸","집","믿음","가정","영혼"]],["빌레몬서에서 성도들의 마음이 빌레몬으로 말미암아 얻었다고 한 것은?",["평안함","새 힘","소망","깨달음","용기","찬송"]]]},{"type":"verse","l":["phm",1,19],"ref":"빌레몬서 1:18-19","q":"이 구절에서 바울이 친필로 쓴다고 하며 빌레몬에게 자기가 하겠다고 한 일은?","a":["갚겠다","찾아가겠다","벌을 받겠다","기도하겠다","용서하겠다","편지를 다시 쓰겠다"],"ex":"바울은 오네시모가 빚진 것이 있으면 자기 앞으로 계산하라고 한 뒤, 친필로 쓰며 자기가 갚겠다고 했어요."},{"ref":"빌레몬서 1:22","ex":"빌레몬서 22절에서 바울은 빌레몬에게 자기를 위해 숙소를 마련하라고 하며, 그들의 기도로 그들에게 갈 수 있기를 바란다고 했어요.","v":[["빌레몬서 끝부분에서 바울이 빌레몬에게 자기를 위해 마련하라고 한 것은?",["숙소","겉옷","배","양식","가죽 종이","나귀"]],["빌레몬서에서 바울이 숙소를 마련하라고 하며, 무엇으로 그들에게 갈 수 있기를 바란다고 했나요?",["너희 기도","황제의 허락","형제들의 연보","배편","천사의 인도","군인의 호송"]]]},{"type":"match","ref":"빌레몬서 1:1-2, 10-11, 23","q":"빌레몬서에 나오는 사람과 바울이 그를 소개한 말을 바르게 짝지으세요.","L":"사람","R":"소개한 말","pairs":[["빌레몬","사랑을 받는 자요 동역자"],["압비아","자매"],["아킵보","우리와 함께 병사 된 자"],["에바브라","그리스도 예수 안에서 함께 갇힌 자"],["오네시모","전에는 무익하였으나 이제는 유익한 자"]],"ex":"빌레몬은 사랑받는 동역자, 압비아는 자매, 아킵보는 함께 병사 된 자, 에바브라는 함께 갇힌 자로 소개되고, 오네시모는 전에는 무익했지만 이제는 유익한 사람이라고 했어요."},{"ref":"데살로니가전서 1:3","ex":"데살로니가전서 1:3에서 바울은 그들의 믿음의 역사, 사랑의 수고, 주 예수 그리스도에 대한 소망의 인내를 하나님 앞에서 끊임없이 기억한다고 했어요.","v":[["데살로니가전서 1장에서 바울이 '믿음의 역사', '사랑의 수고'와 함께 끊임없이 기억한다고 한 것은?",["소망의 인내","소망의 기쁨","믿음의 인내","성령의 능력","의의 열매","말씀의 순종"]],["데살로니가전서 1장에서 '사랑의' 뒤에 이어진 말은?",["수고","역사","인내","열매","기쁨","헌신"]]]},{"type":"verse","l":["1th",1,9],"ref":"데살로니가전서 1:9","q":"이 구절에서 데살로니가 사람들이 무엇을 버리고 하나님께로 돌아왔다고 했나요?","a":["우상","죄","세상","재물","율법","미신"],"ex":"데살로니가 사람들이 우상을 버리고 하나님께로 돌아와 살아 계시고 참되신 하나님을 섬긴다는 이야기가 퍼졌다고 했어요."},{"ref":"데살로니가전서 1:10","ex":"데살로니가전서 1:10은 그들이 하늘로부터 강림하실 하나님의 아들을 기다린다고 하며, 그분은 장래의 노하심에서 우리를 건지시는 예수시라고 했어요.","v":[["데살로니가전서 1장에서 데살로니가 교인들이 기다린다고 한 것은?",["하늘로부터 강림하실 그의 아들","바울의 다시 방문","디모데가 돌아오는 것","예루살렘의 회복","박해가 그치는 날","성전의 재건"]],["데살로니가전서 1장에서 예수께서 우리를 무엇에서 건지신다고 했나요?",["장래의 노하심","이 세상의 환난","사망의 그늘","원수의 손","율법의 저주","죄의 종노릇"]]]},{"ref":"데살로니가전서 1:7-8","ex":"데살로니가 교인들은 마게도냐와 아가야에 있는 모든 믿는 자의 본이 되었고, 하나님을 향하는 그들의 믿음의 소문이 각처에 퍼졌어요.","v":[["데살로니가전서 1장에서 데살로니가 교인들이 마게도냐와 함께 본이 되었다고 한 지방은?",["아가야","아시아","갈라디아","길리기아","브루기아","비시디아"]],["데살로니가전서 1장에서 주의 말씀이 마게도냐와 아가야에 들릴 뿐 아니라 각처에 퍼졌다고 한 것은?",["하나님을 향하는 믿음의 소문","교회가 크게 부흥했다는 소문","바울이 옥에 갇혔다는 소문","병자들이 나았다는 소문","재물을 나누었다는 소문","회당에서 쫓겨났다는 소문"]]]},{"ref":"데살로니가후서 3:17","ex":"데살로니가후서 3:17에서 바울은 자기가 친필로 문안한다고 하며, 이것이 편지마다 표시라고 했어요.","v":[["데살로니가후서 끝에서 바울이 친필로 쓴 문안을 편지마다 무엇이라고 했나요?",["표시","증거","인","약속","보증","기념"]],["데살로니가후서 3장에서 바울이 편지마다 표시로서 문안을 어떻게 썼다고 했나요?",["친필로","디모데의 손으로","실루아노가 대신","대필하는 사람을 통해","인을 쳐서","장로들의 이름으로"]]]},{"ref":"데살로니가후서 2:8","ex":"데살로니가후서 2:8은 불법한 자가 나타나면 주 예수께서 그 입의 기운으로 그를 죽이시고, 강림하여 나타나심으로 폐하신다고 했어요.","v":[["데살로니가후서 2장에서 주 예수께서 불법한 자를 무엇으로 죽이신다고 했나요?",["그 입의 기운으로","그 손의 능력으로","하늘의 불로","큰 지진으로","천사의 나팔로","번개로"]],["데살로니가후서 2장에서 주께서 불법한 자를 무엇으로 폐하신다고 했나요?",["강림하여 나타나심으로","성전을 무너뜨리심으로","천사들을 보내심으로","큰 음성으로 꾸짖으심으로","무저갱에 가두심으로","사슬로 결박하심으로"]]]},{"type":"multi","ref":"데살로니가후서 3:6, 12, 14-15","q":"데살로니가후서 3장에서 게으르게 행하는 사람과 관련해 바울이 권면한 것을 모두 고르세요.","yes":["그런 형제에게서 떠나라","그런 사람과 사귀지 말라","지목하여 부끄럽게 하라","형제 같이 권면하라","조용히 일하여 자기 양식을 먹으라"],"no":["원수와 같이 여기라","교회에서 내쫓으라","사탄에게 내주라","음식을 나누어 주라"],"ex":"바울은 게으르게 행하는 형제에게서 떠나고, 순종하지 않는 사람은 지목하여 사귀지 말아 부끄럽게 하되, 원수처럼 생각하지 말고 형제처럼 권면하라고 했어요. 그런 사람들에게는 조용히 일하여 자기 양식을 먹으라고 명했어요."},{"type":"order","ref":"데살로니가후서 1:4; 2:2-3, 15; 3:1, 13, 16","q":"데살로니가후서의 내용을 본문에 나오는 순서대로 놓으세요.","seq":["박해와 환난 중의 인내와 믿음을 자랑함","주의 날이 이르렀다는 말에 흔들리지 말라","먼저 배교하는 일이 있음","가르침을 받은 전통을 지키라","주의 말씀이 퍼져 나가도록 기도해 달라","선을 행하다가 낙심하지 말라","평강의 주께서 평강을 주시기를 빎"],"ex":"박해 중의 인내를 자랑함(1:4), 흔들리지 말라(2:2), 먼저 배교함(2:3), 전통을 지키라(2:15), 기도 부탁(3:1), 낙심하지 말라(3:13), 평강의 축복(3:16) 순이에요."},{"type":"verse","l":["2th",3,3],"ref":"데살로니가후서 3:3","q":"이 구절에서 미쁘신 주께서 너희를 굳건하게 하시고 누구에게서 지키신다고 했나요?","a":["악한 자","불법한 자","거짓 선지자","대적하는 자","박해하는 자","거짓 형제"],"ex":"바울은 주는 미쁘셔서 너희를 굳건하게 하시고 악한 자에게서 지키실 것이라고 했어요."},{"ref":"데살로니가전서 2:2","ex":"데살로니가전서 2:2에서 바울은 자기 일행이 먼저 빌립보에서 고난과 능욕을 당했지만 하나님을 힘입어 데살로니가 사람들에게 복음을 전했다고 했어요.","v":[["데살로니가전서 2장에서 바울 일행이 데살로니가에서 복음을 전하기 전에 먼저 고난과 능욕을 당했다고 한 곳은?",["빌립보","베뢰아","아덴","고린도","루스드라","이고니온"]],["데살로니가전서 2장에서 바울 일행이 먼저 빌립보에서 당했다고 한 것은?",["고난과 능욕","굶주림과 목마름","파선과 표류","돌에 맞음","병과 연약함","가난과 궁핍"]]]},{"type":"match","ref":"데살로니가전서 2:7, 11; 5:2-5","q":"데살로니가전서의 표현과 그것이 가리키는 것을 바르게 짝지으세요.","L":"표현","R":"가리키는 것","pairs":[["유모가 자기 자녀를 기름과 같이","유순한 자가 된 바울 일행"],["아버지가 자기 자녀에게 하듯","각 사람에게 권면하고 위로함"],["밤에 도둑 같이","주의 날이 이름"],["임신한 여자에게 해산의 고통이 이름과 같이","갑자기 이르는 멸망"],["빛의 아들이요 낮의 아들","데살로니가의 형제들"]],"ex":"바울 일행은 유모가 자녀를 기르듯 유순하게 대했고 아버지처럼 각 사람을 권면하고 위로했어요. 주의 날은 밤의 도둑처럼, 멸망은 해산의 고통처럼 갑자기 오며, 형제들은 빛의 아들이요 낮의 아들이라고 했어요."},{"type":"piece","ref":"요한계시록 9:1-11","q":"요한계시록 9장에서 다섯째 천사가 나팔을 분 뒤 나온 황충들의 왕, 곧 무저갱의 사자를 헬라어로 부른 이름은?","w":["아볼","루","온"],"d":["아바","돈","볼로","루아"],"ex":"요한계시록 9:11에서 황충들의 왕인 무저갱의 사자는 히브리어로 아바돈, 헬라어로 아볼루온이라 불렸어요."},{"type":"verse","l":["rev",4,7],"ref":"요한계시록 4:7","q":"이 구절에서 둘째 생물은 무엇 같다고 했나요?","a":["송아지","사자","독수리","사람","어린 양","말"],"ex":"보좌 주위의 네 생물 가운데 첫째는 사자, 둘째는 송아지 같고, 셋째는 얼굴이 사람 같고, 넷째는 날아가는 독수리 같았어요."},{"type":"order","ref":"디모데전서 4:12","q":"디모데전서 4장에서 디모데에게 믿는 자의 본이 되라고 한 것들을 본문 순서대로 놓으세요.","seq":["말","행실","사랑","믿음","정절"],"ex":"바울은 디모데에게 누구도 젊음을 업신여기지 못하게 하고, 말과 행실과 사랑과 믿음과 정절에서 믿는 자의 본이 되라고 했어요."},{"ref":"디모데후서 4:13","ex":"디모데후서 4장에서 바울은 디모데에게 올 때 드로아 가보의 집에 둔 겉옷과, 특별히 가죽 종이에 쓴 책을 가져오라고 했어요.","v":[["디모데후서 4장에서 바울이 드로아에 두고 왔다며 디모데에게 가져오라고 한 것은?",["겉옷","지팡이","신발","전대","장막 천","등불"]],["디모데후서 4장에서 바울이 겉옷을 두고 왔다고 한 드로아의 집은 누구의 집인가요?",["가보","가이오","야손","루디아","빌레몬","아굴라"]]]},{"type":"piece","ref":"디모데후서 1:15","q":"디모데후서 1장에서 아시아에 있는 사람들이 바울을 버렸다고 할 때, 부겔로와 함께 이름이 나온 사람은?","w":["허모","게","네"],"d":["부겔","로","헤르","모네"],"ex":"디모데후서 1:15에서 바울은 아시아에 있는 모든 사람이 자기를 버렸고, 그 가운데 부겔로와 허모게네도 있다고 했어요."},{"ref":"베드로전서 3:6","ex":"베드로전서 3장은 사라가 아브라함을 주라 칭하며 순종한 것처럼, 선을 행하고 두려워하지 않으면 그의 딸이 된다고 말해요.","v":[["베드로전서 3장에서 사라가 아브라함을 무엇이라 칭하며 순종했다고 했나요?",["주","선생","랍비","왕","아버지","형제"]],["베드로전서 3장에서 남편을 주라 칭하며 순종한 본보기로 나오는 여인은?",["사라","리브가","라헬","한나","룻","에스더"]]]},{"type":"multi","ref":"베드로전서 2:1","q":"베드로전서 2장 1절에서 버리라고 한 것을 모두 고르세요.","yes":["악독","기만","외식","시기","비방하는 말"],"no":["교만","탐심","분노","음란"],"ex":"베드로전서 2:1은 모든 악독과 기만과 외식과 시기와 비방하는 말을 버리라고 하고, 이어서 갓난 아기처럼 신령한 젖을 사모하라고 해요."},{"type":"match","ref":"베드로전서 1:24; 2:4, 25; 3:7","q":"베드로전서의 표현과 그것이 가리키는 것을 바르게 짝지으세요.","L":"표현","R":"가리키는 것","pairs":[["풀","모든 육체"],["풀의 꽃","육체의 모든 영광"],["보배로운 산 돌","예수"],["더 연약한 그릇","아내"],["길을 잃은 양","전에 길을 잃었던 너희"]],"ex":"모든 육체는 풀, 그 영광은 풀의 꽃 같다고 했고(1:24), 예수는 보배로운 산 돌(2:4), 아내는 더 연약한 그릇(3:7), 전의 너희는 길 잃은 양 같았다고 했어요(2:25)."},{"type":"match","ref":"베드로전서 2:17-18","q":"베드로전서 2장에서 대상과 그에게 하라고 한 태도를 바르게 짝지으세요.","L":"대상","R":"태도","pairs":[["뭇 사람","공경하라"],["형제","사랑하라"],["하나님","두려워하라"],["왕","존대하라"],["주인(사환들에게)","까다로운 이에게도 순종하라"]],"ex":"뭇 사람을 공경하고 형제를 사랑하며 하나님을 두려워하고 왕을 존대하라고 했어요. 사환들에게는 선한 주인뿐 아니라 까다로운 주인에게도 순종하라고 했어요."},{"ref":"베드로전서 2:7-8","ex":"베드로전서 2:7-8은 믿는 이에게 보배인 그 돌이 믿지 않는 자에게는 모퉁이의 머릿돌이 되고, 부딪치는 돌과 걸려 넘어지게 하는 바위가 되었다고 해요.","v":[["베드로전서 2장에서 믿지 아니하는 자에게 건축자들이 버린 그 돌은 무엇이 되었다고 했나요?",["모퉁이의 머릿돌","성전의 문지방","무너진 담","광야의 이정표","제단의 뿔","성문의 빗장"]],["베드로전서 2장에서 그 돌이 믿지 않는 자에게 부딪치는 돌과 함께 무엇이 되었다고 했나요?",["걸려 넘어지게 하는 바위","무거운 맷돌","굴러 내리는 바위","쪼개진 반석","성벽의 주춧돌","길가의 표석"]]]},{"type":"order","ref":"베드로후서 2:4-7, 15-16","q":"베드로후서 2장에 나오는 옛 사례들을 본문 순서대로 놓으세요.","seq":["범죄한 천사들을 어두운 구덩이에 둠","옛 세상에 홍수를 내림","소돔과 고모라 성을 재가 되게 함","의로운 롯을 건짐","브올의 아들 발람의 길","말 못하는 나귀가 사람의 소리로 말함"],"ex":"범죄한 천사들(4절), 홍수(5절), 소돔과 고모라(6절), 롯의 구원(7절)이 차례로 나오고, 뒤에 발람의 길(15절)과 그를 막은 나귀(16절)가 나와요."},{"ref":"베드로후서 1:16-18","ex":"베드로는 주의 크신 위엄을 친히 보았다고 하며, 그와 함께 거룩한 산에 있을 때 하늘에서 사랑하는 아들이라는 소리를 들었다고 했어요.","v":[["베드로후서 1장에서 베드로가 주와 함께 있을 때 하늘에서 난 소리를 들었다고 한 곳은?",["거룩한 산","감람산","시온 산","갈멜 산","요단 강가","갈릴리 바다"]],["베드로후서 1장에서 베드로가 교묘히 만든 이야기가 아니라 '친히 본 자'라고 하며 말한 것은?",["그의 크신 위엄","그의 빈 무덤","그의 승천하심","그의 십자가","그의 오병이어 기적","그의 물 위를 걸으심"]]]},{"ref":"베드로후서 1:13-14","ex":"베드로후서 1장에서 베드로는 이 장막에 있는 동안 성도들을 일깨우겠다고 하며, 주 예수 그리스도께서 지시하신 대로 자기 장막을 벗어날 때가 가까웠다고 했어요.","v":[["베드로후서 1장에서 베드로 const RANKV={0:0,2:1,1:2};
function mergeIn(data){
  if(!data||data.app!=='bible-quiz'||typeof data.stats!=='object'||!data.stats) return -1;
  let changed=0;
  for(const id in data.stats){
    const x=data.stats[id]; if(!x||typeof x!=='object') continue;
    const xr=+x.r||0, xw=+x.w||0, xl=[0,1,2].includes(x.l)?x.l:1, xb=[0,1,2].includes(x.b)?x.b:xl;
    const st=STATS[id];
    if(!st){ STATS[id]={r:xr,w:xw,l:xl,b:xb}; changed++; continue; }
    const sb=st.b===undefined?st.l:st.b, before=JSON.stringify(st);
    if(xr+xw>st.r+st.w) st.l=xl;
    st.r=Math.max(st.r,xr); st.w=Math.max(st.w,xw); st.b=RANKV[xb]>RANKV[sb]?xb:sb;
    if(JSON.stringify(st)!==before) changed++;
  }
  if(data.reports&&typeof data.reports==='object') for(const box of ['open','sent']){
    const src=data.reports[box]; if(!src||typeof src!=='object') continue;
    for(const id in src){ if(!REPORTS.open[id]&&!REPORTS.sent[id]&&src[id]&&typeof src[id]==='object'){ REPORTS[box][id]=src[id]; changed++; } }
  }
  if(data.reports) try{localStorage.setItem(RSTORE,JSON.stringify(REPORTS));}catch(e){}
  if(data.best&&typeof data.best==='object') for(const k in data.best){
    if(!BEST_RE.test(k)) continue; const v=parseInt(data.best[k],10); if(isNaN(v)) continue;
    try{const cur=parseInt(localStorage.getItem(k)||'',10); if(isNaN(cur)||v>cur){localStorage.setItem(k,String(v));changed++;}}catch(e){}
  }
  return changed;
}

}

// 정답 하나 + 오답 후보 중 무작위 3개
function pickSingle(a){
  const opts=shuffle([a[0],...shuffle(a.slice(1)).slice(0,3)]);
  return {opts,correct:opts.indexOf(a[0])};
}

function build(f){
  const base={id:f.id,type:f.type,t:f.t,ref:f.ref,ex:f.ex,h:f.h};
  if(f.type==="multi"){
    const maxYes=Math.min(4,f.yes.length), minYes=Math.max(2,5-f.no.length);
    const k=minYes+rnd(maxYes-minYes+1);
    const items=[...shuffle(f.yes).slice(0,k).map(s=>({s,y:true})),...shuffle(f.no).slice(0,5-k).map(s=>({s,y:false}))];
    const mixed=shuffle(items);
    return {...base,q:pickQ(f.q),opts:mixed.map(x=>x.s),correct:mixed.map((x,i)=>x.y?i:-1).filter(i=>i>=0)};
  }
  if(f.type==="order"){
    const picks=shuffle(f.seq.map((_,i)=>i)).slice(0,4).sort((a,b)=>a-b);
    const truth=picks.map(i=>f.seq[i]);
    const opts=shuffle(truth);
    return {...base,q:pickQ(f.q),opts,correct:truth.map(s=>opts.indexOf(s))};
  }
  if(f.type==="match"){
    const chosen=[], usedL=new Set(), usedR=new Set();
    for(const p of shuffle(f.pairs)){
      if(usedL.has(p[0])||usedR.has(p[1])) continue;
      chosen.push(p); usedL.add(p[0]); usedR.add(p[1]);
      if(chosen.length===4) break;
    }
    const lefts=shuffle(chosen.map(p=>p[0]));
    const rights=shuffle(chosen.map(p=>p[1]));
    const correct=lefts.map(l=>rights.indexOf(chosen.find(p=>p[0]===l)[1]));
    return {...base,q:pickQ(f.q),L:f.L,R:f.R,opts:lefts,rights,correct};
  }
  if(f.type==="piece"){
    const opts=shuffle([...f.w,...shuffle(f.d).slice(0,2)]);
    return {...base,q:pickQ(f.q),opts,w:f.w,a:f.a||f.w.join('')};
  }
  if(f.type==="verse"){
    return {...base,q:f.q,url:verseUrl(f.l),...pickSingle(f.a)};
  }
  const [q,a]=f.v[rnd(2)];
  return {...base,q,...pickSingle(a)};
}

// 한 판 구성: 유형 비율(하나 고르기 45 · 모두 고르기/순서/짝짓기 각 15 · 본문 10)을 맞춰 뽑고,
// 같은 문제·같은 주제 묶음은 한 판에 한 번만. 주제 묶음은 내부용이라 화면에 나오지 않음.
function pickRound(pool,n){
  for(let k=0;k<50;k++){ const r=tryRound(pool,n); if(r.length>=n) return r; }
  return tryRound(pool,n);
}
// 한 판의 유형별 개수: 범위 안 문제 수 비율(하나 고르기는 2문제로 셈)을 그대로 따름
function quotaFor(pool,n){
  const w={}; let tot=0;
  for(const f of pool){ const x=f.type==="choice"?2:1; w[f.type]=(w[f.type]||0)+x; tot+=x; }
  const q={}, fr=[]; let sum=0;
  for(const t in w){ const e=n*w[t]/tot; q[t]=Math.floor(e); sum+=q[t]; fr.push([t,e-q[t]]); }
  for(let left=n-sum;left>0&&fr.length;left--){
    let r=Math.random()*fr.reduce((x,y)=>x+y[1],0), k=0;
    for(;k<fr.length-1;k++){ r-=fr[k][1]; if(r<0) break; }
    q[fr[k][0]]++; fr.splice(k,1);
  }
  return q;
}
function tryRound(pool,n){
  const quota=quotaFor(pool,n);
  const byType={};
  for(const f of shuffle(pool)) (byType[f.type]=byType[f.type]||[]).push(f);
  const usedG=new Set(), picked=new Set();
  const ok=f=>!picked.has(f)&&!(GMAP[f.id]||[]).some(g=>usedG.has(g));
  const take=f=>{picked.add(f);(GMAP[f.id]||[]).forEach(g=>usedG.add(g));};
  // 묶음에 많이 걸리는 유형부터 채워야 비율이 덜 흐트러짐
  for(const t of ["match","order","multi","piece","verse","choice"]){
    let need=quota[t]||0;
    for(const f of byType[t]||[]){ if(!need) break; if(ok(f)){take(f);need--;} }
  }
  // 모자라면 아무 유형으로나 채움
  for(const f of shuffle(pool)){ if(picked.size>=n) break; if(ok(f)) take(f); }
  return shuffle([...picked]).slice(0,n);
}

  const x=loadPaused();

function newRound(){
  if(range==='wrong'){
    const pool=wrongPool();
    if(!pool.length){ range='all'; return newRound(); }
    round=shuffle(pool).slice(0,ROUND).map(build);
  }else round=pickRound(RANGES[range].pool,ROUND).map(build);
  newSeen=0; fixedWrong=0;
  idx=0; answers=[];
  renderQuestion();
}

      <button class="opt mo${fsCls(it.rights[k])}" data-i="${k}" data-side="R" aria-pressed="false"><span class="dot"></span><span class="txt">${esc(it.rights[k])}</span></button>`).join('');
  return `<div class="mq" style="--lw:${lw}">
      <div class="mlabel">${esc(it.L||'왼쪽')}</div><div></div><div class="mlabel">${esc(it.R||'오른쪽')}</div>${rows}
      <svg class="mlines" aria-hidden="true"></svg>
    </div>`;
}
const setPC=(b,c)=>{for(let k=0;k<4;k++) b.classList.toggle('pc'+k,k===c);};
function drawLines(){
  const it=round[idx]; const mq=app.querySelector('.mq');
  if(!it||it.type!=="match"||!mq) return;
  const svg=mq.querySelector('.mlines'), box=mq.getBoundingClientRect();
  const done=answers.length>idx, m=done?answers[idx].pick:sel.map;
  const at=(side,i)=>{const r=mq.querySelector(`.opt[data-side="${side}"][data-i="${i}"] .dot`).getBoundingClientRect();return [r.left+r.width/2-box.left,r.top+r.height/2-box.top];};
  let out='';
  m.forEach((j,i)=>{
    if(j<0) return;
    const [x1,y1]=at('L',i), [x2,y2]=at('R',j), ok=it.correct[i]===j, bend=Math.max(18,(x2-x1)*0.45);
    out+=`<path class="ln ${done?(ok?'ok':'bad'):'pc'+i}" d="M${x1} ${y1} C${x1+bend} ${y1} ${x2-bend} ${y2} ${x2} ${y2}"/>`;
    if(done&&!ok){const t=.72,u=1-t,mx=u*u*u*x1+3*u*u*t*(x1+bend)+3*u*t*t*(x2-bend)+t*t*t*x2,my=u*u*u*y1+3*u*u*t*y1+3*u*t*t*y2+t*t*t*y2;out+=`<g class="xm"><circle cx="${mx}" cy="${my}" r="10"/><path d="M${mx-4} ${my-4}L${mx+4} ${my+4}M${mx+4} ${my-4}L${mx-4} ${my+4}"/></g>`;}
  });
  svg.innerHTML=out;
}
window.addEventListener('resize',()=>drawLines());

// 힌트: 문제 유형에 맞춰 보기를 지우거나, 칸 하나를 채우거나, 짝 하나를 지어 줌
function hintLabel(it){
  if(single(it.type)||it.type==="multi") return '보기 하나 확인하기';
  if(it.type==="order") return '첫 칸 채워 주기';
  if(it.type==="piece") return '첫 조각 놓아 주기';
  if(it.type==="match") return '짝 하나 지어 주기';
  return '';
}
function useHint(it){
  it.hintUsed=true;
  const pickR=a=>a[rnd(a.length)];
  if(it.type==="order"){
    const c=it.correct[0]; it.lockSel=c; sel=[c,...sel.filter(i=>i!==c)];
  }else if(it.type==="piece"){
    const c=it.opts.indexOf(it.w[0]); it.lockSel=c; sel=[c,...sel.filter(i=>i!==c)].slice(0,it.w.length);
  }else if(it.type==="match"){
    const cand=it.opts.map((_,i)=>i).filter(i=>sel.map[i]!==it.correct[i]);
    const i=pickR(cand.length?cand:it.opts.map((_,k)=>k)), j=it.correct[i];
    const owner=sel.map.indexOf(j); if(owner>=0) sel.map[owner]=-1;
    sel.map[i]=j; if(sel.active===i) sel.active=null; it.lockL=i;
  }
}
// 보기 확인: 힌트 버튼으로 확인 모드를 켠 뒤 누른 보기 하나가 정답인지 알려 줌
const checkable=it=>single(it.type)||it.type==="multi";
function hintSpent(){
  const hb=document.getElementById('hintBtn'); if(!hb) return;
  hb.disabled=true; hb.classList.remove('armed'); hb.classList.add('used');
  hb.querySelector('span').textContent='힌트를 썼어요';
}
function checkOpt(it,i){
  it.checking=false; it.hintUsed=true; app.classList.remove('checking');
  const ok=single(it.type)?i===it.correct:it.correct.includes(i);
  if(ok){ it.lockSel=i; it.okOpt=i; if(single(it.type)) sel=i; else if(!sel.includes(i)) sel.push(i); }
  else{ it.gone=[i]; if(single(it.type)){ if(sel===i) sel=null; } else sel=sel.filter(k=>k!==i); }
  hintSpent(); paint();
}

function renderQuestion(){
  const SCREEN='quiz';
  const it=round[idx];
  sel=single(it.type)?null:it.type==="match"?{active:null,map:it.opts.map(()=>-1)}:[];
  const verseCard=it.type==="verse"?`
    <a class="versecard leather" href="${it.url}" target="_blank" rel="noopener noreferrer">
      <span class="vlabel">이 구절</span>
      <span class="vref">${esc(it.ref)}</span>
      <span class="vopen">본문 열기
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></span>
    </a>`:'';
  const body=it.type==="piece"
    ? `<div class="slots" style="--n:${it.w.length}">${it.w.map((_,k)=>`<button class="slot" data-k="${k}" aria-label="${k+1}번째 칸"><span class="sn">${k+1}</span><span class="st"></span><span class="sm"></span></button>`).join('')}</div>
       <div class="opts piece">${it.opts.map((o,i)=>btn(i,o)).join('')}</div>`
    : it.type==="match"
    ? matchBody(it)
    : `<div class="opts ${single(it.type)?'choice':it.type}">${it.opts.map((o,i)=>btn(i,o)).join('')}</div>`;
  app.className='wrap '+SCREEN;
  app.innerHTML=`
    <div class="edge" aria-hidden="true"><i style="width:${(idx/round.length)*100}%"></i></div>
    <div class="ribbon" aria-label="${round.length}문제 중 ${idx+1}번째">${idx+1}<small>/ ${round.length}</small></div>
    <div class="qhead"><span class="notch" aria-hidden="true">${tNotch(it.t)}</span><span class="kind">${KIND[it.type]||'하나 고르기'}</span><span class="tname">${it.t}</span></div>
    ${verseCard}
    <h2 class="qtext">${esc(it.q)}</h2>
    <p class="howto">${HOWTO[it.type]}</p>
    <div class="tools">
      <button class="hintbtn" id="hintBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>
        <span>힌트: ${hintLabel(it)}</span></button>
      ${it.type==="order"||it.type==="match"||it.type==="piece"?'<button class="resetbtn" id="resetBtn">다시 놓기</button>':''}
    </div>
    ${body}
    <button class="primary" id="submit" disabled>제출하기</button>
    <div id="fb"></div>
    <button class="quitbtn" id="quit">그만하고 처음 화면으로</button>`;
  it.hintUsed=false; it.gone=[]; it.lockSel=null; it.lockL=null; it.checking=false; it.okOpt=null;
  const hb=document.getElementById('hintBtn');
  hb.addEventListener('click',()=>{
    if(it.hintUsed||answers.length>idx) return;
    if(checkable(it)){
      it.checking=!it.checking;
      hb.classList.toggle('armed',it.checking); app.classList.toggle('checking',it.checking);
      hb.querySelector('span').textContent=it.checking?'확인할 보기를 누르세요':'힌트: '+hintLabel(it);
      return;
    }
    useHint(it); hintSpent(); paint();
  });
  const rb=document.getElementById('resetBtn');
  if(rb) rb.addEventListener('click',()=>{
    if(it.type==="match"){ sel={active:null,map:it.opts.map(()=>-1)}; if(it.lockL!==null) sel.map[it.lockL]=it.correct[it.lockL]; }
    else sel=it.lockSel!==null?[it.lockSel]:[];
    paint();
  });
  app.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>pick(+b.dataset.i,b.dataset.side)));
  app.querySelectorAll('.slot').forEach(b=>b.addEventListener('click',()=>{
    if(answers.length>idx) return;
    const k=+b.dataset.k; if(k<sel.length&&sel[k]!==it.lockSel){ sel.splice(k,1); paint(); }
  }));
  document.getElementById('submit').addEventListener('click',submit);
  document.getElementById('quit').addEventListener('click',askQuit);
  savePaused();
  paint();
  top();
  if(it.type==="match"){ requestAnimationFrame(drawLines); try{document.fonts.ready.then(drawLines);}catch(e){} }
}

function pick(i,side){
  const it=round[idx];
  if(answers.length>idx) return;
  if((it.gone||[]).includes(i)&&side!=="R") return;
  if(it.checking){ checkOpt(it,i); return; }
  if(single(it.type)){ if(it.lockSel!==null) return; sel=i; }
  else if(it.type==="match"){
    if(side==="L"&&i===it.lockL) return;
    if(side==="R"&&it.lockL!==null&&sel.map[it.lockL]===i) return;
    if(side==="L"){
      if(sel.map[i]>=0){ sel.map[i]=-1; sel.active=i; }
      else sel.active=sel.active===i?null:i;
    }else{
      const owner=sel.map.indexOf(i);
      if(owner>=0){ sel.map[owner]=-1; if(sel.active!==null){ sel.map[sel.active]=i; sel.active=null; } }
      else if(sel.active!==null){ sel.map[sel.active]=i; sel.active=null; }
    }
  }
  else{
    const at=sel.indexOf(i);
    if(at>=0&&i===it.lockSel) return;
    if(at>=0) sel.splice(at,1); else if(it.type==="multi"||sel.length<(it.type==="piece"?it.w.length:it.opts.length)) sel.push(i);
  }
  paint();
}

function paint(){
  const it=round[idx];
  if(it.type==="match"){
    app.querySelectorAll('.opt[data-side="L"]').forEach(b=>{
      const i=+b.dataset.i, on=sel.active===i;
      b.classList.toggle('act',on); setPC(b,sel.map[i]>=0?i:-1); b.classList.toggle('locked',i===it.lockL);
      b.setAttribute('aria-pressed',String(on));
    });
    app.querySelectorAll('.opt[data-side="R"]').forEach(b=>{
      const j=+b.dataset.i, owner=sel.map.indexOf(j);
      setPC(b,owner); b.classList.toggle('waiting',sel.active!==null&&owner<0); b.classList.toggle('locked',owner>=0&&owner===it.lockL);
      b.setAttribute('aria-pressed',String(owner>=0));
    });
    drawLines();
    document.getElementById('submit').disabled=!sel.map.every(v=>v>=0);
    return;
  }
  app.querySelectorAll('.opt').forEach((b,i)=>{
    let on=false, label='';
    if(single(it.type)){on=sel===i;label=String(i+1);}
    else if(it.type==="multi"){on=sel.includes(i);label=on?'✓':'';}
    else{const p=sel.indexOf(i);on=p>=0;label=on?String(p+1):'';}
    b.classList.toggle('sel',on);
    b.setAttribute('aria-pressed',String(on));
    b.querySelector('.n').textContent=label;
    const gone=(it.gone||[]).includes(i); b.classList.toggle('gone',gone); if(gone) b.disabled=true;
    const ok=checkable(it)&&i===it.okOpt;
    b.classList.toggle('locked',i===it.lockSel&&!ok); b.classList.toggle('ck-yes',ok); b.classList.toggle('ck-no',checkable(it)&&gone);
  });
  if(it.type==="piece"){
    app.querySelectorAll('.slot').forEach((b,k)=>{
      const has=k<sel.length;
      b.classList.toggle('filled',has);
      b.classList.toggle('next',k===sel.length);
      b.classList.toggle('locked',has&&sel[k]===it.lockSel);
      b.querySelector('.st').textContent=has?it.opts[sel[k]]:'';
    });
  }
  const ready=single(it.type)?sel!==null:it.type==="multi"?sel.length>0:it.type==="piece"?sel.length===it.w.length:sel.length===it.opts.length;
  document.getElementById('submit').disabled=!ready;
}

function grade(it,s){
  if(single(it.type)) return s===it.correct;
  if(it.type==="multi") return s.length===it.correct.length&&it.correct.every(i=>s.includes(i));
  if(it.type==="match") return s.every((v,i)=>v===it.correct[i]);
  if(it.type==="piece") return s.length===it.w.length&&s.map(i=>it.opts[i]).join("")===it.w.join("");
  return s.length===it.correct.length&&s.every((v,k)=>v===it.correct[k]);
}
const pairsText=(it,m)=>it.opts.map((l,i)=>`${esc(l)} — ${esc(it.rights[m[i]])}`).join(' / ');
const answerText=it=>it.type==="piece"?esc(it.a):single(it.type)?esc(it.opts[it.correct]):it.type==="multi"?it.correct.map(i=>esc(it.opts[i])).join(', '):it.type==="match"?pairsText(it,it.correct):it.correct.map(i=>esc(it.opts[i])).join(' → ');
const pickText=(it,s)=>it.type==="piece"?esc(s.map(i=>it.opts[i]).join("")):single(it.type)?esc(it.opts[s]):it.type==="multi"?s.map(i=>esc(it.opts[i])).join(', '):it.type==="match"?pairsText(it,s):s.map(i=>esc(it.opts[i])).join(' → ');
const refHtml=it=>it.url?`<a class="ref" href="${it.url}" target="_blank" rel="noopener noreferrer">${esc(it.ref)} 본문 보기</a>`:`<div class="ref">${esc(it.ref)}</div>`;

function submit(){
  const it=round[idx];
  if(answers.length>idx) return;
  const s=it.type==="match"?sel.map.slice():Array.isArray(sel)?sel.slice():sel;
  const right=grade(it,s);
  answers.push({pick:s,right,hint:it.hintUsed});
  record(it.id,right,it.hintUsed);
  savePaused();
  document.getElementById('hintBtn').hidden=true;
  const rb=document.getElementById('resetBtn'); if(rb) rb.hidden=true;
  document.getElementById('submit').hidden=true;
  if(it.type==="match"){
    app.querySelectorAll('.opt[data-side="L"]').forEach(b=>{
      const i=+b.dataset.i; b.disabled=true; b.classList.remove('act'); setPC(b,-1);
      b.classList.add(s[i]===it.correct[i]?'ok':'bad');
    });
    app.querySelectorAll('.opt[data-side="R"]').forEach(b=>{
      const j=+b.dataset.i, owner=s.indexOf(j), truth=it.correct.indexOf(j);
      b.disabled=true; b.classList.remove('waiting'); setPC(b,-1);
      b.classList.add(owner===truth?'ok':'bad');
    });
    drawLines();
  }else if(it.type==="piece"){
    app.querySelectorAll('.slot').forEach((b,k)=>{
      b.disabled=true; b.classList.remove('next');
      const ok=it.opts[s[k]]===it.w[k];
      b.classList.add(ok?'ok':'bad');
      if(!ok) b.querySelector('.sm').textContent=it.w[k];
    });
    app.querySelectorAll('.opt').forEach((b,i)=>{
      b.disabled=true; b.classList.remove('sel');
      if(it.w.includes(it.opts[i])) b.classList.add('ok');
      else { b.classList.add('dim'); b.querySelector('.mark').textContent='미끼'; }
    });
  }else app.querySelectorAll('.opt').forEach((b,i)=>{
    b.disabled=true; b.classList.remove('sel');
    const mark=b.querySelector('.mark');
    if(single(it.type)){
      if(i===it.correct) b.classList.add('ok'); else if(i===s) b.classList.add('bad'); else b.classList.add('dim');
    }else if(it.type==="multi"){
      const isY=it.correct.includes(i), chosen=s.includes(i);
      if(isY&&chosen) b.classList.add('ok');
      else if(isY){b.classList.add('miss');mark.textContent='놓친 정답';}
      else if(chosen){b.classList.add('bad');mark.textContent='오답';}
      else b.classList.add('dim');
    }else{
      const mine=s.indexOf(i), truth=it.correct.indexOf(i);
      b.classList.add(mine===truth?'ok':'bad');
      if(mine!==truth) mark.textContent=`정답 ${truth+1}번째`;
    }
  });
  app.querySelector('.edge i').style.width=((idx+1)/round.length*100)+'%';
  const last=idx===round.length-1;
  const fb=document.getElementById('fb');
  const correctLine=it.type==="piece"
    ? `<p>정답은 <b>${esc(it.a)}</b>예요. (${it.w.map(esc).join(' + ')})</p>`
    : it.type==="order"
    ? `<p>올바른 순서예요.</p><ol class="seqlist">${it.correct.map(i=>`<li>${esc(it.opts[i])}</li>`).join('')}</ol>`
    : it.type==="match"
    ? `<p>올바른 짝이에요.${right?'':' 빨간 점선이 잘못 이은 선이에요.'}</p><ol class="seqlist">${it.opts.map((l,i)=>`<li${s[i]!==it.correct[i]?' class="w"':''}>${esc(l)} — <b>${esc(it.rights[it.correct[i]])}</b></li>`).join('')}</ol>`
    : `<p>정답은 <b>${answerText(it)}</b>예요.</p>`;
  fb.innerHTML=`
    <div class="feedback ${right?'right':'wrong'}">
      <div class="verdict">${right?'정답이에요':'아쉬워요'}</div>
      ${right&&it.type!=="order"&&it.type!=="match"?'':correctLine}
      <p>${esc(it.ex)}</p>
      <div class="fbfoot">${refHtml(it)}<span id="rpslot"></span></div>
    </div>
    <button class="primary" id="next" style="margin-top:14px">${last?'결과 보기':'다음 문제'}</button>`;
  reportCtl(it,pickText(it,s).replace(/<[^>]*>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&'));
  const nb=document.getElementById('next');
  nb.addEventListener('click',()=>{ if(last) renderResult(); else { idx++; renderQuestion(); } });
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  fb.scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'});
  try{nb.focus({preventScroll:true});}catch(e){}
}

function renderResult(){
  const SCREEN='result';
  clearPaused();
  const score=answers.filter(a=>a.right).length;
  const hints=answers.filter(a=>a.hint).length;
  const isWrong=range==='wrong';
  const prev=isWrong?NaN:getBest(range);
  const best=!isWrong&&(isNaN(prev)||score>prev);
  if(best) setBest(range,score);
  const remain=wrongPool().length;
  const msg=score===round.length?'모두 맞히셨어요.':score>=round.length*0.8?'아주 잘하셨어요.':score>=round.length*0.5?'절반 넘게 맞히셨어요.':'다음 판에서 다시 도전해 보세요.';
  const wrong=round.map((it,i)=>({it,a:answers[i]})).filter(x=>!x.a.right);
  const label=(it,mine)=>it.type==="piece"?(mine?'내가 맞춘 답':'정답'):it.type==="order"?(mine?'내가 놓은 순서':'올바른 순서'):it.type==="match"?(mine?'내가 지은 짝':'올바른 짝'):(mine?'고른 답':'정답');
  const review=wrong.length?wrong.map(({it,a})=>`
    <div class="ritem">
      <div class="chips">${KIND[it.type]?`<span class="tag kindtag">${KIND[it.type]}</span>`:''}${a.hint?'<span class="tag">힌트 사용</span>':''}</div>
      <div class="rq">${esc(it.q)}</div>
      <div class="mine">${label(it,true)}: ${pickText(it,a.pick)}</div>
      <div class="ans">${label(it,false)}: ${answerText(it)}</div>
      <p>${esc(it.ex)}</p>
      ${refHtml(it)}
    </div>`).join(''):`<p class="allright">틀린 문제가 없어요.</p>`;
  const rank=rankOf(score,round.length), n=round.length;
  const scale=[['A',`${cutA(n)}점 이상`],['B',`${cutB(n)}~${cutA(n)-1}점`],['C',`${cutB(n)-1}점 이하`]]
    .map(([g,t])=>`<div class="${g===rank?'on':''}"><b>${g}</b>${t}</div>`).join('');
  app.className='wrap '+SCREEN;
  app.innerHTML=`
    <header class="rhead leather">
      <span class="rrange"><span class="notch rn" aria-hidden="true">${NOTCH[range]}</span>${rangeName(range)}</span>
      <div class="seal g${rank}" role="img" aria-label="${rank}등급"><b>${rank}</b><small>등급</small></div>
      <div class="rscore"><b>${score}</b>/ ${n}점</div>
      <p class="rmsg">${msg}</p>
    </header>
    <section class="rsheet">
      <div class="scale">${scale}</div>
      <p class="note">${hints?'힌트를 '+hints+'번 썼어요. ':''}${isWrong?`힌트 없이 ${fixedWrong}개를 맞혀서 목록에서 뺐어요. 남은 문제는 ${remain}개예요.`:best?'이 범위의 최고 점수예요.':'이 범위 최고 점수는 '+prev+'점('+rankOf(prev,n)+')이에요.'}</p>
      ${newSeen?`<p class="dexnew">도감에 새 문제 ${newSeen}개가 채워졌어요.</p>`:''}
      <div class="row">${isWrong&&!remain?'':`<button class="primary" id="again">${isWrong?'남은 오답 다시 풀기':'같은 범위로 다시 하기'}</button>`}<button class="secondary" id="home">처음으로</button></div>
      <div class="label">${wrong.length?'틀린 문제 다시 보기':'결과'}</div>
      <div class="review">${review}</div>
    </section>`;
  const ag=document.getElementById('again'); if(ag) ag.addEventListener('click',startRound);
  document.getElementById('home').addEventListener('click',renderStart);
  top();
  // 안드로이드 앱 안에서만: 가끔 깜짝 사진 알림
  try{ if(window.BibleQuizApp) window.BibleQuizApp.onResult(rank); }catch(e){}
}

// 누를 때 금박이 번지는 효과
const RM=window.matchMedia('(prefers-reduced-motion: reduce)');
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.primary,.secondary,.opt,.slot,.range');
  if(!b||b.disabled||RM.matches) return;
  const r=b.getBoundingClientRect(), d=Math.max(r.width,r.height)*2.2;
  const ink=document.createElement('span');
  ink.className='ink';
  ink.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  b.appendChild(ink);
  ink.addEventListener('animationend',()=>ink.remove());
},{passive:true});

renderStart();
})();
</script>
</body>
</html>
