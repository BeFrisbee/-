<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>성경 퀴즈</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* 가죽 성경: 남색 가죽 표지와 금박, 얇은 성경 종이, 빨간 리본 책갈피, 옆면 색인 홈 */
:root{
  --paper:#f3f3ee;
  --surface:#ffffff;
  --fg:#23262d;
  --muted:#60656e;
  --line:#d9d8cf;
  --leather:#22304a;
  --leather-2:#18233a;
  --gilt:#c4a25b;
  --gilt-hi:#e3cb8d;
  --gilt-lo:#9c7d3c;
  --on-leather:#e3cb8d;
  --ribbon:#9d2a33;
  --sel-bg:#22304a;
  --sel-fg:#e3cb8d;
  --sel-n-bg:#c4a25b;
  --sel-n-fg:#18233a;
  --hint:#8a5a12;
  --hint-bg:#f8eedb;
  --ok:#1d7148;
  --ok-bg:#e2f1e7;
  --bad:#ad2f36;
  --bad-bg:#f8e4e5;
  --f-display:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151a24;--surface:#1e2432;--fg:#ebe8de;--muted:#a3a7b2;--line:#323a4b;
    --leather:#0f1626;--leather-2:#0a0f1b;--ribbon:#b33a43;
    --sel-bg:#c4a25b;--sel-fg:#161b26;--sel-n-bg:#161b26;--sel-n-fg:#e3cb8d;
    --hint:#ecc678;--hint-bg:#30281a;--ok:#71d3a1;--ok-bg:#163021;--bad:#f2959b;--bad-bg:#3a1d22;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#151a24;--surface:#1e2432;--fg:#ebe8de;--muted:#a3a7b2;--line:#323a4b;
  --leather:#0f1626;--leather-2:#0a0f1b;--ribbon:#b33a43;
  --sel-bg:#c4a25b;--sel-fg:#161b26;--sel-n-bg:#161b26;--sel-n-fg:#e3cb8d;
  --hint:#ecc678;--hint-bg:#30281a;--ok:#71d3a1;--ok-bg:#163021;--bad:#f2959b;--bad-bg:#3a1d22;color-scheme:dark;
}
body{background:var(--paper);color:var(--fg);font-family:var(--f-body);font-size:18px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.wrap{position:relative;max-width:560px;margin:0 auto;padding-inline:20px;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gilt);outline-offset:2px}

/* 가죽과 금박 */
.leather{
  color:var(--on-leather);
  background:
    radial-gradient(120% 80% at 50% 0%,rgba(255,255,255,.07),transparent 60%),
    repeating-radial-gradient(circle at 30% 40%,rgba(0,0,0,.06) 0 1px,transparent 1px 3px),
    linear-gradient(var(--leather),var(--leather-2));
}
.gilt-text{background:linear-gradient(180deg,var(--gilt-hi),var(--gilt) 55%,var(--gilt-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.orn{width:56px;height:1.5px;background:var(--gilt);opacity:.85;position:relative}
.orn::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;background:var(--gilt);transform:translate(-50%,-50%) rotate(45deg)}
.notch{
  flex:none;display:grid;place-items:center;width:46px;height:46px;padding-right:4px;border-radius:0 23px 23px 0;
  font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--gilt-hi);
  background:linear-gradient(var(--leather),var(--leather-2));
  box-shadow:inset 0 0 0 1px rgba(196,162,91,.3);
}

/* 시작: 표지 */
.cover{
  margin:-20px -20px 0;padding:56px 24px 64px;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;
}
.cover::before{
  content:"";position:absolute;inset:18px 18px 0;border:1.5px solid rgba(196,162,91,.7);border-bottom:0;border-radius:6px 6px 0 0;
  box-shadow:inset 0 0 0 4px transparent,inset 0 0 0 5px rgba(196,162,91,.35);pointer-events:none;
}
.cover h1{font-size:50px;line-height:1.2;letter-spacing:.08em}
.cover p{margin:0;font-family:var(--f-display);font-size:17px;color:var(--on-leather);opacity:.9}
.sheet{
  margin:-28px -20px 0;padding:26px 20px 0;border-radius:18px 18px 0 0;background:var(--paper);position:relative;
  display:flex;flex-direction:column;gap:14px;
}
.label{font-size:15px;font-weight:600;color:var(--muted)}
.ranges{display:flex;flex-direction:column}
.range{
  display:flex;align-items:center;gap:14px;text-align:left;width:calc(100% + 20px);
  padding:12px 0;border:0;border-bottom:1px solid var(--line);background:transparent;margin-left:-20px;padding-right:2px;
}
.range .t{flex:1;min-width:0}
.range strong{font-family:var(--f-display);font-size:22px;display:block;line-height:1.3}
.range .t span{display:block;font-size:15px;color:var(--muted);line-height:1.45}
.range .best{flex:none;font-size:14px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.range .best b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.1;color:var(--fg)}
.range[aria-pressed="true"] .notch{background:var(--ribbon);color:#fff}
.range[aria-pressed="true"] strong{color:var(--ribbon)}
.primary{
  width:100%;padding:17px;border:0;border-radius:12px;font-size:20px;font-weight:600;letter-spacing:.04em;
  color:var(--gilt-hi);
  background:
    repeating-radial-gradient(circle at 30% 40%,rgba(0,0,0,.06) 0 1px,transparent 1px 3px),
    linear-gradient(#2a3a58,var(--leather-2));
  box-shadow:inset 0 0 0 1px rgba(196,162,91,.35);
}
.primary:disabled{opacity:.38;cursor:default}
.secondary{width:100%;padding:15px;border-radius:12px;border:1.5px solid var(--muted);background:transparent;font-size:18px;font-weight:600;color:var(--fg)}
.note{font-size:14px;color:var(--muted);margin:0;line-height:1.65}

/* 문제 */
.edge{margin:-20px -20px 0;height:5px;background:var(--line);position:relative;overflow:hidden}
.edge i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--gilt-lo),var(--gilt-hi),var(--gilt-lo));transition:width .35s}
.ribbon{
  position:absolute;right:22px;top:0;width:46px;height:86px;padding-top:15px;z-index:1;
  display:flex;flex-direction:column;align-items:center;background:var(--ribbon);color:#fff;
  clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);
  font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1;font-variant-numeric:tabular-nums;
}
.ribbon small{font-family:var(--f-body);font-weight:500;font-size:11px;opacity:.85;margin-top:5px}
.qhead{display:flex;align-items:center;gap:10px;min-height:52px;margin-left:-20px;padding-right:64px}
.qhead .notch{width:38px;height:38px;font-size:16px;border-radius:0 19px 19px 0}
.qhead .kind{font-size:15px;font-weight:600;color:var(--fg)}
.qhead .tname{font-size:14px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-size:25px;line-height:1.5;font-weight:700;margin:0;text-wrap:pretty}
.howto{margin:-8px 0 0;font-size:15px;color:var(--muted)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:-4px}
.hintbtn{
  display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--hint);background:transparent;color:var(--hint);
  font-size:16px;font-weight:600;
}
.resetbtn{border:0;background:transparent;color:var(--muted);font-size:15px;text-decoration:underline;text-underline-offset:3px;padding:8px 4px}
.hintbox{margin:-4px 0 0;padding:12px 16px;border-radius:12px;background:var(--hint-bg);color:var(--fg);font-size:17px;line-height:1.6;border-left:3px solid var(--gilt)}
.hintbox b{color:var(--hint);margin-right:6px}

.opts{display:grid;gap:10px}
.opt{
  display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  padding:15px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;line-height:1.4;color:var(--fg);
}
.opt .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:600;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.opts.multi .opt .n{border-radius:8px}
.opt .txt{flex:1;min-width:0}
.opt .mark{flex:none;font-size:13px;font-weight:600}
.opt.sel{border-color:var(--sel-bg);background:var(--sel-bg);color:var(--sel-fg)}
.opt.sel .n{background:var(--sel-n-bg);color:var(--sel-n-fg);box-shadow:none}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--fg)}
.opt.ok .n{background:var(--ok);color:var(--surface);box-shadow:none}
.opt.miss{border-color:var(--ok);border-style:dashed;background:var(--surface)}
.opt.miss .mark{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--fg)}
.opt.bad .n{background:var(--bad);color:var(--surface);box-shadow:none}
.opt.bad .mark{color:var(--bad)}
.opt.dim{opacity:.5}

.feedback{border-radius:12px;padding:16px 18px;background:var(--surface);border:1.5px solid var(--line);border-top:3px solid var(--gilt);display:flex;flex-direction:column;gap:6px}
.feedback .verdict{font-family:var(--f-display);font-size:23px;font-weight:700}
.feedback.right .verdict{color:var(--ok)}
.feedback.wrong .verdict{color:var(--bad)}
.feedback p{margin:0}
.seqlist{margin:0;padding-left:1.4em}
.ref{font-size:16px;font-weight:600;color:var(--fg)}
a.ref{color:var(--ribbon);text-decoration:underline;text-underline-offset:3px}

.versecard{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;text-decoration:none;
  padding:14px 16px;border-radius:12px;
}
.versecard .vlabel{font-size:13px;font-weight:600;opacity:.8}
.versecard .vref{font-family:var(--f-display);font-size:22px;font-weight:700;flex:1;min-width:0}
.versecard .vopen{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:var(--leather-2);background:var(--gilt);padding:7px 14px;border-radius:999px}

/* 짝짓기 */
.matchwrap{display:flex;flex-direction:column;gap:10px}
.mlabel{font-size:14px;font-weight:600;color:var(--muted);margin-top:4px}
.opts.match .opt .n{border-radius:8px}
.opt.paired{border-color:var(--leather)}
.opt.paired .n{background:var(--leather);color:var(--gilt-hi);box-shadow:none}
.opt.waiting{border-style:dashed;border-color:var(--leather)}
.opts.mL .opt.sel .n{background:var(--sel-n-bg);color:var(--sel-n-fg)}

/* 조각 맞추기 */
.slots{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:7px}
.slot{
  position:relative;min-height:72px;padding:18px 2px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.2;text-align:center;
}
.slot .sn{position:absolute;top:4px;left:0;right:0;font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--muted)}
.slot .sm{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--ok)}
.slot .sm:empty{display:none}
.slot.next{border-style:dashed;border-color:var(--leather)}
.slot.filled{border-color:var(--leather);box-shadow:inset 0 -3px 0 var(--gilt)}
.slot:disabled{cursor:default}
.slot.ok{border-color:var(--ok);background:var(--ok-bg);box-shadow:none}
.slot.bad{border-color:var(--bad);background:var(--bad-bg);box-shadow:none}
.opts.piece{grid-template-columns:1fr 1fr;gap:9px}
.opts.piece .opt{padding:14px 12px;gap:8px;font-family:var(--f-display);font-size:23px;font-weight:700}
.opts.piece .opt .txt{text-align:center}
.opts.piece .opt .n{width:26px;height:26px;font-family:var(--f-body);font-size:14px}
.opts.piece .opt:not(.sel):not(:disabled) .n{box-shadow:none}
.opts.piece .opt.ok .n{background:transparent;color:var(--ok)}
.opts.piece .opt .mark{font-family:var(--f-body)}
.opts.piece .opt.dim .mark{color:var(--muted)}

/* 결과: 성적 인장 */
.rhead{margin:-20px -20px 0;padding:34px 24px 46px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;position:relative}
.rhead::before{content:"";position:absolute;inset:18px 18px 0;border:1.5px solid rgba(196,162,91,.7);border-bottom:0;border-radius:6px 6px 0 0;pointer-events:none}
.rrange .notch.rn{width:30px;height:30px;font-size:14px;border-radius:50%;padding:0;background:var(--gilt);color:var(--leather-2)}
.rrange{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--on-leather);opacity:.9}
.seal{
  width:136px;height:136px;border-radius:50%;display:grid;place-items:center;position:relative;
  --m-hi:var(--gilt-hi);--m-mid:var(--gilt);--m-lo:var(--gilt-lo);
  background:radial-gradient(circle at 35% 30%,var(--m-hi),var(--m-mid) 45%,var(--m-lo));
  box-shadow:0 0 0 4px var(--leather),0 0 0 5.5px var(--m-mid),0 8px 20px rgba(0,0,0,.35);
}
/* A 금박, B 은박, C 동박 */
.seal.gB{--m-hi:#f4f5f7;--m-mid:#b9bdc6;--m-lo:#7c818c}
.seal.gC{--m-hi:#f1caa3;--m-mid:#b67a4a;--m-lo:#7b4a27}
.notch{box-shadow:inset -1px 0 0 rgba(196,162,91,.55),inset 0 1px 0 rgba(196,162,91,.55),inset 0 -1px 0 rgba(196,162,91,.55)}
.seal::before{content:"";position:absolute;inset:9px;border-radius:50%;border:1.5px solid rgba(24,35,58,.45)}
.seal b{font-family:var(--f-display);font-size:74px;line-height:1;color:var(--leather-2);margin-top:-4px}
.seal small{position:absolute;bottom:17px;font-size:12px;font-weight:600;color:var(--leather-2);letter-spacing:.06em}
.rscore{font-family:var(--f-display);font-size:22px;color:var(--on-leather)}
.rscore b{font-size:40px;color:#fff;font-variant-numeric:tabular-nums;margin-right:4px}
.rmsg{font-family:var(--f-display);font-size:20px;color:#fff;margin:0}
.rsheet{margin:-28px -20px 0;padding:24px 20px 0;border-radius:18px 18px 0 0;background:var(--paper);position:relative;display:flex;flex-direction:column;gap:14px}
.scale{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.scale div{padding:9px 6px;text-align:center;font-size:14px;color:var(--muted);line-height:1.35}
.scale div+div{border-left:1.5px solid var(--line)}
.scale b{display:block;font-family:var(--f-display);font-size:22px;color:var(--fg)}
.scale .on{background:var(--sel-bg);color:var(--sel-fg)}
.scale .on b{color:var(--sel-fg)}
.review{display:flex;flex-direction:column;gap:12px}
.ritem{border-radius:12px;padding:14px 16px;background:var(--surface);border:1.5px solid var(--line);display:flex;flex-direction:column;gap:6px}
.ritem .rq{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.45}
.ritem .mine{font-size:16px;color:var(--bad)}
.ritem .ans{font-size:17px;color:var(--ok);font-weight:600}
.ritem p{margin:0;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tag{align-self:flex-start;font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--hint-bg);color:var(--hint)}
.kindtag{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line)}
.allright{margin:0;padding:16px 18px;border-radius:12px;background:var(--ok-bg);color:var(--ok);font-weight:600}
.row{display:grid;gap:10px}
@media (prefers-reduced-motion:reduce){.edge i{transition:none}}

/* 시작 화면은 한 화면 안에 들어가게: 남는 높이는 표지가 채우고, 모자라면 표지 여백부터 줄어듦 */
.wrap.start{min-height:100vh;min-height:100dvh;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.wrap.start .cover{flex:1 1 auto;justify-content:center;padding-top:clamp(36px,7vh,56px);padding-bottom:clamp(44px,8vh,64px);gap:clamp(8px,1.6vh,14px)}
.wrap.start .cover h1{font-size:clamp(40px,6vh,50px)}
.wrap.start .range{padding-block:clamp(7px,1.3vh,12px)}
.wrap.start .sheet{gap:clamp(8px,1.5vh,14px)}

/* 누를 때 효과 */
button,a{-webkit-tap-highlight-color:transparent}
.primary,.secondary,.range,.opt,.slot,.hintbtn,.resetbtn,.versecard,.notch,.opt .n{
  transition:transform .14s ease,background-color .2s ease,border-color .2s ease,color .2s ease,box-shadow .2s ease,opacity .2s ease;
}
.primary,.secondary,.range,.opt,.slot{position:relative;overflow:hidden;isolation:isolate}
.primary:not(:disabled):active{transform:translateY(1px) scale(.985);box-shadow:inset 0 3px 10px rgba(0,0,0,.4)}
.secondary:active,.opt:not(:disabled):active,.slot:not(:disabled):active{transform:scale(.97)}
.range:active .notch{transform:translateX(5px)}
.hintbtn:active{transform:scale(.95);background:var(--hint-bg)}
.versecard:active{transform:scale(.98)}
.ink{
  position:absolute;z-index:-1;border-radius:50%;pointer-events:none;transform:scale(0);opacity:.6;
  background:radial-gradient(circle,rgba(230,207,147,.85),rgba(196,162,91,.35) 55%,transparent 70%);
  animation:ink .55s ease-out forwards;
}
@keyframes ink{to{transform:scale(1);opacity:0}}
.primary .ink,.opt.sel .ink,.opt.paired .ink{opacity:.9}
.opt.sel .n,.opt.paired .n{animation:pop .24s ease-out}
.slot.filled .st{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.55)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.feedback{animation:rise .3s ease-out}
.hintbox{animation:rise .24s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .primary,.secondary,.range,.opt,.slot,.hintbtn,.resetbtn,.versecard,.notch,.opt .n{transition:none}
  .opt.sel .n,.opt.paired .n,.slot.filled .st,.feedback,.hintbox{animation:none}
  .primary:active,.secondary:active,.opt:active,.slot:active,.hintbtn:active,.versecard:active,.range:active .notch{transform:none}
}
</style>

<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>

<script>
(()=>{
/*
  모든 정답·해설·힌트·보기는 대한성서공회 개역개정 본문과 대조해 확인함.
  choice: v에 같은 지식을 묻는 문장 두 가지. 보기 배열의 첫 번째가 정답, 나머지는 오답 후보(매번 3개를 뽑음).
  verse : 구절 링크를 열어 읽고 푸는 문제. l = [책 코드, 장, 절]. a의 첫 번째가 정답.
  multi : yes = 해당하는 것, no = 해당하지 않는 것. 매번 섞어 5개를 뽑음.
  order : seq = 올바른 순서. 매번 4개를 뽑아 섞음.
*/
const OT=[

{type:"piece",q:"요셉의 장인, 곧 요셉의 아내 아스낫의 아버지인 온의 제사장은?",w:["보디","베","라"],d:["발","아스","낫","베리"],h:"요셉을 샀던 시위대장 보디발과 이름 앞부분이 같아요.",ex:"창세기 41:45에 따르면 요셉의 아내 아스낫은 온의 제사장 보디베라의 딸이에요. 요셉을 샀던 시위대장 보디발과는 다른 사람이에요.",ref:"창세기 41:45; 39:1"},
{type:"piece",q:"아브람의 조카 롯을 사로잡아 간 왕들 가운데, 엘람의 왕은?",w:["그돌","라","오멜"],d:["아므","라벨","디달","오맬"],h:"아브람은 집에서 길리고 훈련된 사람 318명을 데리고 쫓아갔어요.",ex:"창세기 14장에서 엘람 왕 그돌라오멜과 동맹한 왕들이 소돔을 쳐 롯을 사로잡아 갔고, 아브람이 쫓아가 롯과 재물을 되찾았어요.",ref:"창세기 14:1-16"},
{type:"piece",q:"자식이 없던 아브람이 '내 상속자'라고 말한 다메섹 사람은?",w:["엘리","에","셀"],d:["에벤","살","엘르","에셀"],h:"하나님은 그가 아니라 아브람의 몸에서 날 자가 상속자가 되리라 하셨어요.",ex:"창세기 15장에서 아브람은 자식이 없어 다메섹 사람 엘리에셀이 상속자가 되겠다고 했지만, 하나님은 아브람의 몸에서 날 자가 상속자가 되리라 하셨어요.",ref:"창세기 15:2-4"},
{type:"piece",q:"아버지의 바알 제단을 헐었다고 해서 기드온에게 붙여진 다른 이름은?",w:["여룹","바","알"],d:["바락","여로","알론","스룹"],h:"'바알이 그와 더불어 다툴 것이라'는 말에서 나온 이름이에요.",ex:"사사기 6장에서 기드온은 아버지 요아스의 바알 제단을 헐고 그 곁의 아세라 상을 찍었어요. 그 일로 그날 그를 여룹바알이라 불렀어요.",ref:"사사기 6:25-32"},
{type:"piece",q:"이스라엘 왕 아하시야가 다락 난간에서 떨어져 병든 뒤, 병이 나을지 물으려고 사자를 보낸 에그론의 신은?",w:["바알","세","붑"],d:["불","브올","세벨","아세"],h:"엘리야가 '이스라엘에 하나님이 없어서 에그론의 신에게 묻느냐'고 꾸짖었어요.",ex:"열왕기하 1장에서 아하시야는 병들자 에그론의 신 바알세붑에게 물으러 사자를 보냈고, 엘리야가 그 사자들을 막아 하나님의 말씀을 전했어요. 신약의 '바알세불'과 끝 글자가 달라요.",ref:"열왕기하 1:2-3"},
{type:"piece",q:"블레셋에서 돌아온 여호와의 궤가 아비나답의 집에 들어가 20년 동안 머문 성읍은?",w:["기럇","여아","림"],d:["아르","바","기랏","여림"],h:"산에 사는 아비나답의 아들 엘리아살이 궤를 지켰어요.",ex:"사무엘상 7장에서 기럇여아림 사람들이 여호와의 궤를 산에 사는 아비나답의 집에 들여놓았고, 궤는 그곳에 20년 동안 있었어요.",ref:"사무엘상 7:1-2"},
{type:"piece",q:"사래를 피해 도망한 하갈이 여호와의 사자를 만난 뒤, 그 우물에 붙은 이름은?",w:["브엘","라해","로이"],d:["세바","엘로","라헬","로암"],h:"가데스와 베렛 사이에 있는 우물이에요.",ex:"창세기 16장에서 하갈은 자기를 살피시는 하나님을 만났고, 그 우물은 브엘라해로이라 불렸어요. 가데스와 베렛 사이에 있어요.",ref:"창세기 16:7-14"},
{type:"piece",q:"민수기 32장에서 모세가 르우벤과 갓 자손을 꾸짖으며 떠올린, 조상들이 정탐꾼을 보냈던 곳은?",w:["가데","스","바네","아"],d:["가나","사브","낫","바란"],h:"정탐꾼들이 그 땅을 보고 와서 백성의 마음을 낙심하게 했던 일을 떠올린 장면이에요.",ex:"민수기 32장에서 모세는 르우벤과 갓 자손에게, 조상들도 가데스바네아에서 땅을 보러 보냈을 때 이스라엘 자손을 낙심하게 했다고 꾸짖었어요.",ref:"민수기 32:6-9"},
{type:"piece",q:"사무엘의 아버지 엘가나가 살던, 에브라임 산지의 성읍 이름은?",w:["라마","다임","소빔"],d:["마하","나임","기럇","소밤"],h:"사무엘상 첫 절에 나오는 긴 지명이에요.",ex:"사무엘상 1:1은 엘가나를 에브라임 산지 라마다임소빔에 사는 사람으로 소개해요.",ref:"사무엘상 1:1"},
{type:"piece",q:"솔로몬의 뒤를 이어 왕이 되었으나, 백성의 멍에를 더 무겁게 하겠다고 답해 나라가 갈라지게 된 왕은?",w:["르호","보","암"],d:["여로","아비","얌","르우"],h:"노인들의 조언 대신 함께 자란 젊은 신하들의 말을 따랐어요.",ex:"열왕기상 12장에서 솔로몬의 아들 르호보암은 젊은 신하들의 말을 따라 백성에게 더 무거운 멍에를 메우겠다고 했고, 열 지파는 다윗의 집을 떠났어요.",ref:"열왕기상 12:1-20"},
{type:"piece",q:"갈라진 북쪽 이스라엘의 첫 왕이 되어, 금송아지 둘을 만들어 벧엘과 단에 둔 사람은?",w:["여로","보","암"],d:["르호","아비","얌","여룹"],h:"느밧의 아들이에요.",ex:"열왕기상 12장에서 느밧의 아들 여로보암은 이스라엘의 왕이 되었고, 백성이 예루살렘으로 올라가지 않게 하려고 금송아지 둘을 만들어 벧엘과 단에 두었어요.",ref:"열왕기상 12:20, 26-29"},
{type:"piece",q:"열여덟 살에 왕이 되어 석 달 동안 다스리다 바벨론으로 끌려간 유다 왕은?",w:["여호","야","긴"],d:["김","사밧","야다","여로"],h:"37년 뒤 바벨론 왕이 그를 옥에서 풀어 주었어요.",ex:"열왕기하 24장에 따르면 여호야긴은 18세에 왕이 되어 석 달을 다스렸고, 바벨론 왕에게 나아가 항복한 뒤 바벨론으로 끌려갔어요. 아버지의 이름과 끝 글자 하나만 달라요.",ref:"열왕기하 24:8-15"},
{type:"piece",q:"애굽 왕 바로느고가 요시야의 아들 엘리아김을 왕으로 세우며 고쳐 준 이름은?",w:["여호","야","김"],d:["긴","시드","엘리","아김"],h:"스물다섯 살에 왕이 되어 11년 동안 다스렸어요.",ex:"열왕기하 23:34에서 바로느고는 엘리아김을 왕으로 세우고 이름을 여호야김으로 고쳤어요. 그는 25세에 왕이 되어 11년을 다스렸어요.",ref:"열왕기하 23:34-36"},

{type:"piece",q:"압살롬의 난 때 마하나임에 머문 다윗을 공궤한 80세의 길르앗 사람은?",w:["바르","실","래"],d:["김함","길르","래아","바실"],h:"다윗이 예루살렘으로 함께 가자고 했지만, 늙었다며 김함을 대신 보냈어요.",ex:"사무엘하 19장에서 바르실래는 다윗과 함께 요단까지 왔지만, 나이가 80세라며 예루살렘에 가지 않고 김함을 대신 보냈어요. 그는 다윗이 마하나임에 있을 때 왕을 공궤한 큰 부자였어요.",ref:"사무엘하 19:31-39"},

{type:"piece",q:"제구시에 십자가 위에서 예수께서 크게 소리 지르신 말씀은?",w:["엘리","엘리","라마","사박다니"],a:"엘리 엘리 라마 사박다니",d:["엘로","라마나","아바","사바"],h:"번역하면 '나의 하나님, 나의 하나님, 어찌하여 나를 버리셨나이까'예요.",ex:"마태복음 27장과 마가복음 15장에서 예수께서는 제구시에 엘리 엘리 라마 사박다니라고 크게 외치셨어요. 개역개정은 두 복음서 모두 같은 표기로 적어요.",ref:"마태복음 27:46; 마가복음 15:34"},

{type:"piece",q:"빌라도에게 예수의 시체를 달라고 하여 자기 새 무덤에 넣은 부자 요셉의 고향은?",w:["아리","마","대"],d:["막달","라","겟세","리마"],h:"마태복음은 그도 예수의 제자였다고 소개해요.",ex:"마태복음 27장에서 아리마대의 부자 요셉은 빌라도에게 예수의 시체를 청해 깨끗한 세마포로 싸서, 바위 속에 판 자기 새 무덤에 넣었어요.",ref:"마태복음 27:57-60"},

const rnd=n=>Math.floor(Math.random()*n);
const shuffle=arr=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

// 정답 하나 + 오답 후보 중 무작위 3개
function pickSingle(a){
  const opts=shuffle([a[0],...shuffle(a.slice(1)).slice(0,3)]);
  return {opts,correct:opts.indexOf(a[0])};
}

function build(f){
  const base={type:f.type,t:f.t,ref:f.ref,ex:f.ex,h:f.h};
  if(f.type==="multi"){
    const maxYes=Math.min(4,f.yes.length), minYes=Math.max(2,5-f.no.length);
    const k=minYes+rnd(maxYes-minYes+1);
    const items=[...shuffle(f.yes).slice(0,k).map(s=>({s,y:true})),...shuffle(f.no).slice(0,5-k).map(s=>({s,y:false}))];
    const mixed=shuffle(items);
    return {...base,q:pickQ(f.q),opts:mixed.map(x=>x.s),correct:mixed.map((x,i)=>x.y?i:-1).filter(i=>i>=0)};
  }
  if(f.type==="order"){
    const picks=shuffle(f.seq.map((_,i)=>i)).slice(0,4).sort((a,b)=>a-b);
    const truth=picks.map(i=>f.seq[i]);
    const opts=shuffle(truth);
    return {...base,q:pickQ(f.q),opts,correct:truth.map(s=>opts.indexOf(s))};
  }
  if(f.type==="match"){
    const chosen=[], usedL=new Set(), usedR=new Set();
    for(const p of shuffle(f.pairs)){
      if(usedL.has(p[0])||usedR.has(p[1])) continue;
      chosen.push(p); usedL.add(p[0]); usedR.add(p[1]);
      if(chosen.length===4) break;
    }
    const lefts=shuffle(chosen.map(p=>p[0]));
    const rights=shuffle(chosen.map(p=>p[1]));
    const correct=lefts.map(l=>rights.indexOf(chosen.find(p=>p[0]===l)[1]));
    return {...base,q:pickQ(f.q),L:f.L,R:f.R,opts:lefts,rights,correct};
  }
  if(f.type==="piece"){
    const opts=shuffle([...f.w,...shuffle(f.d).slice(0,2)]);
    return {...base,q:pickQ(f.q),opts,w:f.w,a:f.a||f.w.join('')};
  }
  if(f.type==="verse"){
    return {...base,q:f.q,url:verseUrl(f.l),...pickSingle(f.a)};
  }
  const [q,a]=f.v[rnd(2)];
  return {...base,q,...pickSingle(a)};
}

// 한 판 구성: 유형 비율(하나 고르기 45 · 모두 고르기/순서/짝짓기 각 15 · 본문 10)을 맞춰 뽑고,
// 같은 문제·같은 주제 묶음은 한 판에 한 번만. 주제 묶음은 내부용이라 화면에 나오지 않음.
function pickRound(pool,n){
  for(let k=0;k<50;k++){ const r=tryRound(pool,n); if(r.length>=n) return r; }
  return tryRound(pool,n);
}
// 한 판의 유형별 개수: 범위 안 문제 수 비율(하나 고르기는 2문제로 셈)을 그대로 따름
function quotaFor(pool,n){
  const w={}; let tot=0;
  for(const f of pool){ const x=f.type==="choice"?2:1; w[f.type]=(w[f.type]||0)+x; tot+=x; }
  const q={}, fr=[]; let sum=0;
  for(const t in w){ const e=n*w[t]/tot; q[t]=Math.floor(e); sum+=q[t]; fr.push([t,e-q[t]]); }
  for(let left=n-sum;left>0&&fr.length;left--){
    let r=Math.random()*fr.reduce((x,y)=>x+y[1],0), k=0;
    for(;k<fr.length-1;k++){ r-=fr[k][1]; if(r<0) break; }
    q[fr[k][0]]++; fr.splice(k,1);
  }
  return q;
}
function tryRound(pool,n){
  const quota=quotaFor(pool,n);
  const byType={};
  for(const f of shuffle(pool)) (byType[f.type]=byType[f.type]||[]).push(f);
  const usedG=new Set(), picked=new Set();
  const ok=f=>!picked.has(f)&&!(GMAP[f.id]||[]).some(g=>usedG.has(g));
  const take=f=>{picked.add(f);(GMAP[f.id]||[]).forEach(g=>usedG.add(g));};
  // 묶음에 많이 걸리는 유형부터 채워야 비율이 덜 흐트러짐
  for(const t of ["match","order","multi","piece","verse","choice"]){
    let need=quota[t]||0;
    for(const f of byType[t]||[]){ if(!need) break; if(ok(f)){take(f);need--;} }
  }
  // 모자라면 아무 유형으로나 채움
  for(const f of shuffle(pool)){ if(picked.size>=n) break; if(ok(f)) take(f); }
  return shuffle([...picked]).slice(0,n);
}
function startRound(){
  round=pickRound(RANGES[range].pool,ROUND).map(build);
  idx=0; answers=[];
  renderQuestion();
}

const btn=(i,txt,side='')=>`<button class="opt" data-i="${i}"${side?` data-side="${side}"`:''} aria-pressed="false"><span class="n"></span><span class="txt">${esc(txt)}</span><span class="mark"></span></button>`;

        힌트 보기</button>

  it.hintUsed=false;

function pick(i,side){
  const it=round[idx];
  if(answers.length>idx) return;
  if(single(it.type)) sel=i;
  else if(it.type==="match"){
    if(side==="L"){
      if(sel.map[i]>=0){ sel.map[i]=-1; sel.active=i; }
      else sel.active=sel.active===i?null:i;
    }else{
      const owner=sel.map.indexOf(i);
      if(owner>=0){ sel.map[owner]=-1; if(sel.active!==null){ sel.map[sel.active]=i; sel.active=null; } }
      else if(sel.active!==null){ sel.map[sel.active]=i; sel.active=null; }
    }
  }
  else{
    const at=sel.indexOf(i);
    if(at>=0) sel.splice(at,1); else if(it.type==="multi"||sel.length<(it.type==="piece"?it.w.length:it.opts.length)) sel.push(i);
  }
  paint();
}

function paint(){
  const it=round[idx];
  if(it.type==="match"){
    app.querySelectorAll('.mL .opt').forEach((b,i)=>{
      const on=sel.active===i, paired=sel.map[i]>=0;
      b.classList.toggle('sel',on); b.classList.toggle('paired',paired);
      b.setAttribute('aria-pressed',String(on));
      b.querySelector('.n').textContent=String(i+1);
    });
    app.querySelectorAll('.mR .opt').forEach((b,j)=>{
      const owner=sel.map.indexOf(j);
      b.classList.toggle('paired',owner>=0);
      b.classList.toggle('waiting',sel.active!==null&&owner<0);
      b.querySelector('.n').textContent=owner>=0?String(owner+1):'';
    });
    document.getElementById('submit').disabled=!sel.map.every(v=>v>=0);
    return;
  }
  app.querySelectorAll('.opt').forEach((b,i)=>{
    let on=false, label='';
    if(single(it.type)){on=sel===i;label=String(i+1);}
    else if(it.type==="multi"){on=sel.includes(i);label=on?'✓':'';}
    else{const p=sel.indexOf(i);on=p>=0;label=on?String(p+1):'';}
    b.classList.toggle('sel',on);
    b.setAttribute('aria-pressed',String(on));
    b.querySelector('.n').textContent=label;
  });
  if(it.type==="piece"){
    app.querySelectorAll('.slot').forEach((b,k)=>{
      const has=k<sel.length;
      b.classList.toggle('filled',has);
      b.classList.toggle('next',k===sel.length);
      b.querySelector('.st').textContent=has?it.opts[sel[k]]:'';
    });
  }
  const ready=single(it.type)?sel!==null:it.type==="multi"?sel.length>0:it.type==="piece"?sel.length===it.w.length:sel.length===it.opts.length;
  document.getElementById('submit').disabled=!ready;
}

function grade(it,s){
  if(single(it.type)) return s===it.correct;
  if(it.type==="multi") return s.length===it.correct.length&&it.correct.every(i=>s.includes(i));
  if(it.type==="match") return s.every((v,i)=>v===it.correct[i]);
  if(it.type==="piece") return s.length===it.w.length&&s.map(i=>it.opts[i]).join("")===it.w.join("");
  return s.length===it.correct.length&&s.every((v,k)=>v===it.correct[k]);
}
const pairsText=(it,m)=>it.opts.map((l,i)=>`${esc(l)} — ${esc(it.rights[m[i]])}`).join(' / ');
const answerText=it=>it.type==="piece"?esc(it.a):single(it.type)?esc(it.opts[it.correct]):it.type==="multi"?it.correct.map(i=>esc(it.opts[i])).join(', '):it.type==="match"?pairsText(it,it.correct):it.correct.map(i=>esc(it.opts[i])).join(' → ');
const pickText=(it,s)=>it.type==="piece"?esc(s.map(i=>it.opts[i]).join("")):single(it.type)?esc(it.opts[s]):it.type==="multi"?s.map(i=>esc(it.opts[i])).join(', '):it.type==="match"?pairsText(it,s):s.map(i=>esc(it.opts[i])).join(' → ');
const refHtml=it=>it.url?`<a class="ref" href="${it.url}" target="_blank" rel="noopener noreferrer">${esc(it.ref)} 본문 보기</a>`:`<div class="ref">${esc(it.ref)}</div>`;

function submit(){
  const it=round[idx];
  if(answers.length>idx) return;
  const s=it.type==="match"?sel.map.slice():Array.isArray(sel)?sel.slice():sel;
  const right=grade(it,s);
  answers.push({pick:s,right,hint:it.hintUsed});
  document.getElementById('hintBtn').hidden=true;
  const rb=document.getElementById('resetBtn'); if(rb) rb.hidden=true;
  document.getElementById('submit').hidden=true;
  if(it.type==="match"){
    app.querySelectorAll('.mL .opt').forEach((b,i)=>{
      b.disabled=true; b.classList.remove('sel','paired');
      const ok=s[i]===it.correct[i];
      b.classList.add(ok?'ok':'bad');
      if(!ok) b.querySelector('.mark').textContent='짝 틀림';
    });
    app.querySelectorAll('.mR .opt').forEach((b,j)=>{
      b.disabled=true; b.classList.remove('paired','waiting');
      const owner=s.indexOf(j), truth=it.correct.indexOf(j);
      b.classList.add(owner===truth?'ok':'bad');
      b.querySelector('.n').textContent=String(truth+1);
      if(owner!==truth) b.querySelector('.mark').textContent=`정답 ${truth+1}번`;
    });
  }else if(it.type==="piece"){
    app.querySelectorAll('.slot').forEach((b,k)=>{
      b.disabled=true; b.classList.remove('next');
      const ok=it.opts[s[k]]===it.w[k];
      b.classList.add(ok?'ok':'bad');
      if(!ok) b.querySelector('.sm').textContent=it.w[k];
    });
    app.querySelectorAll('.opt').forEach((b,i)=>{
      b.disabled=true; b.classList.remove('sel');
      if(it.w.includes(it.opts[i])) b.classList.add('ok');
      else { b.classList.add('dim'); b.querySelector('.mark').textContent='미끼'; }
    });
  }else app.querySelectorAll('.opt').forEach((b,i)=>{
    b.disabled=true; b.classList.remove('sel');
    const mark=b.querySelector('.mark');
    if(single(it.type)){
      if(i===it.correct) b.classList.add('ok'); else if(i===s) b.classList.add('bad'); else b.classList.add('dim');
    }else if(it.type==="multi"){
      const isY=it.correct.includes(i), chosen=s.includes(i);
      if(isY&&chosen) b.classList.add('ok');
      else if(isY){b.classList.add('miss');mark.textContent='놓친 정답';}
      else if(chosen){b.classList.add('bad');mark.textContent='오답';}
      else b.classList.add('dim');
    }else{
      const mine=s.indexOf(i), truth=it.correct.indexOf(i);
      b.classList.add(mine===truth?'ok':'bad');
      if(mine!==truth) mark.textContent=`정답 ${truth+1}번째`;
    }
  });
  app.querySelector('.edge i').style.width=((idx+1)/round.length*100)+'%';
  const last=idx===round.length-1;
  const fb=document.getElementById('fb');
  const correctLine=it.type==="piece"
    ? `<p>정답은 <b>${esc(it.a)}</b>예요. (${it.w.map(esc).join(' + ')})</p>`
    : it.type==="order"
    ? `<p>올바른 순서예요.</p><ol class="seqlist">${it.correct.map(i=>`<li>${esc(it.opts[i])}</li>`).join('')}</ol>`
    : it.type==="match"
    ? `<p>올바른 짝이에요.</p><ol class="seqlist">${it.opts.map((l,i)=>`<li>${esc(l)} — <b>${esc(it.rights[it.correct[i]])}</b></li>`).join('')}</ol>`
    : `<p>정답은 <b>${answerText(it)}</b>예요.</p>`;
  fb.innerHTML=`
    <div class="feedback ${right?'right':'wrong'}">
      <div class="verdict">${right?'정답이에요':'아쉬워요'}</div>
      ${right&&it.type!=="order"&&it.type!=="match"?'':correctLine}
      <p>${esc(it.ex)}</p>
      ${refHtml(it)}
    </div>
    <button class="primary" id="next" style="margin-top:14px">${last?'결과 보기':'다음 문제'}</button>`;
  const nb=document.getElementById('next');
  nb.addEventListener('click',()=>{ if(last) renderResult(); else { idx++; renderQuestion(); } });
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  fb.scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'});
  try{nb.focus({preventScroll:true});}catch(e){}
}

function renderResult(){
  const SCREEN='result';
  const score=answers.filter(a=>a.right).length;
  const hints=answers.filter(a=>a.hint).length;
  const prev=getBest(range);
  const record=isNaN(prev)||score>prev;
  if(record) setBest(range,score);
  const msg=score===round.length?'모두 맞히셨어요.':score>=round.length*0.8?'아주 잘하셨어요.':score>=round.length*0.5?'절반 넘게 맞히셨어요.':'다음 판에서 다시 도전해 보세요.';
  const wrong=round.map((it,i)=>({it,a:answers[i]})).filter(x=>!x.a.right);
  const label=(it,mine)=>it.type==="piece"?(mine?'내가 맞춘 답':'정답'):it.type==="order"?(mine?'내가 놓은 순서':'올바른 순서'):it.type==="match"?(mine?'내가 지은 짝':'올바른 짝'):(mine?'고른 답':'정답');
  const review=wrong.length?wrong.map(({it,a})=>`
    <div class="ritem">
      <div class="chips">${KIND[it.type]?`<span class="tag kindtag">${KIND[it.type]}</span>`:''}${a.hint?'<span class="tag">힌트 사용</span>':''}</div>
      <div class="rq">${esc(it.q)}</div>
      <div class="mine">${label(it,true)}: ${pickText(it,a.pick)}</div>
      <div class="ans">${label(it,false)}: ${answerText(it)}</div>
      <p>${esc(it.ex)}</p>
      ${refHtml(it)}
    </div>`).join(''):`<p class="allright">틀린 문제가 없어요.</p>`;
  const rank=rankOf(score,round.length), n=round.length;
  const scale=[['A',`${cutA(n)}점 이상`],['B',`${cutB(n)}~${cutA(n)-1}점`],['C',`${cutB(n)-1}점 이하`]]
    .map(([g,t])=>`<div class="${g===rank?'on':''}"><b>${g}</b>${t}</div>`).join('');
  app.className='wrap '+SCREEN;
  app.innerHTML=`
    <header class="rhead leather">
      <span class="rrange"><span class="notch rn" aria-hidden="true">${NOTCH[range]}</span>${RANGES[range].name}</span>
      <div class="seal g${rank}" role="img" aria-label="${rank}등급"><b>${rank}</b><small>등급</small></div>
      <div class="rscore"><b>${score}</b>/ ${n}점</div>
      <p class="rmsg">${msg}</p>
    </header>
    <section class="rsheet">
      <div class="scale">${scale}</div>
      <p class="note">${hints?'힌트를 '+hints+'번 썼어요. ':''}${record?'이 범위의 최고 점수예요.':'이 범위 최고 점수는 '+prev+'점('+rankOf(prev,n)+')이에요.'}</p>
      <div class="row"><button class="primary" id="again">같은 범위로 다시 하기</button><button class="secondary" id="home">범위 바꾸기</button></div>
      <div class="label">${wrong.length?'틀린 문제 다시 보기':'결과'}</div>
      <div class="review">${review}</div>
    </section>`;
  document.getElementById('again').addEventListener('click',startRound);
  document.getElementById('home').addEventListener('click',renderStart);
  top();
}

// 누를 때 금박이 번지는 효과
const RM=window.matchMedia('(prefers-reduced-motion: reduce)');
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.primary,.secondary,.opt,.slot,.range');
  if(!b||b.disabled||RM.matches) return;
  const r=b.getBoundingClientRect(), d=Math.max(r.width,r.height)*2.2;
  const ink=document.createElement('span');
  ink.className='ink';
  ink.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  b.appendChild(ink);
  ink.addEventListener('animationend',()=>ink.remove());
},{passive:true});

renderStart();
})();
</script>
</body>
</html>
