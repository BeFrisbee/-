<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>성경 퀴즈</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* 가죽 성경: 남색 가죽 표지와 금박, 얇은 성경 종이, 빨간 리본 책갈피, 옆면 색인 홈 */
:root{
  --paper:#f3f3ee;
  --surface:#ffffff;
  --fg:#23262d;
  --muted:#60656e;
  --line:#d9d8cf;
  --leather:#22304a;
  --leather-2:#18233a;
  --gilt:#c4a25b;
  --gilt-hi:#e3cb8d;
  --gilt-lo:#9c7d3c;
  --on-leather:#e3cb8d;
  --ribbon:#9d2a33;
  --sel-bg:#22304a;
  --sel-fg:#e3cb8d;
  --sel-n-bg:#c4a25b;
  --sel-n-fg:#18233a;
  --hint:#8a5a12;
  --hint-bg:#f8eedb;
  --ok:#1d7148;
  --ok-bg:#e2f1e7;
  --bad:#ad2f36;
  --bad-bg:#f8e4e5;
  --f-display:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151a24;--surface:#1e2432;--fg:#ebe8de;--muted:#a3a7b2;--line:#323a4b;
    --leather:#0f1626;--leather-2:#0a0f1b;--ribbon:#b33a43;
    --sel-bg:#c4a25b;--sel-fg:#161b26;--sel-n-bg:#161b26;--sel-n-fg:#e3cb8d;
    --hint:#ecc678;--hint-bg:#30281a;--ok:#71d3a1;--ok-bg:#163021;--bad:#f2959b;--bad-bg:#3a1d22;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#151a24;--surface:#1e2432;--fg:#ebe8de;--muted:#a3a7b2;--line:#323a4b;
  --leather:#0f1626;--leather-2:#0a0f1b;--ribbon:#b33a43;
  --sel-bg:#c4a25b;--sel-fg:#161b26;--sel-n-bg:#161b26;--sel-n-fg:#e3cb8d;
  --hint:#ecc678;--hint-bg:#30281a;--ok:#71d3a1;--ok-bg:#163021;--bad:#f2959b;--bad-bg:#3a1d22;color-scheme:dark;
}
body{background:var(--paper);color:var(--fg);font-family:var(--f-body);font-size:18px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.wrap{position:relative;max-width:560px;margin:0 auto;padding-inline:20px;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gilt);outline-offset:2px}

/* 가죽과 금박 */
.leather{
  color:var(--on-leather);
  background:
    radial-gradient(120% 80% at 50% 0%,rgba(255,255,255,.07),transparent 60%),
    repeating-radial-gradient(circle at 30% 40%,rgba(0,0,0,.06) 0 1px,transparent 1px 3px),
    linear-gradient(var(--leather),var(--leather-2));
}
.gilt-text{background:linear-gradient(180deg,var(--gilt-hi),var(--gilt) 55%,var(--gilt-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.orn{width:56px;height:1.5px;background:var(--gilt);opacity:.85;position:relative}
.orn::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;background:var(--gilt);transform:translate(-50%,-50%) rotate(45deg)}
.notch{
  flex:none;display:grid;place-items:center;width:46px;height:46px;padding-right:4px;border-radius:0 23px 23px 0;
  font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--gilt-hi);
  background:linear-gradient(var(--leather),var(--leather-2));
  box-shadow:inset 0 0 0 1px rgba(196,162,91,.3);
}

/* 시작: 표지 */
.cover{
  margin:-20px -20px 0;padding:56px 24px 64px;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;
}
.cover::before{
  content:"";position:absolute;inset:18px 18px 0;border:1.5px solid rgba(196,162,91,.7);border-bottom:0;border-radius:6px 6px 0 0;
  box-shadow:inset 0 0 0 4px transparent,inset 0 0 0 5px rgba(196,162,91,.35);pointer-events:none;
}
.cover h1{font-size:50px;line-height:1.2;letter-spacing:.08em}
.cover p{margin:0;font-family:var(--f-display);font-size:17px;color:var(--on-leather);opacity:.9}
.sheet{
  margin:-28px -20px 0;padding:26px 20px 0;border-radius:18px 18px 0 0;background:var(--paper);position:relative;
  display:flex;flex-direction:column;gap:14px;
}
.label{font-size:15px;font-weight:600;color:var(--muted)}
.ranges{display:flex;flex-direction:column}
.range{
  display:flex;align-items:center;gap:14px;text-align:left;width:calc(100% + 20px);
  padding:12px 0;border:0;border-bottom:1px solid var(--line);background:transparent;margin-left:-20px;padding-right:2px;
}
.range .t{flex:1;min-width:0}
.range strong{font-family:var(--f-display);font-size:22px;display:block;line-height:1.3}
.range .t span{display:block;font-size:15px;color:var(--muted);line-height:1.45}
.range .best{flex:none;font-size:14px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.range .best b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.1;color:var(--fg)}
.range[aria-pressed="true"] .notch{background:var(--ribbon);color:#fff}
.range[aria-pressed="true"] strong{color:var(--ribbon)}
.primary{
  width:100%;padding:17px;border:0;border-radius:12px;font-size:20px;font-weight:600;letter-spacing:.04em;
  color:var(--gilt-hi);
  background:
    repeating-radial-gradient(circle at 30% 40%,rgba(0,0,0,.06) 0 1px,transparent 1px 3px),
    linear-gradient(#2a3a58,var(--leather-2));
  box-shadow:inset 0 0 0 1px rgba(196,162,91,.35);
}
.primary:disabled{opacity:.38;cursor:default}
.secondary{width:100%;padding:15px;border-radius:12px;border:1.5px solid var(--muted);background:transparent;font-size:18px;font-weight:600;color:var(--fg)}
.note{font-size:14px;color:var(--muted);margin:0;line-height:1.65}

/* 문제 */
.edge{margin:-20px -20px 0;height:5px;background:var(--line);position:relative;overflow:hidden}
.edge i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--gilt-lo),var(--gilt-hi),var(--gilt-lo));transition:width .35s}
.ribbon{
  position:absolute;right:22px;top:0;width:46px;height:86px;padding-top:15px;z-index:1;
  display:flex;flex-direction:column;align-items:center;background:var(--ribbon);color:#fff;
  clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);
  font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1;font-variant-numeric:tabular-nums;
}
.ribbon small{font-family:var(--f-body);font-weight:500;font-size:11px;opacity:.85;margin-top:5px}
.qhead{display:flex;align-items:center;gap:10px;min-height:52px;margin-left:-20px;padding-right:64px}
.qhead .notch{width:38px;height:38px;font-size:16px;border-radius:0 19px 19px 0}
.qhead .kind{font-size:15px;font-weight:600;color:var(--fg)}
.qhead .tname{font-size:14px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-size:25px;line-height:1.5;font-weight:700;margin:0;text-wrap:pretty}
.howto{margin:-8px 0 0;font-size:15px;color:var(--muted)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:-4px}
.hintbtn{
  display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--hint);background:transparent;color:var(--hint);
  font-size:16px;font-weight:600;
}
.resetbtn{border:0;background:transparent;color:var(--muted);font-size:15px;text-decoration:underline;text-underline-offset:3px;padding:8px 4px}
.hintbox{margin:-4px 0 0;padding:12px 16px;border-radius:12px;background:var(--hint-bg);color:var(--fg);font-size:17px;line-height:1.6;border-left:3px solid var(--gilt)}
.hintbox b{color:var(--hint);margin-right:6px}

.opts{display:grid;gap:10px}
.opt{
  display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  padding:15px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;line-height:1.4;color:var(--fg);
}
.opt .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:600;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.opts.multi .opt .n{border-radius:8px}
.opt .txt{flex:1;min-width:0}
.opt .mark{flex:none;font-size:13px;font-weight:600}
.opt.sel{border-color:var(--sel-bg);background:var(--sel-bg);color:var(--sel-fg)}
.opt.sel .n{background:var(--sel-n-bg);color:var(--sel-n-fg);box-shadow:none}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--fg)}
.opt.ok .n{background:var(--ok);color:var(--surface);box-shadow:none}
.opt.miss{border-color:var(--ok);border-style:dashed;background:var(--surface)}
.opt.miss .mark{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--fg)}
.opt.bad .n{background:var(--bad);color:var(--surface);box-shadow:none}
.opt.bad .mark{color:var(--bad)}
.opt.dim{opacity:.5}

.feedback{border-radius:12px;padding:16px 18px;background:var(--surface);border:1.5px solid var(--line);border-top:3px solid var(--gilt);display:flex;flex-direction:column;gap:6px}
.feedback .verdict{font-family:var(--f-display);font-size:23px;font-weight:700}
.feedback.right .verdict{color:var(--ok)}
.feedback.wrong .verdict{color:var(--bad)}
.feedback p{margin:0}
.seqlist{margin:0;padding-left:1.4em}
.ref{font-size:16px;font-weight:600;color:var(--fg)}
a.ref{color:var(--ribbon);text-decoration:underline;text-underline-offset:3px}

.versecard{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;text-decoration:none;
  padding:14px 16px;border-radius:12px;
}
.versecard .vlabel{font-size:13px;font-weight:600;opacity:.8}
.versecard .vref{font-family:var(--f-display);font-size:22px;font-weight:700;flex:1;min-width:0}
.versecard .vopen{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:var(--leather-2);background:var(--gilt);padding:7px 14px;border-radius:999px}

/* 짝짓기 */
.matchwrap{display:flex;flex-direction:column;gap:10px}
.mlabel{font-size:14px;font-weight:600;color:var(--muted);margin-top:4px}
.opts.match .opt .n{border-radius:8px}
.opt.paired{border-color:var(--leather)}
.opt.paired .n{background:var(--leather);color:var(--gilt-hi);box-shadow:none}
.opt.waiting{border-style:dashed;border-color:var(--leather)}
.opts.mL .opt.sel .n{background:var(--sel-n-bg);color:var(--sel-n-fg)}

/* 조각 맞추기 */
.slots{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:7px}
.slot{
  position:relative;min-height:72px;padding:18px 2px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.2;text-align:center;
}
.slot .sn{position:absolute;top:4px;left:0;right:0;font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--muted)}
.slot .sm{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--ok)}
.slot .sm:empty{display:none}
.slot.next{border-style:dashed;border-color:var(--leather)}
.slot.filled{border-color:var(--leather);box-shadow:inset 0 -3px 0 var(--gilt)}
.slot:disabled{cursor:default}
.slot.ok{border-color:var(--ok);background:var(--ok-bg);box-shadow:none}
.slot.bad{border-color:var(--bad);background:var(--bad-bg);box-shadow:none}
.opts.piece{grid-template-columns:1fr 1fr;gap:9px}
.opts.piece .opt{padding:14px 12px;gap:8px;font-family:var(--f-display);font-size:23px;font-weight:700}
.opts.piece .opt .txt{text-align:center}
.opts.piece .opt .n{width:26px;height:26px;font-family:var(--f-body);font-size:14px}
.opts.piece .opt:not(.sel):not(:disabled) .n{box-shadow:none}
.opts.piece .opt.ok .n{background:transparent;color:var(--ok)}
.opts.piece .opt .mark{font-family:var(--f-body)}
.opts.piece .opt.dim .mark{color:var(--muted)}

/* 결과: 성적 인장 */
.rhead{margin:-20px -20px 0;padding:34px 24px 46px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;position:relative}
.rhead::before{content:"";position:absolute;inset:18px 18px 0;border:1.5px solid rgba(196,162,91,.7);border-bottom:0;border-radius:6px 6px 0 0;pointer-events:none}
.rrange .notch.rn{width:30px;height:30px;font-size:14px;border-radius:50%;padding:0;background:var(--gilt);color:var(--leather-2)}
.rrange{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--on-leather);opacity:.9}
.seal{
  width:136px;height:136px;border-radius:50%;display:grid;place-items:center;position:relative;
  --m-hi:var(--gilt-hi);--m-mid:var(--gilt);--m-lo:var(--gilt-lo);
  background:radial-gradient(circle at 35% 30%,var(--m-hi),var(--m-mid) 45%,var(--m-lo));
  box-shadow:0 0 0 4px var(--leather),0 0 0 5.5px var(--m-mid),0 8px 20px rgba(0,0,0,.35);
}
/* A 금박, B 은박, C 동박 */
.seal.gB{--m-hi:#f4f5f7;--m-mid:#b9bdc6;--m-lo:#7c818c}
.seal.gC{--m-hi:#f1caa3;--m-mid:#b67a4a;--m-lo:#7b4a27}
.notch{box-shadow:inset -1px 0 0 rgba(196,162,91,.55),inset 0 1px 0 rgba(196,162,91,.55),inset 0 -1px 0 rgba(196,162,91,.55)}
.seal::before{content:"";position:absolute;inset:9px;border-radius:50%;border:1.5px solid rgba(24,35,58,.45)}
.seal b{font-family:var(--f-display);font-size:74px;line-height:1;color:var(--leather-2);margin-top:-4px}
.seal small{position:absolute;bottom:17px;font-size:12px;font-weight:600;color:var(--leather-2);letter-spacing:.06em}
.rscore{font-family:var(--f-display);font-size:22px;color:var(--on-leather)}
.rscore b{font-size:40px;color:#fff;font-variant-numeric:tabular-nums;margin-right:4px}
.rmsg{font-family:var(--f-display);font-size:20px;color:#fff;margin:0}
.rsheet{margin:-28px -20px 0;padding:24px 20px 0;border-radius:18px 18px 0 0;background:var(--paper);position:relative;display:flex;flex-direction:column;gap:14px}
.scale{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.scale div{padding:9px 6px;text-align:center;font-size:14px;color:var(--muted);line-height:1.35}
.scale div+div{border-left:1.5px solid var(--line)}
.scale b{display:block;font-family:var(--f-display);font-size:22px;color:var(--fg)}
.scale .on{background:var(--sel-bg);color:var(--sel-fg)}
.scale .on b{color:var(--sel-fg)}
.review{display:flex;flex-direction:column;gap:12px}
.ritem{border-radius:12px;padding:14px 16px;background:var(--surface);border:1.5px solid var(--line);display:flex;flex-direction:column;gap:6px}
.ritem .rq{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.45}
.ritem .mine{font-size:16px;color:var(--bad)}
.ritem .ans{font-size:17px;color:var(--ok);font-weight:600}
.ritem p{margin:0;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tag{align-self:flex-start;font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--hint-bg);color:var(--hint)}
.kindtag{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line)}
.allright{margin:0;padding:16px 18px;border-radius:12px;background:var(--ok-bg);color:var(--ok);font-weight:600}
.row{display:grid;gap:10px}
@media (prefers-reduced-motion:reduce){.edge i{transition:none}}

/* 시작 화면은 한 화면 안에 들어가게: 남는 높이는 표지가 채우고, 모자라면 표지 여백부터 줄어듦 */
.wrap.start{min-height:100vh;min-height:100dvh;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.wrap.start .cover{flex:1 1 auto;justify-content:center;padding-top:clamp(36px,7vh,56px);padding-bottom:clamp(44px,8vh,64px);gap:clamp(8px,1.6vh,14px)}
.wrap.start .cover h1{font-size:clamp(40px,6vh,50px)}
.wrap.start .range{padding-block:clamp(7px,1.3vh,12px)}
.wrap.start .sheet{gap:clamp(8px,1.5vh,14px)}

/* 누를 때 효과 */
button,a{-webkit-tap-highlight-color:transparent}
.primary,.secondary,.range,.opt,.slot,.hintbtn,.resetbtn,.versecard,.notch,.opt .n{
  transition:transform .14s ease,background-color .2s ease,border-color .2s ease,color .2s ease,box-shadow .2s ease,opacity .2s ease;
}
.primary,.secondary,.range,.opt,.slot{position:relative;overflow:hidden;isolation:isolate}
.primary:not(:disabled):active{transform:translateY(1px) scale(.985);box-shadow:inset 0 3px 10px rgba(0,0,0,.4)}
.secondary:active,.opt:not(:disabled):active,.slot:not(:disabled):active{transform:scale(.97)}
.range:active .notch{transform:translateX(5px)}
.hintbtn:active{transform:scale(.95);background:var(--hint-bg)}
.versecard:active{transform:scale(.98)}
.ink{
  position:absolute;z-index:-1;border-radius:50%;pointer-events:none;transform:scale(0);opacity:.6;
  background:radial-gradient(circle,rgba(230,207,147,.85),rgba(196,162,91,.35) 55%,transparent 70%);
  animation:ink .55s ease-out forwards;
}
@keyframes ink{to{transform:scale(1);opacity:0}}
.primary .ink,.opt.sel .ink,.opt.paired .ink{opacity:.9}
.opt.sel .n,.opt.paired .n{animation:pop .24s ease-out}
.slot.filled .st{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.55)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.feedback{animation:rise .3s ease-out}
.hintbox{animation:rise .24s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .primary,.secondary,.range,.opt,.slot,.hintbtn,.resetbtn,.versecard,.notch,.opt .n{transition:none}
  .opt.sel .n,.opt.paired .n,.slot.filled .st,.feedback,.hintbox{animation:none}
  .primary:active,.secondary:active,.opt:active,.slot:active,.hintbtn:active,.versecard:active,.range:active .notch{transform:none}
}
</style>

<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>

<script>
(()=>{
/*
  모든 정답·해설·힌트·보기는 대한성서공회 개역개정 본문과 대조해 확인함.
  choice: v에 같은 지식을 묻는 문장 두 가지. 보기 배열의 첫 번째가 정답, 나머지는 오답 후보(매번 3개를 뽑음).
  verse : 구절 링크를 열어 읽고 푸는 문제. l = [책 코드, 장, 절]. a의 첫 번째가 정답.
  multi : yes = 해당하는 것, no = 해당하지 않는 것. 매번 섞어 5개를 뽑음.
  order : seq = 올바른 순서. 매번 4개를 뽑아 섞음.
*/
const OT=[

{type:"piece",q:"요셉의 장인, 곧 요셉의 아내 아스낫의 아버지인 온의 제사장은?",w:["보디","베","라"],d:["발","아스","낫","베리"],h:"요셉을 샀던 시위대장 보디발과 이름 앞부분이 같아요.",ex:"창세기 41:45에 따르면 요셉의 아내 아스낫은 온의 제사장 보디베라의 딸이에요. 요셉을 샀던 시위대장 보디발과는 다른 사람이에요.",ref:"창세기 41:45; 39:1"},
{type:"piece",q:"아브람의 조카 롯을 사로잡아 간 왕들 가운데, 엘람의 왕은?",w:["그돌","라","오멜"],d:["아므","라벨","디달","오맬"],h:"아브람은 집에서 길리고 훈련된 사람 318명을 데리고 쫓아갔어요.",ex:"창세기 14장에서 엘람 왕 그돌라오멜과 동맹한 왕들이 소돔을 쳐 롯을 사로잡아 갔고, 아브람이 쫓아가 롯과 재물을 되찾았어요.",ref:"창세기 14:1-16"},
{type:"piece",q:"자식이 없던 아브람이 '내 상속자'라고 말한 다메섹 사람은?",w:["엘리","에","셀"],d:["에벤","살","엘르","에셀"],h:"하나님은 그가 아니라 아브람의 몸에서 날 자가 상속자가 되리라 하셨어요.",ex:"창세기 15장에서 아브람은 자식이 없어 다메섹 사람 엘리에셀이 상속자가 되겠다고 했지만, 하나님은 아브람의 몸에서 날 자가 상속자가 되리라 하셨어요.",ref:"창세기 15:2-4"},
{type:"piece",q:"아버지의 바알 제단을 헐었다고 해서 기드온에게 붙여진 다른 이름은?",w:["여룹","바","알"],d:["바락","여로","알론","스룹"],h:"'바알이 그와 더불어 다툴 것이라'는 말에서 나온 이름이에요.",ex:"사사기 6장에서 기드온은 아버지 요아스의 바알 제단을 헐고 그 곁의 아세라 상을 찍었어요. 그 일로 그날 그를 여룹바알이라 불렀어요.",ref:"사사기 6:25-32"},
{type:"piece",q:"이스라엘 왕 아하시야가 다락 난간에서 떨어져 병든 뒤, 병이 나을지 물으려고 사자를 보낸 에그론의 신은?",w:["바알","세","붑"],d:["불","브올","세벨","아세"],h:"엘리야가 '이스라엘에 하나님이 없어서 에그론의 신에게 묻느냐'고 꾸짖었어요.",ex:"열왕기하 1장에서 아하시야는 병들자 에그론의 신 바알세붑에게 물으러 사자를 보냈고, 엘리야가 그 사자들을 막아 하나님의 말씀을 전했어요. 신약의 '바알세불'과 끝 글자가 달라요.",ref:"열왕기하 1:2-3"},
{type:"piece",q:"블레셋에서 돌아온 여호와의 궤가 아비나답의 집에 들어가 20년 동안 머문 성읍은?",w:["기럇","여아","림"],d:["아르","바","기랏","여림"],h:"산에 사는 아비나답의 아들 엘리아살이 궤를 지켰어요.",ex:"사무엘상 7장에서 기럇여아림 사람들이 여호와의 궤를 산에 사는 아비나답의 집에 들여놓았고, 궤는 그곳에 20년 동안 있었어요.",ref:"사무엘상 7:1-2"},
{type:"piece",q:"사래를 피해 도망한 하갈이 여호와의 사자를 만난 뒤, 그 우물에 붙은 이름은?",w:["브엘","라해","로이"],d:["세바","엘로","라헬","로암"],h:"가데스와 베렛 사이에 있는 우물이에요.",ex:"창세기 16장에서 하갈은 자기를 살피시는 하나님을 만났고, 그 우물은 브엘라해로이라 불렸어요. 가데스와 베렛 사이에 있어요.",ref:"창세기 16:7-14"},
{type:"piece",q:"민수기 32장에서 모세가 르우벤과 갓 자손을 꾸짖으며 떠올린, 조상들이 정탐꾼을 보냈던 곳은?",w:["가데","스","바네","아"],d:["가나","사브","낫","바란"],h:"정탐꾼들이 그 땅을 보고 와서 백성의 마음을 낙심하게 했던 일을 떠올린 장면이에요.",ex:"민수기 32장에서 모세는 르우벤과 갓 자손에게, 조상들도 가데스바네아에서 땅을 보러 보냈을 때 이스라엘 자손을 낙심하게 했다고 꾸짖었어요.",ref:"민수기 32:6-9"},
{type:"piece",q:"사무엘의 아버지 엘가나가 살던, 에브라임 산지의 성읍 이름은?",w:["라마","다임","소빔"],d:["마하","나임","기럇","소밤"],h:"사무엘상 첫 절에 나오는 긴 지명이에요.",ex:"사무엘상 1:1은 엘가나를 에브라임 산지 라마다임소빔에 사는 사람으로 소개해요.",ref:"사무엘상 1:1"},
{type:"piece",q:"솔로몬의 뒤를 이어 왕이 되었으나, 백성의 멍에를 더 무겁게 하겠다고 답해 나라가 갈라지게 된 왕은?",w:["르호","보","암"],d:["여로","아비","얌","르우"],h:"노인들의 조언 대신 함께 자란 젊은 신하들의 말을 따랐어요.",ex:"열왕기상 12장에서 솔로몬의 아들 르호보암은 젊은 신하들의 말을 따라 백성에게 더 무거운 멍에를 메우겠다고 했고, 열 지파는 다윗의 집을 떠났어요.",ref:"열왕기상 12:1-20"},
{type:"piece",q:"갈라진 북쪽 이스라엘의 첫 왕이 되어, 금송아지 둘을 만들어 벧엘과 단에 둔 사람은?",w:["여로","보","암"],d:["르호","아비","얌","여룹"],h:"느밧의 아들이에요.",ex:"열왕기상 12장에서 느밧의 아들 여로보암은 이스라엘의 왕이 되었고, 백성이 예루살렘으로 올라가지 않게 하려고 금송아지 둘을 만들어 벧엘과 단에 두었어요.",ref:"열왕기상 12:20, 26-29"},
{type:"piece",q:"열여덟 살에 왕이 되어 석 달 동안 다스리다 바벨론으로 끌려간 유다 왕은?",w:["여호","야","긴"],d:["김","사밧","야다","여로"],h:"37년 뒤 바벨론 왕이 그를 옥에서 풀어 주었어요.",ex:"열왕기하 24장에 따르면 여호야긴은 18세에 왕이 되어 석 달을 다스렸고, 바벨론 왕에게 나아가 항복한 뒤 바벨론으로 끌려갔어요. 아버지의 이름과 끝 글자 하나만 달라요.",ref:"열왕기하 24:8-15"},
{type:"piece",q:"애굽 왕 바로느고가 요시야의 아들 엘리아김을 왕으로 세우며 고쳐 준 이름은?",w:["여호","야","김"],d:["긴","시드","엘리","아김"],h:"스물다섯 살에 왕이 되어 11년 동안 다스렸어요.",ex:"열왕기하 23:34에서 바로느고는 엘리아김을 왕으로 세우고 이름을 여호야김으로 고쳤어요. 그는 25세에 왕이 되어 11년을 다스렸어요.",ref:"열왕기하 23:34-36"},

{type:"piece",q:"압살롬의 난 때 마하나임에 머문 다윗을 공궤한 80세의 길르앗 사람은?",w:["바르","실","래"],d:["김함","길르","래아","바실"],h:"다윗이 예루살렘으로 함께 가자고 했지만, 늙었다며 김함을 대신 보냈어요.",ex:"사무엘하 19장에서 바르실래는 다윗과 함께 요단까지 왔지만, 나이가 80세라며 예루살렘에 가지 않고 김함을 대신 보냈어요. 그는 다윗이 마하나임에 있을 때 왕을 공궤한 큰 부자였어요.",ref:"사무엘하 19:31-39"},

{type:"piece",q:"제구시에 십자가 위에서 예수께서 크게 소리 지르신 말씀은?",w:["엘리","엘리","라마","사박다니"],a:"엘리 엘리 라마 사박다니",d:["엘로","라마나","아바","사바"],h:"번역하면 '나의 하나님, 나의 하나님, 어찌하여 나를 버리셨나이까'예요.",ex:"마태복음 27장과 마가복음 15장에서 예수께서는 제구시에 엘리 엘리 라마 사박다니라고 크게 외치셨어요. 개역개정은 두 복음서 모두 같은 표기로 적어요.",ref:"마태복음 27:46; 마가복음 15:34"},

{type:"piece",q:"빌라도에게 예수의 시체를 달라고 하여 자기 새 무덤에 넣은 부자 요셉의 고향은?",w:["아리","마","대"],d:["막달","라","겟세","리마"],h:"마태복음은 그도 예수의 제자였다고 소개해요.",ex:"마태복음 27장에서 아리마대의 부자 요셉은 빌라도에게 예수의 시체를 청해 깨끗한 세마포로 싸서, 바위 속에 판 자기 새 무덤에 넣었어요.",ref:"마태복음 27:57-60"},

const OT5=[{"ref":"역대상 4:9-10","h":"그는 형제보다 귀중한 자였다고 소개돼요.","ex":"야베스의 어머니는 수고로이 낳았다 하여 그 이름을 지었고, 야베스는 지역을 넓혀 주시고 환난을 벗어나 근심이 없게 해 달라고 기도해 응답받았어요.","v":[["어머니가 '내가 수고로이 낳았다' 하여 이름을 지은 사람은?",["야베스","베노니","이가봇","야곱","에서","삼손"]],["야베스가 주의 손으로 도우사 벗어나게 해 달라고 구한 것은?",["환난","가난","질병","원수","포로","흉년"]]]},{"ref":"역대상 21:18, 25-26","h":"그는 여부스 사람이었어요.","ex":"다윗은 갓의 말대로 여부스 사람 오르난의 타작 마당에 제단을 쌓으려고 금 육백 세겔을 주고 그 터를 샀고, 여호와께서 하늘에서 번제단 위에 불을 내려 응답하셨어요.","v":[["역대상 21장에서 다윗이 여호와께 제단을 쌓으려고 산 타작 마당의 주인은?",["오르난","나봇","보아스","기돈","오벧에돔","바르실래"]],["역대상 21장에서 다윗이 타작 마당 터의 값으로 준 것은?",["금 육백 세겔","금 오백 세겔","금 칠백 세겔","금 사백 세겔","은 육백 세겔","금 삼백 세겔"]]]},{"type":"multi","ref":"역대상 22:2-4, 14; 29:2","q":"다윗이 성전 건축을 위해 준비한 것으로 역대상 22장과 29장에 나오는 것을 모두 고르세요.","yes":["금","은","놋","철","백향목","마노","옥돌"],"no":["상아","진주","유리","수정"],"h":"백향목은 시돈 사람과 두로 사람이 많이 실어 왔어요.","ex":"다윗은 금 십만 달란트와 은 백만 달란트, 무게를 달 수 없을 만큼 많은 놋과 철, 백향목과 돌을 준비했고, 29장에서는 마노와 여러 보석과 옥돌도 준비했다고 말해요."},{"type":"order","ref":"역대상 2:13-15","q":"역대상 2장에 나오는 이새의 아들들을 본문 순서(맏아들부터)대로 놓으세요.","seq":["엘리압","아비나답","시므아","느다넬","랏대","오셈","다윗"],"h":"왕이 된 아들은 맨 마지막, 일곱째로 나와요.","ex":"역대상 2장은 맏아들 엘리압, 둘째 아비나답, 셋째 시므아, 넷째 느다넬, 다섯째 랏대, 여섯째 오셈, 일곱째 다윗 순으로 적어요."},{"type":"match","ref":"역대상 11:11, 22; 20:4-7","q":"다윗 시대의 용사와 그가 한 일을 바르게 짝지으세요.","L":"용사","R":"한 일","pairs":[["야소브암","창을 들어 한꺼번에 삼백 명을 죽임"],["브나야","눈 올 때 함정에 내려가 사자를 죽임"],["십브개","게셀 전쟁에서 십배를 쳐죽임"],["엘하난","골리앗의 아우 라흐미를 죽임"],["요나단","손발 가락이 여섯씩인 거인을 죽임"]],"h":"요나단은 다윗의 형 시므아의 아들이에요.","ex":"삼십 명의 우두머리 야소브암은 한꺼번에 삼백 명을 죽였고, 브나야는 함정에서 사자를 죽였어요. 블레셋과의 전쟁에서 십브개는 십배를, 엘하난은 라흐미를, 요나단은 손발 가락이 여섯씩인 키 큰 자를 죽였어요."},{"type":"piece","ref":"역대상 11:12-14","q":"다윗의 세 용사 가운데 하나인 엘르아살이 다윗과 함께 있다가, 보리밭 가운데 서서 블레셋 사람을 물리친 곳은?","w":["바스","담","밈"],"d":["에베","바산","담나","미스"],"h":"백성은 블레셋 사람 앞에서 도망했지만 그는 밭을 지켰어요.","ex":"아호아 사람 도도의 아들 엘르아살은 바스담밈에서 다윗과 함께 있었고, 보리가 많이 난 밭을 지키며 블레셋 사람을 죽여 큰 구원을 이루었어요."},{"ref":"역대하 26:1, 16-21","h":"열여섯 살에 왕이 되어 예루살렘에서 오십이 년 동안 다스렸어요.","ex":"웃시야는 여호와의 성전에 들어가 향단에 분향하려 했고, 제사장 아사랴가 용맹한 제사장 팔십 명과 함께 뒤따라 들어가 막았어요. 그때 왕의 이마에 나병이 생겨 별궁에 살게 되었어요.","v":[["성전에 들어가 향단에 분향하려다 이마에 나병이 생긴 유다 왕은?",["웃시야","아하스","요담","아마샤","므낫세","여호람"]],["웃시야 왕을 따라 성전에 들어가 분향을 막은 제사장은?",["아사랴","여호야다","힐기야","스가랴","사독","아비아달"]]]},{"ref":"역대하 33:1, 11-13","h":"열두 살에 왕위에 올라 오십오 년 동안 다스린 왕이에요.","ex":"므낫세는 앗수르 왕의 군대 지휘관들에게 사로잡혀 쇠사슬에 결박된 채 바벨론으로 끌려갔어요. 환난 중에 크게 겸손하여 기도하자 하나님이 들으시고 예루살렘으로 돌아와 다시 왕위에 앉게 하셨어요.","v":[["앗수르 군대에 사로잡혀 끌려갔다가, 크게 겸손하여 기도한 뒤 다시 왕위에 앉은 유다 왕은?",["므낫세","여호야긴","시드기야","아몬","여호아하스","히스기야"]],["므낫세가 쇠사슬에 결박되어 끌려간 곳은?",["바벨론","니느웨","애굽","다메섹","수산","갈그미스"]]]},{"ref":"역대하 20:1, 21-22, 26","h":"쳐들어온 무리는 모압과 암몬 자손, 세일 산 주민들이었어요.","ex":"여호사밧은 노래하는 자들을 택해 거룩한 예복을 입히고 군대 앞에서 찬송하게 했어요. 노래와 찬송이 시작될 때 여호와께서 복병을 두어 적을 치셨고, 넷째 날 무리가 브라가 골짜기에 모여 여호와를 송축했어요.","v":[["여호사밧이 노래하는 자들을 군대 앞에 세워 찬송하게 했을 때, 여호와께서 적을 치시려고 두신 것은?",["복병","우박","큰 우레","불 말과 불 병거","메뚜기 떼","큰 바람"]],["여호사밧의 군대가 승리한 뒤 넷째 날에 모여 여호와를 송축한 곳은?",["브라가 골짜기","아골 골짜기","소렉 골짜기","엘라 골짜기","힌놈 골짜기","르바임 골짜기"]]]},{"type":"verse","l":["2ch",7,14],"ref":"역대하 7:14","q":"이 구절에서 하나님이 백성의 죄를 사하신 뒤 고치시겠다고 하신 것은?","a":["그들의 땅","그들의 몸","그들의 마음","그들의 성전","그들의 성읍","그들의 왕"],"h":"바로 앞 13절에서는 비가 오지 않고 메뚜기가 토산을 먹는 때를 말씀하셨어요.","ex":"하나님은 백성이 스스로 낮추고 기도하며 악한 길에서 떠나면, 하늘에서 듣고 죄를 사하며 그들의 땅을 고치겠다고 솔로몬에게 말씀하셨어요."},{"type":"multi","ref":"역대하 30:2, 6, 10-11, 23, 26","q":"히스기야가 지킨 유월절(역대하 30장)에 관해 본문에 나오는 것을 모두 고르세요.","yes":["둘째 달에 지킴","보발꾼들이 온 이스라엘과 유다에 두루 다님","사람들이 보발꾼을 조롱하며 비웃음","아셀·므낫세·스불론에서 몇 사람이 겸손히 옴","칠 일을 더 지키기로 함"],"no":["첫째 달 열나흗날에 지킴","성전에서 율법책을 발견함","하늘에서 불이 내려 번제물을 사름","아하와 강 가에서 금식함"],"h":"이 유월절은 평소보다 한 달 늦게 지켰어요.","ex":"히스기야 때는 둘째 달에 유월절을 지켰고, 보발꾼들이 조롱을 받으면서도 두루 다녔어요. 무교절 칠 일을 지킨 뒤 칠 일을 더 지켰고, 솔로몬 때로부터 이런 기쁨이 예루살렘에 없었다고 해요."},{"type":"order","ref":"역대하 12:13; 14:1; 17:1; 24:1; 26:1; 29:1; 34:1","q":"역대하에 나오는 유다 왕들을 다스린 순서대로 놓으세요.","seq":["르호보암","아사","여호사밧","요아스","웃시야","히스기야","요시야"],"h":"여덟 살에 왕이 된 왕이 가장 나중이에요.","ex":"르호보암(12장), 아사(14장), 여호사밧(17장), 요아스(24장), 웃시야(26장), 히스기야(29장), 요시야(34장) 순이에요. 여호사밧은 아사의 아들이에요."},{"type":"match","ref":"역대하 16:12; 21:12, 18-19; 24:20-21; 25:14; 28:23-24; 29:3","q":"역대하의 유다 왕과 그가 한 일(당한 일)을 바르게 짝지으세요.","L":"왕","R":"한 일","pairs":[["아사","발이 병들었으나 여호와께 구하지 않고 의원들에게 구함"],["여호람","엘리야의 글을 받고, 창자의 병으로 죽음"],["요아스","여호야다의 아들 스가랴를 돌로 쳐죽이게 함"],["아마샤","세일 자손의 신들을 가져와 섬김"],["아하스","다메섹 신들에게 제사하고 성전 문들을 닫음"],["히스기야","첫째 해 첫째 달에 성전 문들을 열고 수리함"]],"h":"스가랴의 아버지 여호야다는 요아스에게 은혜를 베푼 제사장이었어요.","ex":"아사는 의원들에게 구했고, 여호람은 창자의 병으로 죽었어요. 요아스는 스가랴를 성전 뜰에서 죽게 했고, 아마샤는 에돔의 신들을 섬겼으며, 아하스는 성전 문을 닫았고 히스기야는 그 문들을 열었어요."},{"ref":"에스라 8:21-23","h":"그곳에 사흘 머물며 살펴보니 레위 자손이 한 사람도 없었어요.","ex":"에스라는 하나님의 손이 찾는 모든 자에게 선을 베푸신다고 왕에게 말했기에, 적군을 막아 줄 보병과 마병을 구하기 부끄러워 아하와 강 가에서 금식하며 평탄한 길을 간구했어요.","v":[["에스라가 예루살렘으로 떠나기 전 금식을 선포한 곳은?",["아하와 강 가","그발 강 가","힛데겔 강 가","유브라데 강 가","을래 강 가","요단 강 가"]],["에스라가 길에서 적군을 막아 달라고 왕에게 구하기를 부끄러워한 것은?",["보병과 마병","금과 은","성전 그릇","왕의 조서","백향목","병거와 말"]]]},{"type":"verse","l":["ezr",7,10],"ref":"에스라 7:10","q":"이 구절에서 에스라가 결심한 일 가운데 맨 처음 나오는 것은?","a":["여호와의 율법을 연구함","율법을 준행함","율례와 규례를 가르침","성전 그릇을 옮김","성벽을 다시 쌓음","백성을 계수함"],"h":"9절에 따르면 그는 다섯째 달 초하루에 예루살렘에 이르렀어요.","ex":"에스라는 여호와의 율법을 연구하고, 그대로 행하며, 율례와 규례를 이스라엘에게 가르치기로 결심했어요."},{"type":"order","ref":"에스라 1:1; 3:1-4, 12; 4:24; 5:1; 6:15; 7:9; 9:3","q":"에스라서에 나오는 일을 본문 순서대로 놓으세요.","seq":["고레스가 성전을 건축하라는 조서를 내림","일곱째 달에 제단을 세우고 초막절을 지킴","성전 기초를 놓자 노인들이 대성통곡함","성전 공사가 다리오 제이년까지 중단됨","학개와 스가랴가 예언함","아달월 삼일에 성전 공사를 마침","에스라가 다섯째 달 초하루에 예루살렘에 이름","통혼 소식을 듣고 에스라가 옷을 찢음"],"h":"멈췄던 공사는 선지자들의 예언 뒤에 다시 시작됐어요.","ex":"고레스의 조서, 제단과 초막절, 성전 기초와 통곡, 대적의 방해로 인한 중단, 학개와 스가랴의 예언, 다리오 제육년 아달월의 완공, 에스라의 도착, 통혼 문제에 대한 애통 순이에요."},{"type":"piece","ref":"에스라 1:7-11","q":"고레스 왕이 창고지기 미드르닷을 시켜 꺼낸 성전 그릇을 넘겨받아 예루살렘으로 가지고 간 유다 총독은?","w":["세스","바","살"],"d":["벨사","스룹","사살","세바"],"h":"넘겨받은 금, 은 그릇은 모두 오천사백 개였어요.","ex":"느부갓네살이 옮겨 갔던 여호와의 성전 그릇을 고레스가 꺼내 유다 총독 세스바살에게 넘겨주었고, 세스바살이 포로들과 함께 그 그릇들을 가지고 갔어요."},{"type":"multi","ref":"느헤미야 3:1, 3, 6, 13-15, 28, 31","q":"느헤미야 3장 성벽 공사에 나오는 문을 모두 고르세요.","yes":["양문","어문","옛 문","골짜기 문","분문","샘문","마문","함밉갓 문"],"no":["미문","베냐민 문","대궐 문"],"h":"공사 기록은 양과 관련된 이름의 문에서 시작해요.","ex":"느헤미야 3장에는 양문, 어문, 옛 문, 골짜기 문, 분문, 샘문, 동쪽 수문, 마문, 동문, 함밉갓 문이 나와요."},{"type":"piece","ref":"느헤미야 13:4-9","q":"하나님의 전의 방을 맡은 제사장이 도비야와 연락하며 전 뜰에 그를 위한 큰 방을 마련해 주었어요. 느헤미야가 도비야의 세간을 밖으로 내던지게 된 이 일의 제사장은?","w":["엘리","아","십"],"d":["엘리압","아삽","리아","십브"],"h":"느헤미야 3장에서 형제 제사장들과 함께 양문을 건축한 대제사장과 같은 이름이에요.","ex":"제사장 엘리아십은 소제물과 유향, 십일조를 두던 큰 방을 도비야에게 내주었고, 느헤미야는 도비야의 세간을 내던지고 그 방을 정결하게 한 뒤 다시 그릇과 예물을 들여놓았어요."},{"type":"match","ref":"에스더 1:16-19; 2:3, 21; 4:5; 5:14; 7:9","q":"에스더서의 인물과 그가 한 일을 바르게 짝지으세요.","L":"인물","R":"한 일","pairs":[["헤개","궁녀를 주관한 내시"],["하닥","에스더의 명으로 모르드개에게 다녀온 내시"],["빅단과 데레스","아하수에로 왕을 암살하려 한 문지기 내시"],["하르보나","하만이 세운 나무를 왕에게 알린 내시"],["세레스","오십 규빗 나무를 세우자고 한 하만의 아내"],["므무간","와스디를 폐하자고 왕에게 아뢴 사람"]],"h":"하만의 아내는 친구들과 함께 하만에게 나무를 세우라고 권했어요.","ex":"헤개는 궁녀를 주관했고, 하닥은 에스더와 모르드개 사이에서 말을 전했어요. 빅단과 데레스의 음모는 궁중 일기에 기록되었고, 세레스의 말대로 세운 나무에 하르보나의 말을 들은 왕이 하만을 달았어요."},{"type":"piece","ref":"에스더 3:1-2","q":"아하수에로 왕이 지위를 높여 모든 대신 위에 둔 아각 사람 하만의 아버지 이름은?","w":["함","므다","다"],"d":["하르","므두","다사","보나"],"h":"아들 하만의 이름과 첫소리가 비슷해요.","ex":"에스더 3장에서 왕은 아각 사람 함므다다의 아들 하만을 높였고, 신하들이 다 꿇어 절했지만 모르드개는 꿇지도 절하지도 않았어요."},{"ref":"아가 2:15","v":[["아가 2장에서 '우리를 위하여 잡으라'고 한, 포도원을 허는 짐승은?",["작은 여우","작은 노루","어린 사슴","멧돼지","메뚜기 떼","들쥐"]],["아가 2장에서 작은 여우를 잡으라고 한 까닭은 무엇에 꽃이 피었기 때문인가요?",["우리의 포도원","석류나무","무화과나무","들의 백합화","사과나무","동산의 향초"]]],"h":"본문은 이 짐승을 특별히 '작은' 것이라고 불러요.","ex":"아가 2장에서는 포도원을 허는 작은 여우를 잡으라고 하며, 그 까닭을 우리의 포도원에 꽃이 피었기 때문이라고 말해요."},{"type":"verse","l":["sng",8,6],"ref":"아가 8:6","q":"이 구절에서 사랑은 무엇 같이 강하다고 했나요?","a":["죽음","스올","불길","바위","사자","큰 물"],"ex":"아가 8장 6절은 사랑이 죽음 같이 강하다고 하고, 질투는 스올 같이 잔인하다고 말해요.","h":"질투를 비유한 말과 헷갈리지 않게 앞부분을 잘 읽어 보세요."},{"type":"piece","ref":"아가 8:11","q":"아가 8장에서 솔로몬이 포도원을 두고 지키는 자들에게 맡겼다는 곳은?","w":["바","알","하몬"],"d":["브올","하맛","헤스","갓"],"h":"지키는 자들이 그 열매로 말미암아 은 천을 바치게 했다는 곳이에요.","ex":"아가 8장 11절에서 솔로몬은 바알하몬에 있는 포도원을 지키는 자들에게 맡기고, 각기 은 천을 바치게 했어요."},{"ref":"예레미야애가 1:1","v":[["예레미야애가 1장 첫 절에서, 전에는 열국 중에 크던 성이 이제는 무엇 같이 되었다고 했나요?",["과부","고아","나그네","포로","광야","무너진 장막"]],["같은 절에서, 전에는 열방 중에 공주였던 성이 이제는 어떤 자가 되었다고 했나요?",["강제 노동을 하는 자","구걸하는 자","사로잡혀 간 자","길가에 버려진 자","품꾼의 종","떠돌아다니는 자"]]],"h":"애가는 '슬프다 이 성이여'라는 탄식으로 시작해요.","ex":"애가 1장 1절은 사람이 많던 성이 적막해져 과부 같이 되었고, 공주 같던 성이 강제 노동을 하는 자가 되었다고 슬퍼해요."},{"type":"verse","l":["lam",3,22],"ref":"예레미야애가 3:22-23","q":"이 구절에서 우리가 진멸되지 아니한 까닭으로 든 것은?","a":["여호와의 인자와 긍휼이 무궁하심","조상들의 의로움","성전에서 드린 제사","왕의 지혜로운 다스림","백성의 금식과 회개","선지자들의 간절한 기도"],"ex":"애가 3장 22~23절은 여호와의 인자와 긍휼이 무궁하여 우리가 진멸되지 않았고, 그것들이 아침마다 새롭다고 고백해요.","h":"바로 다음 절에서 '이것들이 아침마다 새롭다'고 이어져요."},{"ref":"예레미야애가 4:21-22","v":[["예레미야애가 4장에서 '우스 땅에 사는 딸'이라 부르며 잔이 네게도 이를 것이라고 한 나라는?",["에돔","모압","암몬","블레셋","두로","애굽"]],["예레미야애가 4장에서 딸 에돔이 사는 땅이라고 한 곳은?",["우스","세일","데만","보스라","길르앗","바산"]]],"h":"같은 장 마지막 절에서는 '딸 시온'과 나란히 이 딸이 다시 나와요.","ex":"애가 4장 21절은 우스 땅에 사는 딸 에돔에게 지금은 기뻐하지만 그 잔이 너에게도 이를 것이라고 말해요."},{"ref":"잠언 30:1","v":[["잠언 30장의 말씀을 전한 사람으로, 야게의 아들이라고 소개된 사람은?",["아굴","르무엘","이디엘","우갈","아삽","에단"]],["잠언 30장에서 아굴은 누구의 아들이라고 소개되나요?",["야게","이디엘","우갈","르무엘","아삽","헤만"]]],"h":"31장 첫머리에 나오는 르무엘 왕 바로 앞 장이에요.","ex":"잠언 30장은 야게의 아들 아굴의 잠언으로, 그가 이디엘과 우갈에게 이른 말이라고 소개돼요."},{"type":"multi","ref":"잠언 30:29-31","q":"잠언 30장에서 '잘 걸으며 위풍 있게 다니는 것'으로 꼽은 것을 모두 고르세요.","yes":["사자","사냥개","숫염소","당할 수 없는 왕"],"no":["독수리","말","곰","개미"],"h":"짐승 중에 가장 강해 어떤 짐승 앞에서도 물러가지 않는 것이 첫째예요.","ex":"잠언 30장 29~31절은 위풍 있게 다니는 것으로 사자, 사냥개, 숫염소, 당할 수 없는 왕을 꼽아요."},{"type":"match","ref":"잠언 30:18-19, 24-28","q":"잠언 30장에 나오는 것과 그 모습을 바르게 짝지으세요.","L":"잠언 30장의 것","R":"본문의 모습","pairs":[["개미","먹을 것을 여름에 준비함"],["사반","바위 사이에 집을 지음"],["메뚜기","임금 없이 떼를 지어 나아감"],["도마뱀","손에 잡힐 만해도 왕궁에 있음"],["독수리","공중에 날아다닌 자취"],["뱀","반석 위로 기어 다닌 자취"],["배","바다로 지나다닌 자취"]],"h":"작고도 지혜로운 것 넷과, 깨닫기 어려운 기이한 자취가 섞여 있어요.","ex":"개미, 사반, 메뚜기, 도마뱀은 땅에서 작고도 지혜로운 것이고, 독수리·뱀·배의 자취는 아굴이 기이하게 여긴 것이에요."},{"type":"order","ref":"잠언 31:13-28","q":"잠언 31장 현숙한 아내의 모습을 본문 순서대로 놓으세요.","seq":["양털과 삼을 구해 부지런히 일함","상인의 배처럼 먼 데서 양식을 가져옴","밤이 새기 전에 일어나 음식을 나눠 줌","밭을 살펴 사고 포도원을 일굼","솜뭉치를 들고 가락을 잡음","곤고한 자에게 손을 폄","베로 옷을 지어 팔고 띠를 상인에게 맡김","자식들은 감사하고 남편은 칭찬함"],"h":"재료를 구하는 일에서 시작해 가족의 칭찬으로 끝나요.","ex":"잠언 31장은 양털과 삼, 먼 데서 온 양식, 날이 새기 전의 음식, 밭과 포도원, 솜뭉치와 가락, 가난한 이웃 돌봄, 옷과 띠 판매, 가족의 칭찬 순으로 이어져요."},{"ref":"전도서 4:12","v":[["전도서 4장에서 쉽게 끊어지지 아니한다고 한 것은?",["세 겹 줄","두 겹 줄","은 줄","일곱 겹 줄","홍색 줄","쇠사슬"]],["전도서 4장에서, 한 사람이면 패하겠지만 몇 사람이면 맞설 수 있다고 했나요?",["두 사람","세 사람","네 사람","다섯 사람","일곱 사람","열 사람"]]],"h":"넘어지면 동무가 붙들어 일으켜 준다는 말씀 바로 뒤에 나와요.","ex":"전도서 4장 12절은 한 사람이면 패하지만 두 사람이면 맞설 수 있고, 세 겹 줄은 쉽게 끊어지지 않는다고 말해요."},{"type":"verse","l":["ecc",12,1],"ref":"전도서 12:1","q":"이 구절에서 무엇이 이르기 전에 창조주를 기억하라고 했나요?","a":["곤고한 날","심판의 날","마지막 날","환난의 날","어두운 밤","늙은 날"],"ex":"전도서 12장 1절은 곤고한 날이 이르고 낙이 없다고 할 해들이 가깝기 전에, 청년의 때에 창조주를 기억하라고 해요.","h":"'나는 아무 낙이 없다'고 할 해들과 나란히 나와요."},{"type":"multi","ref":"전도서 12:6","q":"전도서 12장 6절에서 그렇게 되기 전에 기억하라며 든 모습을 모두 고르세요.","yes":["은 줄이 풀림","금 그릇이 깨짐","항아리가 샘 곁에서 깨짐","바퀴가 우물 위에서 깨짐"],"no":["등불이 꺼짐","지팡이가 부러짐","돌기둥이 무너짐"],"h":"샘과 우물이 나오는 모습이 두 가지예요.","ex":"전도서 12장 6절은 은 줄이 풀리고, 금 그릇이 깨지고, 항아리가 샘 곁에서, 바퀴가 우물 위에서 깨지기 전에 기억하라고 해요."},{"ref":"레위기 16:8, 10","v":[["속죄일에 두 염소를 두고 제비를 뽑을 때, 한 제비는 여호와를 위하고 다른 한 제비는 누구를 위한 것이었나요?",["아사셀","아론","엘르아살","제사장들","레위인","온 회중"]],["아사셀을 위하여 제비 뽑은 염소는 산 채로 어디로 보냈나요?",["광야","요단 강","지성소","진영 안 회막","바다","성문 앞 골짜기"]]],"h":"레위기 16장, 일곱째 달 십일에 지키는 규례예요.","ex":"레위기 16장에서 두 염소 중 여호와를 위해 뽑힌 염소는 속죄제로 드리고, 아사셀을 위해 뽑힌 염소는 산 채로 광야로 보냈어요."},{"type":"multi","ref":"레위기 2:1, 11, 13-14","q":"레위기 2장에서 소제물로 쓰거나 소제물에 더하라고 한 것을 모두 고르세요.","yes":["고운 가루","기름","유향","소금","볶아 찧은 첫 이삭"],"no":["누룩","꿀","포도주"],"h":"넣지 말라고 분명히 금한 것이 두 가지 있어요.","ex":"소제는 고운 가루에 기름을 붓고 유향을 놓으며 모든 소제물에 소금을 쳤어요. 첫 이삭은 볶아 찧어 드렸고, 누룩과 꿀은 화제로 드리지 못하게 했어요."},{"type":"match","ref":"레위기 10:1-6; 24:11","q":"레위기에 나오는 사람과 그 설명을 바르게 짝지으세요.","L":"사람","R":"레위기의 설명","pairs":[["나답과 아비후","명령하지 않은 다른 불로 분향함"],["미사엘과 엘사반","형제들의 시체를 진영 밖으로 메어 냄"],["웃시엘","아론의 삼촌"],["엘르아살과 이다말","머리를 풀거나 옷을 찢지 말라는 말을 들음"],["슬로밋","단 지파 디브리의 딸"]],"h":"레위기 10장에는 아론의 아들들과 사촌들이 함께 나와요.","ex":"나답과 아비후가 다른 불로 분향하다 죽자 웃시엘의 아들 미사엘과 엘사반이 시체를 메어 냈고, 엘르아살과 이다말은 슬퍼하는 표를 내지 말라는 말을 들었어요. 슬로밋은 24장에 나오는 디브리의 딸이에요."},{"type":"match","ref":"예레미야 13:1-5; 19:1, 10; 24:1-2; 27:2; 32:9, 14; 35:5-6","q":"예레미야서에 나오는 물건과 그에 얽힌 일을 바르게 짝지으세요.","L":"물건","R":"본문에서 있었던 일","pairs":[["베 띠","유브라데 물가 바위 틈에 감춤"],["토기장이의 옹기","함께 간 사람들 앞에서 깨뜨림"],["줄과 멍에","목에 걺"],["무화과 두 광주리","하나는 극히 좋고 하나는 극히 나쁨"],["아나돗의 밭","은 십칠 세겔에 삼"],["밭을 산 증서","토기에 담아 둠"],["레갑 사람들 앞의 포도주","마시지 않겠다고 함"]],"h":"베 띠는 여러 날 뒤에 썩어서 쓸 수 없게 되었어요.","ex":"예레미야는 베 띠를 바위 틈에 감추고, 옹기를 깨뜨리고, 줄과 멍에를 목에 걸었어요. 성전 앞 무화과 두 광주리를 보았고, 아나돗 밭을 은 십칠 세겔에 사서 증서를 토기에 담게 했으며, 레갑 사람들은 권한 포도주를 마시지 않았어요."},{"type":"order","ref":"예레미야 36:4-28","q":"예레미야 36장 두루마리 사건을 본문 순서대로 놓으세요.","seq":["예레미야가 불러 주고 바룩이 기록함","바룩이 금식일에 성전 그마랴의 방에서 낭독함","미가야가 듣고 고관들에게 알림","고관들이 바룩에게 예레미야와 함께 숨으라고 함","여후디가 왕 앞에서 두루마리를 읽음","왕이 두루마리를 칼로 베어 화로 불에 던짐","다른 두루마리에 말씀을 다시 기록함"],"h":"아홉째 달 겨울 궁전에서 왕 앞에 불 피운 화로가 있었어요.","ex":"바룩이 기록해 성전에서 읽자 미가야가 고관들에게 알렸고, 고관들은 숨으라고 했어요. 여후디가 왕 앞에서 읽자 왕이 두루마리를 베어 태웠고, 다시 다른 두루마리에 기록했어요."},{"type":"multi","ref":"에스겔 1:1, 10","q":"에스겔이 그발 강 가에서 본 네 생물의 얼굴을 모두 고르세요.","yes":["사람의 얼굴","사자의 얼굴","소의 얼굴","독수리의 얼굴"],"no":["양의 얼굴","말의 얼굴","곰의 얼굴","표범의 얼굴"],"h":"왼쪽 얼굴은 밭을 가는 짐승이에요.","ex":"네 생물은 앞은 사람, 오른쪽은 사자, 왼쪽은 소, 뒤는 독수리의 얼굴이었어요."},{"type":"order","ref":"에스겔 37:7-10","q":"에스겔이 마른 뼈들에게 대언했을 때 일어난 일을 본문 순서대로 놓으세요.","seq":["소리가 나며 뼈들이 서로 연결됨","뼈에 힘줄이 생김","살이 오름","그 위에 가죽이 덮임","생기가 그들에게 들어감","일어나 서니 극히 큰 군대가 됨"],"h":"몸이 다 갖춰졌는데도 처음에는 그 속에 생기가 없었어요.","ex":"뼈들이 연결되고 힘줄과 살과 가죽이 생겼지만 생기는 없었는데, 생기를 향해 대언하자 생기가 들어가 살아나 큰 군대가 되었어요."},{"type":"match","ref":"에스겔 4:5-6, 10-11; 5:2","q":"하나님이 에스겔에게 명하신 일과 그 숫자를 바르게 짝지으세요.","L":"명하신 일","R":"숫자","pairs":[["왼쪽으로 누워 있을 날수","삼백구십 일"],["오른쪽으로 누워 있을 날수","사십 일"],["하루에 달아서 먹을 음식물","이십 세겔"],["때를 따라 마실 물","육분의 일 힌"],["성읍 안에서 불사를 터럭","삼분의 일"]],"h":"오른쪽으로 누운 날은 하루가 일 년이라고 하셨어요.","ex":"에스겔은 왼쪽으로 삼백구십 일, 오른쪽으로 사십 일을 눕고, 음식은 하루 이십 세겔, 물은 육분의 일 힌씩 먹고 마셨어요. 깎은 터럭은 삼분의 일씩 나눠 불사르고, 칼로 치고, 바람에 흩었어요."},{"type":"piece","ref":"에스겔 48:35","q":"에스겔서 마지막 절에서, 사방의 합계가 만 팔천 척인 성읍에 '그 날 후로' 붙여질 이름은?","w":["여호","와","삼마"],"d":["이레","닛시","샬롬","사마"],"h":"하나님의 이름으로 시작하는 이름이에요.","ex":"에스겔 48장은 이스라엘 지파들의 이름을 딴 열두 문을 말한 뒤, 그 성읍의 이름을 여호와삼마라 하리라는 말씀으로 끝나요."},{"type":"piece","ref":"에스겔 47:8-10","q":"성전 문지방 밑에서 흘러나온 강물로 바닷물이 되살아나 어부들이 그물 치는 곳이 될 것이라 했어요. 엔게디에서부터 어디까지라고 했나요?","w":["에네","글라","임"],"d":["엔게","디","에글","라엘"],"h":"'에'로 시작하는 다섯 글자 지명이에요.","ex":"에스겔 47장에서 성전에서 나온 물은 발목, 무릎, 허리를 지나 헤엄칠 만한 강이 되었고, 엔게디에서부터 에네글라임까지 그물 치는 곳이 될 것이라 했어요."},{"type":"multi","ref":"요엘 1:4","q":"요엘 1장 4절에서 땅의 소산을 차례로 먹어 치운 곤충을 모두 고르세요.","yes":["팥중이","메뚜기","느치","황충"],"no":["하루살이","파리","개미","벌"],"h":"모두 같은 무리의 곤충으로, 하나가 남긴 것을 다른 것이 먹었어요.","ex":"팥중이가 남긴 것을 메뚜기가, 메뚜기가 남긴 것을 느치가, 느치가 남긴 것을 황충이 먹었어요."},{"ref":"요엘 2:13","h":"겉모양이 아니라 속을 보시는 하나님이세요.","ex":"요엘은 옷을 찢지 말고 마음을 찢고 여호와께로 돌아오라고 했어요. 하나님은 은혜로우시며 노하기를 더디하시는 분이라고 했어요.","v":[["요엘이 하나님께 돌아오라고 하며 '찢으라'고 한 것은?",["마음","옷","휘장","굵은 베","장막","두루마리"]],["요엘 2:13에서 '찢지 말라'고 한 것은?",["옷","마음","휘장","장막","두루마리","그물"]]]},{"type":"piece","ref":"요엘 3:2, 12","q":"요엘 3장에서 하나님이 만국을 모아 데리고 내려가 그들을 심문하시고, 거기 앉아 사면의 민족들을 심판하시겠다고 한 골짜기는?","w":["여호","사밧","골짜기"],"a":"여호사밧 골짜기","d":["사반","여로","심판의","기드론"],"h":"만국이 모여 심판받는 곳으로, 3장에 두 번 나와요.","ex":"하나님은 만국을 여호사밧 골짜기로 모아 내 백성 이스라엘을 위해 그들을 심문하시겠다고 하셨어요."},{"ref":"아모스 7:10-13","h":"그는 벧엘을 '왕의 성소'라고 부르며 거기서 예언하지 말라고 했어요.","ex":"벧엘의 제사장 아마샤는 아모스가 왕을 모반한다고 여로보암 왕에게 고발하고, 다시는 벧엘에서 예언하지 말라고 했어요.","v":[["아모스를 이스라엘 왕 여로보암에게 고발한 벧엘의 제사장은?",["아마샤","아사랴","아히멜렉","힐기야","엘리아십","바스훌"]],["벧엘의 제사장이 여로보암 왕에게 '왕을 모반한다'고 고발한 선지자는?",["아모스","호세아","요나","엘리사","미가야","이사야"]]]},{"type":"order","ref":"아모스 7:1, 4, 7; 8:1; 9:1","q":"아모스가 본 것을 본문 순서대로 놓으세요.","seq":["풀이 다시 움돋을 때 지으신 메뚜기","큰 바다를 삼킨 불","다림줄을 잡고 담 곁에 서신 주","여름 과일 한 광주리","제단 곁에 서신 주"],"h":"7장에 세 가지, 8장과 9장에 하나씩 나와요.","ex":"아모스는 메뚜기, 불, 다림줄을 차례로 보고, 이어서 여름 과일 한 광주리와 제단 곁에 서신 주를 보았어요."},{"type":"match","ref":"아모스 1:3-2:4","q":"아모스가 '서너 가지 죄'를 말한 나라와 그 죄를 바르게 짝지으세요.","L":"나라","R":"죄","pairs":[["다메섹","철 타작기로 타작하듯 길르앗을 압박함"],["가사","사로잡은 자를 모두 끌어 에돔에 넘김"],["두로","형제의 계약을 기억하지 아니함"],["에돔","칼로 그의 형제를 쫓아감"],["모압","에돔 왕의 뼈를 불살라 재를 만듦"],["유다","여호와의 율법을 멸시함"]],"h":"에돔은 오히려 피해를 입은 쪽으로도 나와요.","ex":"다메섹은 길르앗을 압박했고, 가사는 사로잡은 자를 에돔에 넘겼고, 두로는 형제의 계약을 잊었고, 에돔은 칼로 형제를 쫓았고, 모압은 에돔 왕의 뼈를 불살랐고, 유다는 율법을 멸시했어요."},{"ref":"오바댜 1:1, 3, 10","h":"형제 야곱에게 포학을 행한 나라예요.","ex":"오바댜의 묵시는 주 여호와께서 에돔에 대해 하신 말씀으로, 바위 틈 높은 곳에 살며 교만했던 에돔을 끌어내리시겠다고 했어요.","v":[["오바댜의 묵시에서 주 여호와께서 말씀하신 대상 나라는?",["에돔","모압","암몬","블레셋","앗수르","바벨론"]],["오바댜서에서 '바위 틈에 거주하며' 높은 곳에 산다고 하며 마음의 교만을 책망받은 나라는?",["에돔","두로","시돈","모압","애굽","갈대아"]]]},{"ref":"오바댜 1:21","h":"미가 4:2에서 율법이 이곳에서부터 나온다고 했어요.","ex":"오바댜서는 구원 받은 자들이 시온 산에 올라와서 에서의 산을 심판하고 나라가 여호와께 속하리라는 말씀으로 끝나요.","v":[["오바댜서 마지막 절에서 구원 받은 자들이 올라와 에서의 산을 심판한다고 한 곳은?",["시온 산","갈멜 산","시내 산","감람 산","그리심 산","호렙 산"]],["오바댜서 마지막 절에서 시온 산에 올라온 구원 받은 자들이 심판할 곳은?",["에서의 산","바산의 산","에발 산","길보아 산","모리아 산","사마리아 산"]]]},{"type":"multi","ref":"오바댜 1:12-14","q":"오바댜서에서 에돔이 형제 유다의 환난 날에 하지 말았어야 할 일로 꼽힌 것을 모두 고르세요.","yes":["재앙의 날에 방관함","유다 자손이 패망하는 날에 기뻐함","고난의 날에 입을 크게 벌림","환난 날에 그 성문에 들어감","환난 날에 그 재물에 손을 댐","네거리에 서서 도망하는 자를 막음","남은 자를 원수에게 넘김"],"no":["성전 기구를 바벨론으로 가져감","포로를 애굽에 팔아넘김","성벽에 불을 놓음","제단에 이방 신의 제물을 드림"],"h":"에돔은 형제가 당하는 고난을 구경하고 이용했어요.","ex":"오바댜는 에돔이 유다의 환난 날에 방관하고, 기뻐하고, 입을 벌리고, 성문에 들어가 재물에 손대고, 도망하는 자를 막아 원수에게 넘긴 일을 책망했어요."},{"type":"order","ref":"요나 1:3-17; 3:4; 4:6-8","q":"요나서의 일을 본문 순서대로 놓으세요.","seq":["욥바로 내려가 배삯을 주고 배에 오름","배 밑층에 내려가 깊이 잠듦","제비가 요나에게 뽑힘","요나를 바다에 던지자 바다가 그침","밤낮 삼 일을 물고기 뱃속에 있음","니느웨에서 하루 동안 다니며 외침","박넝쿨이 요나를 가려 줌","벌레가 박넝쿨을 갉아먹음","뜨거운 동풍이 붊"],"h":"박넝쿨이 시든 다음 날, 해가 뜰 때 일어난 일이 마지막이에요.","ex":"요나는 배에 올라 잠들었다가 제비에 뽑혀 바다에 던져졌고, 물고기 뱃속에서 삼 일을 지낸 뒤 니느웨에서 외쳤어요. 그 뒤 박넝쿨, 벌레, 뜨거운 동풍이 차례로 예비되었어요."},{"type":"verse","l":["mic",4,3],"ref":"미가 4:3","q":"이 구절에서 무리가 창을 쳐서 만든다고 한 것은?","a":["낫","보습","쟁기","호미","멍에","도끼"],"ex":"무리가 칼을 쳐서 보습을, 창을 쳐서 낫을 만들고 다시는 전쟁을 연습하지 않는다고 했어요. 요엘 3:10에는 반대로 보습을 쳐서 칼을, 낫을 쳐서 창을 만들라는 말씀이 있어요.","h":"칼로 만드는 것과 창으로 만드는 것이 따로 나와요."},{"ref":"미가 6:8","h":"6~7절의 번제물이나 숫양보다 하나님이 더 원하시는 삶이에요.","ex":"여호와께서 구하시는 것은 정의를 행하며 인자를 사랑하며 겸손하게 하나님과 함께 행하는 것이라고 했어요.","v":[["미가 6:8에서 여호와께서 구하신다고 한 것 가운데 '사랑하며'와 짝지어진 것은?",["인자","긍휼","화평","진리","성결","지혜"]],["미가 6:8에서 여호와께서 구하시는 세 가지는 '인자를 사랑함', '겸손하게 하나님과 함께 행함', 그리고 무엇인가요?",["정의를 행함","번제를 드림","금식을 선포함","안식일을 지킴","율법을 읽음","십일조를 드림"]]]},{"ref":"미가 7:19","h":"사람이 닿을 수 없을 만큼 깊은 곳이에요.","ex":"미가는 하나님이 우리를 다시 불쌍히 여기셔서 죄악을 발로 밟으시고 우리의 모든 죄를 깊은 바다에 던지시리라고 고백했어요.","v":[["미가서 끝부분에서 하나님이 우리의 모든 죄를 던지신다고 한 곳은?",["깊은 바다","먼 광야","깊은 구덩이","땅 끝","요단 강","불 못"]],["미가 7:19에서 '깊은 바다에 던지시리이다'라고 한 대상은?",["우리의 모든 죄","우리의 원수들","이방의 우상들","앗수르의 병거","열방의 칼","거짓 선지자들"]]]},{"ref":"나훔 1:1; 3:7","h":"요나가 사십 일이 지나면 무너진다고 외쳤던 그 성읍이에요.","ex":"나훔서는 니느웨에 대한 경고로 시작하고, 3장에서는 니느웨가 황폐하였다고 말해요.","v":[["엘고스 사람 나훔이 받은 경고의 대상 성읍은?",["니느웨","바벨론","다메섹","두로","사마리아","가사"]],["나훔 3:7에서 보는 자들이 도망하며 '황폐하였도다'라고 말한 성읍은?",["니느웨","예루살렘","바벨론","소돔","여리고","에돔"]]]},{"type":"verse","l":["nam",1,15],"ref":"나훔 1:15","q":"이 구절에서 산 위에 있다고 한 것은?","a":["아름다운 소식을 알리는 자의 발","여호와의 전","파수꾼의 나팔","시온의 깃발","다윗의 장막","제사장의 등불"],"ex":"아름다운 소식을 알리고 화평을 전하는 자의 발이 산 위에 있다고 하며, 유다에게 절기를 지키고 서원을 갚으라고 했어요.","h":"화평을 전하는 사람에 대한 말씀이에요."},{"type":"match","ref":"에스겔 1:3; 요엘 1:1; 아모스 1:1; 요나 1:1; 미가 1:1; 나훔 1:1","q":"선지자와 그 책 첫머리에 나오는 소개를 바르게 짝지으세요.","L":"선지자","R":"첫머리의 소개","pairs":[["에스겔","부시의 아들 제사장"],["요엘","브두엘의 아들"],["요나","아밋대의 아들"],["아모스","드고아 목자"],["미가","모레셋 사람"],["나훔","엘고스 사람"]],"h":"아버지 이름으로 소개된 선지자는 세 명이에요.","ex":"에스겔은 부시의 아들 제사장, 요엘은 브두엘의 아들, 요나는 아밋대의 아들로 소개되고, 아모스는 드고아 목자, 미가는 모레셋 사람, 나훔은 엘고스 사람이에요."},{"ref":"하박국 2:1-2","h":"성을 지키는 사람이 망을 보며 서 있는 곳을 떠올려 보세요.","ex":"하박국은 파수하는 곳, 곧 성루에 서서 응답을 기다렸고, 여호와께서는 묵시를 판에 명백히 새겨 달려가면서도 읽을 수 있게 하라고 하셨어요.","v":[["하박국이 여호와께서 무엇이라 말씀하실지 기다리며 서겠다고 한 곳은?",["파수하는 곳","성전 뜰","성문 앞","산꼭대기","그발 강가","장막 문"]],["여호와께서 하박국에게 묵시를 기록하여 명백히 새기라고 하신 곳은?",["판","두루마리","문설주","성벽","돌 제단","가죽 띠"]]]},{"type":"multi","ref":"하박국 3:17-18","q":"하박국 3:17에서 '~할지라도' 하며 꼽은 일을 모두 고르세요.","yes":["무화과나무가 무성하지 못함","포도나무에 열매가 없음","감람나무에 소출이 없음","밭에 먹을 것이 없음","우리에 양이 없음","외양간에 소가 없음"],"no":["석류나무에 꽃이 없음","우물에 물이 없음","곳간에 곡식이 없음","들에 나귀가 없음"],"h":"나무 세 가지와 밭, 그리고 짐승 두 가지가 나와요.","ex":"하박국은 무화과나무, 포도나무, 감람나무, 밭, 양, 소가 다 없을지라도 여호와로 말미암아 즐거워하겠다고 고백했어요."},{"type":"piece","ref":"하박국 3:1, 19","q":"하박국 3장의 기도는 첫머리에서 무엇에 맞춘 기도라고 소개되나요?","w":["시기","오","놋"],"d":["오놀","식가","니놋","기온"],"h":"이 장 맨 끝에는 '내 수금에 맞춘 것'이라는 말이 나와요.","ex":"하박국 3장은 '시기오놋에 맞춘' 선지자 하박국의 기도로 시작하고, 지휘하는 사람을 위해 수금에 맞춘 노래라는 말로 끝나요."},{"type":"verse","l":["zep",3,17],"ref":"스바냐 3:17","q":"이 구절에서 하나님이 너를 어떻게 사랑하신다고 했나요?","a":["잠잠히","영원히","한결같이","끝까지","변함없이","뜨겁게"],"h":"하나님이 기쁨을 이기지 못하시고 즐거이 부르신다는 말과 함께 나와요.","ex":"스바냐 3:17에서 구원을 베푸실 전능자 하나님은 너를 잠잠히 사랑하시며 너로 말미암아 기뻐하신다고 했어요."},{"type":"order","ref":"스바냐 1:1","q":"스바냐 1:1에 나오는 스바냐의 족보를 윗대부터 차례로 놓으세요.","seq":["히스기야","아마랴","그다랴","구시","스바냐"],"h":"스바냐는 맨 윗대 인물의 현손이에요.","ex":"스바냐는 히스기야의 현손, 아마랴의 증손, 그다랴의 손자, 구시의 아들이에요."},{"type":"multi","ref":"스바냐 2:4-13","q":"스바냐 2장에서 심판이 선포된 곳이나 백성을 모두 고르세요.","yes":["가사","아스글론","아스돗","에그론","모압","암몬 자손","구스 사람","니느웨"],"no":["두로","에돔","다메섹","바벨론","애굽","시돈"],"h":"블레셋의 성읍들로 시작해 북쪽 앗수르까지 이어져요.","ex":"스바냐 2장은 가사·아스글론·아스돗·에그론, 모압과 암몬 자손, 구스 사람, 앗수르와 니느웨에 대한 심판을 말해요."},{"type":"match","ref":"학개 1:1, 14-15; 2:1, 9, 20-23; 스가랴 1:1, 7-8","q":"다리오 왕 제이년에 있었던 일과 그 날짜를 바르게 짝지으세요.","L":"일","R":"날짜","pairs":[["학개에게 처음 임한 말씀","여섯째 달 초하루"],["백성이 성전 공사를 함","여섯째 달 이십사일"],["나중 영광이 이전 영광보다 크리라","일곱째 달 이십일일"],["스룹바벨을 인장으로 삼으리라","아홉째 달 이십사일"],["스가랴에게 처음 임한 말씀","여덟째 달"],["화석류나무 사이의 사람 환상","열한째 달 이십사일"]],"h":"학개의 첫 말씀이 있고 스물나흘 뒤에 공사가 시작됐어요.","ex":"학개의 첫 말씀은 여섯째 달 초하루, 공사는 같은 달 이십사일, 나중 영광의 말씀은 일곱째 달 이십일일, 인장 말씀은 아홉째 달 이십사일이었고, 스가랴는 여덟째 달에 처음 말씀을 받고 열한째 달 이십사일에 환상을 보았어요."},{"ref":"학개 1:4-6","h":"'너희는 너희의 행위를 살필지니라'는 말씀과 함께 나와요.","ex":"여호와의 성전은 황폐한데 백성은 판벽한 집에 살았고, 삯을 받아도 구멍 뚫어진 전대에 넣는 것처럼 남는 것이 없었어요.","v":[["학개 1장에서 여호와의 성전이 황폐한데 백성이 살고 있던 집은?",["판벽한 집","백향목 집","상아 궁","돌로 지은 집","초막","여름 별궁"]],["학개 1장에서 삯을 받는 자가 그 삯을 넣는 곳으로 비유된 것은?",["구멍 뚫어진 전대","찢어진 자루","깨진 항아리","터진 가죽 부대","새는 웅덩이","낡은 궤짝"]]]},{"type":"multi","ref":"학개 1:11","q":"학개 1장에서 여호와께서 한재를 불러 임하게 하셨다고 한 대상을 모두 고르세요.","yes":["산","곡물","새 포도주","기름","사람","가축"],"no":["바다","강과 시내","하늘의 새","성벽"],"h":"땅에서 나는 것, 사람과 짐승, 손으로 수고하는 일까지 나와요.","ex":"학개 1:11에는 땅과 산, 곡물과 새 포도주와 기름, 땅의 소산, 사람과 가축, 손으로 수고하는 모든 일에 한재가 임했다고 나와요."},{"type":"piece","ref":"학개 1:1; 스가랴 6:11","q":"학개서에서 대제사장 여호수아는 누구의 아들로 소개되나요?","w":["여호","사","닥"],"d":["요사","여호야","스알","디엘"],"h":"스가랴 6장에서 여호수아의 머리에 면류관을 씌우는 장면에도 같은 이름이 나와요.","ex":"학개 1:1에서 여호수아는 여호사닥의 아들 대제사장으로 불리고, 스가랴 6:11에서도 같은 이름으로 나와요."},{"type":"order","ref":"스가랴 1:8-6:8","q":"스가랴가 본 환상을 본문 순서대로 놓으세요.","seq":["화석류나무 사이의 사람","네 뿔","측량줄을 잡은 사람","대제사장 여호수아","순금 등잔대","날아가는 두루마리","에바 속의 여인","네 병거"],"h":"말 탄 사람으로 시작해 병거로 끝나요.","ex":"화석류나무 사이의 사람, 네 뿔과 대장장이, 측량줄, 대제사장 여호수아, 순금 등잔대, 날아가는 두루마리, 에바 속의 여인, 네 병거 순이에요."},{"type":"match","ref":"스가랴 1:18-21; 2:1-2; 4:2-3; 5:1-2, 6-11; 6:1","q":"스가랴가 본 환상과 그 환상에 함께 나오는 것을 바르게 짝지으세요.","L":"환상","R":"함께 나오는 것","pairs":[["네 뿔","대장장이 넷"],["측량줄을 잡은 사람","예루살렘의 너비와 길이"],["순금 등잔대","두 감람나무"],["날아가는 두루마리","길이 이십 규빗"],["에바 속의 여인","시날 땅"],["네 병거","구리 산"]],"h":"에바는 학의 날개 같은 날개를 가진 두 여인이 들고 갔어요.","ex":"네 뿔 뒤에 대장장이 넷이 나오고, 측량줄은 예루살렘을 재려는 것이며, 등잔대 곁에는 두 감람나무가 있었어요. 두루마리는 길이 이십 규빗, 에바는 시날 땅으로 옮겨졌고, 네 병거는 구리 산 사이에서 나왔어요."},{"ref":"스가랴 3:1-5","h":"하나님은 여호수아를 '불에서 꺼낸 그슬린 나무'라고 부르셨어요.","ex":"스가랴 3장에서 사탄이 대제사장 여호수아를 대적하려고 그 오른쪽에 섰고, 하나님은 더러운 옷을 벗기고 머리에 정결한 관을 씌우게 하셨어요.","v":[["스가랴 3장에서 대제사장 여호수아를 대적하려고 그의 오른쪽에 선 자는?",["사탄","산발랏","도비야","게셈","거짓 선지자","갈대아 사람"]],["스가랴 3장에서 더러운 옷을 벗은 여호수아의 머리에 씌운 것은?",["정결한 관","가시관","흰 두건","꽃 관","놋 투구","청색 끈"]]]},{"type":"verse","l":["zec",4,6],"ref":"스가랴 4:6","q":"이 구절에서 스룹바벨에게 주신 말씀에 따르면 일은 무엇으로 된다고 했나요?","a":["오직 나의 영으로","오직 나의 손으로","오직 나의 말씀으로","오직 나의 이름으로","오직 너희의 믿음으로","오직 나의 능력으로"],"h":"힘으로도, 능력으로도 아니라고 먼저 말씀하세요.","ex":"스가랴 4:6에서 여호와께서는 스룹바벨에게 힘이나 능력이 아니라 오직 나의 영으로 된다고 하셨어요."},{"ref":"스가랴 11:7, 12-13","h":"이 장에서 목자는 '은총'과 '연합'이라는 두 막대기를 가졌어요.","ex":"그들은 목자의 삯으로 은 삼십 개를 달아 주었고, 여호와께서 그것을 토기장이에게 던지라 하셔서 여호와의 전에서 토기장이에게 던졌어요.","v":[["스가랴 11장에서 그들이 목자의 삯으로 달아 준 것은?",["은 삼십 개","은 이십 개","은 오십 개","금 삼십 개","은 사십 개","은 삼백 개"]],["스가랴 11장에서 여호와께서 그 삯을 누구에게 던지라고 하셨나요?",["토기장이","대장장이","제사장","은장색","문지기","목수"]]]},{"type":"piece","ref":"스가랴 12:11","q":"스가랴 12장에서 그 날 예루살렘에 있을 큰 애통을 어느 곳에 있던 애통과 같다고 했나요?","w":["하다","드","림몬"],"d":["하닷","림모","에셀","므깃"],"h":"므깃도 골짜기에 있는 곳이에요.","ex":"스가랴 12:11은 그 날 예루살렘의 큰 애통이 므깃도 골짜기 하다드림몬에 있던 애통과 같을 것이라고 해요."},{"type":"match","ref":"말라기 1:2, 6-7; 2:17; 3:8, 13-14","q":"말라기에서 백성이 되물은 말과 하나님의 대답을 바르게 짝지으세요.","L":"백성의 되물음","R":"하나님의 대답","pairs":[["어떻게 우리를 사랑하셨나이까","야곱은 사랑하고 에서는 미워함"],["어떻게 주의 이름을 멸시하였나이까","더러운 떡을 제단에 드림"],["어떻게 여호와를 괴롭혀 드렸나이까","정의의 하나님이 어디 계시냐 함"],["어떻게 주의 것을 도둑질하였나이까","십일조와 봉헌물"],["무슨 말로 주를 대적하였나이까","하나님을 섬기는 것이 헛되다 함"]],"h":"말라기는 '너희가 이르기를 ~하는도다'처럼 백성의 말을 되짚으며 대답해요.","ex":"사랑에는 야곱과 에서, 멸시에는 더러운 떡, 괴롭힘에는 '정의의 하나님이 어디 계시냐'는 말, 도둑질에는 십일조와 봉헌물, 대적에는 섬김이 헛되다는 말이 대답으로 나와요."},{"ref":"말라기 3:2-3","h":"금을 깨끗하게 하는 사람과 옷을 희게 하는 사람을 떠올려 보세요.","ex":"말라기 3장에서 임하실 주는 금을 연단하는 자의 불과 표백하는 자의 잿물 같다고 했어요.","v":[["말라기 3장에서 임하실 주를 금을 연단하는 자의 무엇과 같다고 했나요?",["불","망치","도가니","저울","풀무","집게"]],["말라기 3장에서 임하실 주를 표백하는 자의 무엇과 같다고 했나요?",["잿물","방망이","햇볕","소금","기름","빨랫돌"]]]},{"ref":"말라기 4:1-2","h":"교만한 자에게는 용광로 불 같은 날이지만, 경외하는 자에게는 치료하는 광선이 비춰요.","ex":"말라기 4장에서 여호와의 이름을 경외하는 자에게는 공의로운 해가 떠올라 치료하는 광선을 비추고, 그들은 외양간에서 나온 송아지 같이 뛸 거라고 했어요.","v":[["말라기 4장에서 여호와의 이름을 경외하는 자에게 떠오른다고 한 것은?",["공의로운 해","새벽 별","밝은 달","큰 빛","영광의 구름","불기둥"]],["말라기 4장에서 여호와를 경외하는 자들이 무엇 같이 뛰리라고 했나요?",["외양간에서 나온 송아지","들의 사슴","광야의 노루","우리에서 나온 어린 양","산의 염소","독수리 새끼"]]]}];
const NT5=[{"ref":"골로새서 3:12-14","h":"긍휼, 자비, 겸손, 온유, 오래 참음을 옷 입으라고 한 뒤에 나와요.","ex":"골로새서 3장은 여러 덕을 옷 입으라고 한 뒤, 그 모든 것 위에 사랑을 더하라고 하며 사랑을 온전하게 매는 띠라고 했어요.","v":[["골로새서 3장에서 '이 모든 것 위에' 더하라고 한 것은?",["사랑","믿음","소망","지혜","인내","겸손"]],["골로새서 3장에서 사랑을 무엇이라고 불렀나요?",["온전하게 매는 띠","영혼의 닻","생명의 면류관","의의 호심경","믿음의 방패","진리의 기둥"]]]},{"type":"multi","ref":"골로새서 3:5, 8, 12","q":"골로새서 3장에서 '옷 입으라'고 한 것을 모두 고르세요.","yes":["긍휼","자비","겸손","온유","오래 참음"],"no":["분함","노여움","악의","탐심","비방"],"h":"벗어 버리라고 한 것과 옷 입으라고 한 것이 섞여 있어요.","ex":"골로새서 3장은 분함, 노여움, 악의, 비방 같은 것을 벗어 버리고, 긍휼, 자비, 겸손, 온유, 오래 참음을 옷 입으라고 했어요. 탐심은 땅에 있는 지체로 죽이라고 한 것이에요."},{"type":"match","ref":"골로새서 4:7-17","q":"골로새서 4장에 나오는 사람과 바울이 그를 소개한 말을 바르게 짝지으세요.","L":"사람","R":"소개한 말","pairs":[["두기고","바울의 사정을 다 알려 줄 신실한 일꾼"],["오네시모","두기고와 함께 보내는 신실한 형제"],["마가","바나바의 생질"],["유스도","'유스도라 하는 예수'로 불림"],["에바브라","항상 골로새 교인을 위해 애써 기도함"],["누가","사랑을 받는 의사"],["눔바","그 여자의 집에 교회가 있음"],["아킵보","주 안에서 받은 직분을 삼가 이루라는 말을 들음"]],"h":"의사로 소개된 사람은 데마와 나란히 이름이 나와요.","ex":"두기고는 신실한 일꾼, 오네시모는 함께 보내는 형제, 마가는 바나바의 생질, 에바브라는 늘 애써 기도하는 사람, 누가는 사랑받는 의사예요. 눔바의 집에는 교회가 있었고, 아킵보에게는 직분을 이루라고 전하게 했어요."},{"type":"verse","l":["col",4,16],"ref":"골로새서 4:16","q":"이 구절에서 바울이 이 편지를 읽은 뒤 그곳 교회에서도 읽게 하라고 한 곳은?","a":["라오디게아인의 교회","히에라볼리 교회","에베소 교회","빌립보 교회","데살로니가 교회","고린도 교회"],"h":"그곳에서 오는 편지도 골로새 교인들이 읽으라고 했어요.","ex":"바울은 이 편지를 골로새에서 읽은 뒤 라오디게아인의 교회에서도 읽게 하고, 라오디게아로부터 오는 편지도 읽으라고 했어요."},{"type":"piece","ref":"골로새서 4:10","q":"골로새서 4장에서 바울이 '나와 함께 갇힌' 사람이라고 소개하며 문안을 전한 사람은?","w":["아리","스다","고"],"d":["아킵","스도","보","유스"],"h":"같은 절에 바나바의 생질 마가가 함께 나와요.","ex":"골로새서 4:10에서 바울은 자기와 함께 갇힌 아리스다고와 바나바의 생질 마가가 문안한다고 전했어요."},{"ref":"로마서 16:1-2","h":"바울은 이 자매가 여러 사람과 자기의 보호자가 되었다고 했어요.","ex":"로마서 16장에서 바울은 겐그레아 교회의 일꾼인 자매 뵈뵈를 추천하며, 그를 합당하게 영접하고 도와 달라고 했어요.","v":[["로마서 16장에서 바울이 추천한 자매 뵈뵈는 어느 교회의 일꾼이었나요?",["겐그레아 교회","고린도 교회","에베소 교회","빌립보 교회","안디옥 교회","라오디게아 교회"]],["로마서 16장에서 겐그레아 교회의 일꾼이라며 바울이 추천한 자매는?",["뵈뵈","루디아","브리스가","유오디아","다비다","순두게"]]]},{"type":"multi","ref":"로마서 12:6-8","q":"로마서 12장에서 '받은 은사'로 든 것을 모두 고르세요.","yes":["예언","섬기는 일","가르치는 자","위로하는 자","구제하는 자","다스리는 자","긍휼을 베푸는 자"],"no":["방언을 말하는 자","병 고치는 자","통역하는 자","영들을 분별하는 자"],"h":"'혹 ~이면' 하고 이어지는 목록이에요. 방언에 관한 것은 이 목록에 없어요.","ex":"로마서 12장은 예언, 섬기는 일, 가르치는 자, 위로하는 자, 구제하는 자, 다스리는 자, 긍휼을 베푸는 자를 들며 각각 받은 은사대로 하라고 했어요."},{"type":"verse","l":["rom",16,22],"ref":"로마서 16:22","q":"이 구절에서 이 편지를 기록하는 사람이라고 자기 이름을 밝힌 사람은?","a":["더디오","디모데","가이오","에라스도","구아도","누기오"],"h":"바울이 아닌 다른 사람이 '나'라고 말하며 문안해요.","ex":"로마서 16:22에서 이 편지를 기록하는 더디오도 주 안에서 문안한다고 직접 인사했어요."},{"ref":"고린도전서 3:4-6","h":"고린도 교인들 가운데 '나는 바울에게', '나는 ○○○에게' 하며 나뉜 사람들이 있었어요.","ex":"고린도전서 3장에서 바울은 자기는 심었고 아볼로는 물을 주었으나 자라게 하신 분은 하나님이라고 했어요.","v":[["고린도전서 3장에서 바울이 심었을 때 물을 준 사람은?",["아볼로","게바","디모데","실라","바나바","디도"]],["고린도전서 3장에서 '나는 심었고 아볼로는 물을 주었다'고 말한 사람은?",["바울","게바","디모데","실라","바나바","소스데네"]]]},{"type":"order","ref":"고린도전서 15:5-8","q":"고린도전서 15장에서 부활하신 그리스도께서 보이신 대상을 본문 순서대로 놓으세요.","seq":["게바","열두 제자","오백여 형제","야고보","모든 사도","바울 자신"],"h":"'맨 나중에'는 만삭되지 못하여 난 자 같다고 한 사람이에요.","ex":"게바, 열두 제자, 오백여 형제, 야고보, 모든 사도 순으로 보이셨고, 맨 나중에 바울 자신에게도 보이셨어요."},{"ref":"고린도후서 11:24-25","h":"세 번 태장으로 맞고, 한 번 돌로 맞고, 세 번 파선했다는 말과 함께 나와요.","ex":"고린도후서 11장에서 바울은 유대인들에게 사십에서 하나 감한 매를 다섯 번 맞았다고 했어요.","v":[["고린도후서 11장에서 바울이 유대인들에게 '사십에서 하나 감한 매'를 맞은 횟수는?",["다섯 번","세 번","네 번","일곱 번","두 번","여섯 번"]],["고린도후서 11장에서 바울이 유대인들에게 다섯 번 맞았다고 한 매는?",["사십에서 하나 감한 매","사십에서 둘 감한 매","사십 대의 매","서른 대의 매","쉰에서 하나 감한 매","스무 대의 매"]]]},{"type":"verse","l":["2co",11,32],"ref":"고린도후서 11:32-33","q":"이 구절에서 다메섹 성을 지키며 바울을 잡으려 한 고관은 어느 왕의 고관이었나요?","a":["아레다 왕","헤롯 왕","아그립바 왕","아하수에로 왕","고레스 왕","다리오 왕"],"h":"바울은 광주리를 타고 들창문으로 성벽을 내려가 피했어요.","ex":"다메섹에서 아레다 왕의 고관이 바울을 잡으려고 성을 지켰지만, 바울은 광주리를 타고 성벽을 내려가 벗어났어요."},{"ref":"갈라디아서 2:9, 11","h":"기둥 같이 여겨지던 세 사람 가운데 한 사람이에요.","ex":"갈라디아서 2장에서 게바가 안디옥에 왔을 때 책망 받을 일이 있어, 바울이 그를 대면하여 책망했어요.","v":[["갈라디아서 2장에서 바울이 게바를 대면하여 책망한 곳은?",["안디옥","예루살렘","다메섹","고린도","에베소","다소"]],["갈라디아서 2장에서 안디옥에 이르렀을 때 바울에게 대면하여 책망을 받은 사람은?",["게바","야고보","요한","디도","마가","실라"]]]},{"type":"multi","ref":"갈라디아서 5:19-21","q":"갈라디아서 5장에 나오는 '육체의 일'을 모두 고르세요.","yes":["음행","호색","우상 숭배","주술","원수 맺는 것","분쟁","당 짓는 것","술 취함","방탕함"],"no":["탐심","거짓말","교만","도둑질"],"h":"모두 열다섯 가지로, '음행'으로 시작해 '방탕함'으로 끝나요.","ex":"육체의 일은 음행, 더러운 것, 호색, 우상 숭배, 주술, 원수 맺는 것, 분쟁, 시기, 분냄, 당 짓는 것, 분열함, 이단, 투기, 술 취함, 방탕함이에요."},{"type":"order","ref":"갈라디아서 1:17-2:1","q":"갈라디아서 1~2장에서 바울이 부르심을 받은 뒤 간 곳을 본문 순서대로 놓으세요.","seq":["아라비아로 감","다시 다메섹으로 돌아감","삼 년 만에 예루살렘에 올라가 십오 일 머묾","수리아와 길리기아 지방에 이름","십사 년 후 바나바, 디도와 함께 다시 예루살렘에 올라감"],"h":"바울은 곧바로 예루살렘에 올라가지 않았다고 했어요.","ex":"바울은 아라비아로 갔다가 다메섹으로 돌아갔고, 삼 년 만에 예루살렘에서 십오 일을 머문 뒤 수리아와 길리기아로 갔어요. 십사 년 후 바나바, 디도와 함께 다시 예루살렘에 올라갔어요."},{"ref":"에베소서 4:4-6","h":"모두 일곱 가지가 나오고, 마지막은 만유의 아버지 하나님이에요.","ex":"에베소서 4장은 몸, 성령, 부르심의 소망, 주, 믿음, 세례, 만유의 아버지 하나님이 하나(한 분)라고 했어요.","v":[["에베소서 4장에서 '하나(한 분)'라고 말한 것이 아닌 것은?",["율법","몸","성령","소망","믿음","세례"]],["에베소서 4장에서 '하나(한 분)'라고 말한 것은?",["세례","율법","성전","할례","성찬","언약"]]]},{"type":"match","ref":"에베소서 5:22, 25; 6:1, 4-5, 9","q":"에베소서 5~6장에서 부르는 사람과 그에게 한 권면을 바르게 짝지으세요.","L":"부르는 사람","R":"받은 권면","pairs":[["아내들","자기 남편에게 주께 하듯 복종"],["남편들","그리스도께서 교회를 사랑하심 같이 아내를 사랑"],["자녀들","주 안에서 부모에게 순종"],["아비들","자녀를 노엽게 하지 말고 주의 교훈과 훈계로 양육"],["종들","그리스도께 하듯 육체의 상전에게 순종"],["상전들","위협을 그침"]],"h":"상전들에게는 그들의 상전도 하늘에 계신다고 일깨워요.","ex":"아내는 남편에게 복종, 남편은 아내를 사랑, 자녀는 부모에게 순종, 아비는 자녀를 노엽게 하지 말고 양육, 종은 상전에게 순종, 상전은 위협을 그치라고 했어요."},{"type":"match","ref":"빌립보서 3:5-6","q":"빌립보서 3장에서 바울이 밝힌 자기 이력을 바르게 짝지으세요.","L":"항목","R":"바울의 이력","pairs":[["할례","팔일 만에 받음"],["족속","이스라엘"],["지파","베냐민"],["율법으로는","바리새인"],["열심으로는","교회를 박해함"],["율법의 의로는","흠이 없는 자"]],"h":"바울은 자신을 '히브리인 중의 히브리인'이라고도 했어요.","ex":"바울은 팔일 만에 할례를 받은 이스라엘 족속, 베냐민 지파, 히브리인 중의 히브리인이고, 율법으로는 바리새인, 열심으로는 교회를 박해한 자, 율법의 의로는 흠이 없는 자라고 했어요."},{"type":"piece","ref":"빌립보서 4:2","q":"빌립보서 4장에서 바울이 순두게와 함께 권하며 주 안에서 같은 마음을 품으라고 한 사람은?","w":["유오","디","아"],"d":["순두","게","루디","오디"],"h":"바로 다음 절에는 글레멘드라는 이름이 나와요.","ex":"빌립보서 4:2에서 바울은 유오디아와 순두게를 권하며 주 안에서 같은 마음을 품으라고 했어요."},{"type":"order","ref":"데살로니가전서 4:16-17","q":"데살로니가전서 4장에서 주께서 강림하실 때의 일을 본문에 나오는 순서대로 놓으세요.","seq":["호령","천사장의 소리","하나님의 나팔 소리","그리스도 안에서 죽은 자들이 먼저 일어남","살아 남은 자들이 구름 속으로 끌어 올려짐","공중에서 주를 영접함","항상 주와 함께 있음"],"h":"살아 있는 사람들은 자는 사람들보다 결코 앞서지 못한다고 했어요.","ex":"호령과 천사장의 소리와 하나님의 나팔 소리가 먼저 나오고, 죽은 자들이 먼저 일어난 뒤 살아 남은 자들이 끌어 올려져 공중에서 주를 영접하고 항상 주와 함께 있게 돼요."},{"ref":"데살로니가전서 3:1-2, 6","h":"바울이 '우리 형제요 하나님의 일꾼'이라고 불렀어요.","ex":"바울 일행은 아덴에 홀로 머물기로 하고 디모데를 데살로니가에 보냈고, 디모데는 돌아와 그들의 믿음과 사랑의 기쁜 소식을 전했어요.","v":[["바울 일행이 홀로 머물기로 하고, 데살로니가 교회를 굳게 하려고 동역자를 보낸 곳은?",["아덴","고린도","빌립보","베뢰아","에베소","드로아"]],["바울이 데살로니가에 보냈다가, 그들의 믿음과 사랑의 기쁜 소식을 가지고 돌아온 사람은?",["디모데","디도","실루아노","두기고","에바브로디도","누가"]]]},{"type":"verse","l":["1th",5,8],"ref":"데살로니가전서 5:8","q":"이 구절에서 '구원의 소망'으로 된 것으로 쓰자고 한 것은?","a":["투구","호심경","방패","허리띠","신","검"],"h":"믿음과 사랑으로는 가슴을 지키는 것을 붙이자고 했어요.","ex":"빛의 아들이요 낮의 아들인 우리는 믿음과 사랑의 호심경을 붙이고 구원의 소망의 투구를 쓰자고 했어요."},{"ref":"데살로니가후서 2:3-4","h":"먼저 배교하는 일이 있은 뒤에 나타난다고 했어요.","ex":"주의 날 전에 불법의 사람 곧 멸망의 아들이 나타나, 하나님의 성전에 앉아 자기를 하나님이라고 내세운다고 했어요.","v":[["데살로니가후서 2장에서 '불법의 사람'을 다른 말로 무엇이라 불렀나요?",["멸망의 아들","어둠의 아들","불순종의 아들","진노의 자녀","사망의 아들","거짓의 아비"]],["데살로니가후서 2장에서 '멸망의 아들'이라고도 부른 사람은?",["불법의 사람","율법 교사","사두개인","바벨론 왕","거짓 형제","마술사"]]]},{"type":"verse","l":["2th",3,10],"ref":"데살로니가후서 3:10","q":"이 구절에서 누구든지 무엇을 싫어하거든 먹지도 말게 하라고 했나요?","a":["일하기","기도하기","배우기","나누기","섬기기","감사하기"],"h":"바울은 누구에게서든 음식을 값없이 먹지 않았다고 했어요.","ex":"바울은 데살로니가 사람들과 함께 있을 때부터 일하기 싫어하는 사람은 먹지도 말게 하라고 명했고, 조용히 일하여 자기 양식을 먹으라고 권했어요."},{"ref":"데살로니가후서 1:7-9","h":"뜨겁게 타오르는 모습이에요.","ex":"주 예수께서 능력의 천사들과 함께 하늘로부터 불꽃 가운데 나타나시고, 하나님을 모르는 자들은 영원한 멸망의 형벌을 받는다고 했어요.","v":[["데살로니가후서 1장에서 주 예수께서 능력의 천사들과 함께 하늘로부터 나타나실 때, 무엇 가운데 나타나신다고 했나요?",["불꽃","구름","흰 옷","번개","무지개","큰 바람"]],["데살로니가후서 1장에서 주 예수께서 불꽃 가운데 하늘로부터 나타나실 때 함께 오는 이들은?",["능력의 천사들","이십사 장로","네 생물","열두 사도","순교자들","선지자들"]]]},{"type":"piece","q":"데살로니가 교회에 보낸 두 편지의 첫 절에서 바울, 디모데와 함께 보내는 사람으로 나오는 이름은?","w":["실루","아","노"],"d":["실라","안","드로","아굴"],"h":"두 편지 모두 같은 세 사람의 이름으로 시작해요.","ex":"데살로니가전서와 데살로니가후서는 모두 바울과 실루아노와 디모데가 데살로니가 교회에 보내는 인사로 시작해요.","ref":"데살로니가전서 1:1; 데살로니가후서 1:1"},{"ref":"디모데전서 5:9","h":"오십보다 많고 칠십보다 적어요.","ex":"디모데전서 5장은 나이가 육십이 덜 되지 않고 한 남편의 아내였던 과부를 명부에 올리라고 했어요.","v":[["디모데전서 5장에서 과부를 명부에 올리려면 나이가 얼마 이상이어야 한다고 했나요?",["육십 세","오십 세","사십 세","칠십 세","육십오 세","오십오 세"]],["디모데전서 5장에서 나이가 육십이 덜 되지 않고 한 남편의 아내였던 사람을 명부에 올리라고 한 대상은?",["과부","여집사","여선지자","늙은 여자","젊은 여자","종"]]]},{"type":"multi","ref":"디모데전서 3:2-6","q":"디모데전서 3장에서 감독의 자격으로 말한 것을 모두 고르세요.","yes":["책망할 것이 없음","한 아내의 남편","절제함","신중함","나그네를 대접함","가르치기를 잘함","술을 즐기지 않음","돈을 사랑하지 않음"],"no":["새로 입교한 사람","결혼하지 않은 사람","재산이 많은 사람","예언을 잘하는 사람"],"h":"새로 입교한 사람은 교만해질까 봐 세우지 말라고 했어요.","ex":"감독은 책망할 것이 없고 한 아내의 남편이며 절제·신중·단정하고 나그네를 대접하며 가르치기를 잘하고, 술을 즐기지 않고 돈을 사랑하지 않아야 한다고 했어요."},{"type":"order","ref":"디모데전서 6:11","q":"디모데전서 6장에서 디모데에게 따르라고 한 것을 본문 순서대로 놓으세요.","seq":["의","경건","믿음","사랑","인내","온유"],"h":"'의'로 시작해서 '온유'로 끝나요.","ex":"디모데에게 이것들을 피하고 의와 경건과 믿음과 사랑과 인내와 온유를 따르라고 했어요."},{"ref":"디모데전서 6:10","h":"바로 앞에서 먹을 것과 입을 것이 있으면 족한 줄로 알라고 했어요.","ex":"디모데전서 6장은 먹을 것과 입을 것이 있으면 족한 줄로 알라고 하며, 돈을 사랑함이 일만 악의 뿌리가 된다고 했어요.","v":[["디모데전서 6장에서 '일만 악의 뿌리'가 된다고 한 것은?",["돈을 사랑함","교만함","시기함","거짓말함","음란함","게으름"]],["디모데전서 6장에서 돈을 사랑함은 무엇이 된다고 했나요?",["일만 악의 뿌리","모든 죄의 시작","사망의 길","쓴 뿌리","다툼의 씨앗","멸망의 문"]]]},{"type":"piece","q":"디모데전서 1장에서 바울이 믿음에 관하여 파선한 사람으로, 알렉산더와 함께 사탄에게 내주었다고 한 사람은?","w":["후메","내","오"],"d":["빌레","도","에바","네오"],"h":"디모데후서 2장에서는 부활이 이미 지나갔다고 말한 사람으로 빌레도와 함께 나와요.","ex":"바울은 후메내오와 알렉산더를 사탄에게 내주어 훈계를 받아 신성을 모독하지 못하게 하려 했다고 했어요.","ref":"디모데전서 1:19-20; 디모데후서 2:17-18"},{"type":"match","ref":"디모데후서 4:10-12, 20","q":"디모데후서 4장에서 사람과 그가 가 있거나 머문 곳을 바르게 짝지으세요.","L":"사람","R":"곳","pairs":[["데마","데살로니가"],["그레스게","갈라디아"],["디도","달마디아"],["두기고","에베소"],["에라스도","고린도"],["드로비모","밀레도"]],"h":"드로비모는 병이 들어 남겨 두었다고 했어요.","ex":"데마는 이 세상을 사랑하여 데살로니가로, 그레스게는 갈라디아로, 디도는 달마디아로 갔고, 두기고는 에베소로 보냈어요. 에라스도는 고린도에 머물렀고 드로비모는 병들어 밀레도에 두었어요."},{"ref":"디도서 3:12","h":"'아데마나 두기고를 네게 보내리니' 하는 말 바로 뒤에 나와요.","ex":"바울은 니고볼리에서 겨울을 지내기로 작정했다며, 디도에게 그곳으로 급히 오라고 했어요.","v":[["바울이 겨울을 지내기로 작정하고 디도에게 급히 오라고 한 곳은?",["니고볼리","드로아","고린도","에베소","밀레도","그레데"]],["바울이 디도에게 니고볼리로 급히 오라고 하며 그곳에서 하기로 작정한 일은?",["겨울을 지내는 일","장로를 세우는 일","연보를 모으는 일","회당에서 강론하는 일","배를 타고 떠나는 일","세례를 베푸는 일"]]]},{"type":"match","ref":"디도서 2:2-10","q":"디도서 2장에서 대상과 그들에게 권하라고 한 말을 바르게 짝지으세요.","L":"대상","R":"권할 말","pairs":[["늙은 남자","믿음과 사랑과 인내함에 온전하게"],["늙은 여자","선한 것을 가르치는 자가 되게"],["젊은 여자","남편과 자녀를 사랑하게"],["젊은 남자","신중하도록"],["종","훔치지 말고 참된 신실성을 나타내게"]],"h":"종에게는 상전에게 범사에 순종하라고도 했어요.","ex":"늙은 남자는 믿음·사랑·인내함에 온전하게, 늙은 여자는 선한 것을 가르치는 자가 되게, 젊은 여자는 남편과 자녀를 사랑하게, 젊은 남자는 신중하게, 종은 훔치지 말고 신실하게 하라고 했어요."},{"type":"multi","ref":"빌레몬서 1:1-2, 23-24","q":"빌레몬서 끝에서 빌레몬에게 문안한다고 이름이 나오는 사람을 모두 고르세요.","yes":["에바브라","마가","아리스다고","데마","누가"],"no":["압비아","아킵보","두기고","디도"],"h":"자매 압비아와 병사 된 아킵보는 편지를 받는 쪽이에요.","ex":"바울과 함께 갇힌 에바브라, 그리고 동역자 마가와 아리스다고와 데마와 누가가 문안했어요. 압비아와 아킵보는 첫머리에서 편지를 받는 사람으로 나와요."},{"type":"multi","ref":"히브리서 9:2-5","q":"히브리서 9장에서 둘째 휘장 뒤 지성소에 있다고 한 것을 모두 고르세요.","yes":["금 향로","언약궤","만나를 담은 금 항아리","아론의 싹난 지팡이","언약의 돌판들","영광의 그룹들"],"no":["등잔대","상","진설병"],"h":"첫 장막인 성소에 있던 기구는 여기에 넣지 마세요.","ex":"첫 장막에는 등잔대와 상과 진설병이 있고, 지성소에는 금 향로와 언약궤가 있으며 그 안에 만나 담은 금 항아리, 아론의 싹난 지팡이, 언약의 돌판들이, 위에는 영광의 그룹들이 있다고 했어요."},{"type":"match","ref":"히브리서 12:16, 24, 29; 13:2, 12, 23-24","q":"히브리서 12~13장의 말씀과 그것이 가리키는 대상을 바르게 짝지으세요.","L":"말씀","R":"대상","pairs":[["한 그릇 음식 때문에 장자의 명분을 판 사람","에서"],["뿌린 피가 이보다 더 나은 것을 말한다고 한 피","아벨의 피"],["소멸하는 불이시라고 한 분","우리 하나님"],["손님을 대접하다가 부지중에 대접한 이들","천사들"],["성문 밖에서 고난을 받으신 분","예수"],["놓였다는 소식을 알린 형제","디모데"],["너희에게 문안한다고 한 사람들","이달리야에서 온 자들"]],"h":"장자의 명분을 판 사람은 나중에 눈물을 흘리며 축복을 구했지만 버린 바 되었어요.","ex":"히브리서 12장은 에서, 아벨의 피, 소멸하는 불이신 하나님을, 13장은 부지중에 천사를 대접한 이들, 성문 밖에서 고난 받으신 예수, 놓인 디모데, 이달리야에서 온 자들을 말해요."},{"type":"order","ref":"베드로후서 1:5-7","q":"베드로후서 1장에서 믿음에 차례로 더하라고 한 것들을 본문 순서대로 놓으세요.","seq":["덕","지식","절제","인내","경건","형제 우애","사랑"],"h":"앞의 것에 다음 것을 더하는 사슬처럼 이어져요. 절제 다음에는 참는 것이 와요.","ex":"믿음에 덕을, 덕에 지식을, 지식에 절제를, 절제에 인내를, 인내에 경건을, 경건에 형제 우애를, 형제 우애에 사랑을 더하라고 했어요."},{"ref":"베드로후서 3:8-9","h":"베드로는 주의 약속이 더딘 것이 아니라 오래 참으시는 것이라고 말하기 직전에 이 말을 했어요.","ex":"베드로후서 3장은 주께는 하루가 천 년 같고 천 년이 하루 같다는 것을 잊지 말라고 하며, 주께서 모두 회개하기를 원하셔서 오래 참으신다고 말해요.","v":[["베드로후서 3장에서 '이 한 가지를 잊지 말라'며, 주께는 하루가 무엇 같다고 했나요?",["천 년","백 년","만 년","오백 년","칠십 년","사십 년"]],["베드로후서 3장에서 주께는 천 년이 무엇 같다고 했나요?",["하루","한 시간","이레","한 달","일 년","열흘"]]]},{"ref":"베드로후서 2:5","h":"노아 자신은 이 숫자에 들어가지 않아요. 노아와 그 식구라고 했어요.","ex":"베드로후서 2:5는 하나님이 옛 세상에 홍수를 내리실 때 의를 전파하는 노아와 그 일곱 식구를 보존하셨다고 말해요.","v":[["베드로후서 2장에서 하나님이 홍수를 내리실 때 노아와 함께 보존하셨다고 한 식구의 수는?",["일곱 식구","여섯 식구","여덟 식구","세 식구","다섯 식구","열 식구"]],["베드로후서 2장에서 홍수 때 보존된 노아를 어떤 사람이라고 소개했나요?",["의를 전파하는 사람","회개를 전파하는 사람","심판을 예언하는 사람","복음을 전파하는 사람","평화를 전하는 사람","율법을 가르치는 사람"]]]},{"type":"verse","l":["2pe",2,22],"ref":"베드로후서 2:22","q":"이 구절의 속담에서, 씻었다가 더러운 구덩이에 도로 누운 짐승은?","a":["돼지","개","양","나귀","염소","낙타"],"ex":"베드로후서 2:22는 개가 토한 것에 돌아가고 돼지가 씻었다가 더러운 구덩이에 도로 눕는다는 속담이 거짓 선생들에게 들어맞았다고 말해요.","h":"같은 구절에서 다른 짐승은 자기가 토한 것으로 돌아가요."},{"type":"piece","q":"요한일서에서 '지금은 마지막 때'라고 하며, 지금도 많이 일어났다고 말한 이들은?","w":["적","그리","스도"],"d":["거짓","선지","자","미혹"],"h":"요한이서에서는 예수 그리스도께서 육체로 오심을 부인하는 미혹하는 자를 이렇게 불러요.","ex":"요한일서 2:18은 많은 적그리스도가 일어난 것을 보고 마지막 때인 줄 안다고 말하고, 요한이서 7절도 미혹하는 자를 적그리스도라고 불러요.","ref":"요한일서 2:18; 요한이서 1:7"},{"ref":"요한일서 5:6-8","h":"예수 그리스도께서 '물로만' 아니라 두 가지로 임하셨다고 했어요.","ex":"요한일서 5장은 예수 그리스도께서 물과 피로 임하셨고, 증언하는 이가 셋이니 성령과 물과 피이며 이 셋이 합하여 하나라고 말해요.","v":[["요한일서 5장에서 증언하는 이 셋으로 꼽힌 것은?",["성령과 물과 피","성령과 물과 불","말씀과 물과 피","물과 피와 떡","성령과 불과 바람","피와 떡과 잔"]],["요한일서 5장에서 예수 그리스도께서 무엇으로 임하셨다고 했나요?",["물과 피","물과 불","물과 성령","떡과 잔","구름과 불","말씀과 능력"]]]},{"type":"order","ref":"요한일서 1:1; 2:1, 15; 4:1; 5:13, 21","q":"요한일서에 나오는 말씀을 본문 순서대로 놓으세요.","seq":["생명의 말씀을 손으로 만졌다는 고백","아버지 앞에 대언자가 있다는 말씀","세상이나 세상에 있는 것들을 사랑하지 말라","영을 다 믿지 말고 분별하라","영생이 있음을 알게 하려고 쓴다","우상에게서 멀리하라"],"h":"편지의 맨 마지막 절은 '자녀들아'로 시작하는 짧은 당부예요.","ex":"1장 1절에 생명의 말씀을 듣고 보고 만졌다는 고백, 2장에 대언자 예수 그리스도와 세상을 사랑하지 말라는 말씀, 4장에 영을 분별하라는 말씀, 5장에 영생을 알게 하려고 쓴다는 말과 우상에게서 멀리하라는 당부가 나와요."},{"type":"verse","l":["1jn",4,20],"ref":"요한일서 4:20","q":"이 구절에서, 보지 못하는 하나님을 사랑할 수 없다고 한 사람은 무엇을 사랑하지 않는 사람인가요?","a":["보는 바 그 형제","자기 원수","자기 자신","자기 부모","나그네","이웃의 아내"],"ex":"요한일서 4:20은 하나님을 사랑한다면서 형제를 미워하면 거짓말하는 자이고, 눈에 보이는 형제를 사랑하지 않는 사람은 보이지 않는 하나님을 사랑할 수 없다고 말해요.","h":"눈에 보이는 사람과 보이지 않는 하나님이 맞대어져 있어요."},{"type":"match","ref":"요한일서 1:5, 7; 4:18; 5:3-4, 12","q":"요한일서 말씀의 앞부분과 이어지는 내용을 바르게 짝지으세요.","L":"말씀의 앞부분","R":"이어지는 내용","pairs":[["하나님은 빛이시라","그에게는 어둠이 조금도 없으심"],["아들 예수의 피","우리를 모든 죄에서 깨끗하게 하심"],["사랑 안에는","두려움이 없음"],["세상을 이기는 승리","우리의 믿음"],["그의 계명들","무거운 것이 아님"],["아들이 있는 자","생명이 있음"]],"h":"온전한 사랑은 무엇을 내쫓는다고 했는지 떠올려 보세요.","ex":"하나님은 빛이시라 어둠이 없으시고(1:5), 예수의 피가 모든 죄에서 깨끗하게 하며(1:7), 사랑 안에 두려움이 없고(4:18), 계명은 무겁지 않고 세상을 이기는 승리는 믿음이며(5:3-4), 아들이 있는 자에게 생명이 있다고 했어요(5:12)."},{"ref":"요한이서 1:1, 13","h":"요한삼서와 달리, 요한이서는 한 여인과 그 가족에게 보낸 편지예요.","ex":"요한이서는 장로가 택하심을 받은 부녀와 그의 자녀들에게 쓴 편지이고, 마지막 절에서는 택하심을 받은 그 자매의 자녀들이 문안한다고 전해요.","v":[["요한이서에서 장로가 편지를 보낸 사람은?",["택하심을 받은 부녀와 그의 자녀들","사랑하는 가이오","흩어진 나그네들","디모데","빌레몬","디도"]],["요한이서 마지막 절에서 부녀에게 문안한다고 한 사람들은?",["택하심을 받은 자매의 자녀들","아시아의 교회들","가이사의 집 사람들","바벨론에 있는 교회","모든 장로들","이달리야에서 온 사람들"]]]},{"ref":"요한이서 1:12","h":"요한삼서 끝부분에도 비슷한 말이 있지만 쓰는 도구가 조금 달라요.","ex":"요한이서 12절에서 장로는 쓸 것이 많지만 종이와 먹으로 쓰지 않고, 직접 가서 대면하여 말해 그들의 기쁨을 충만하게 하겠다고 했어요.","v":[["요한이서에서 장로가 쓸 것이 많지만 원하지 않는다고 한 것은?",["종이와 먹으로 쓰기","먹과 붓으로 쓰기","돌판에 새기기","가죽 종이에 쓰기","남의 손을 빌려 쓰기","밀랍 판에 쓰기"]],["요한이서 12절에서 장로가 편지 대신 하겠다고 한 것은?",["가서 대면하여 말하기","사람을 보내 전하기","다시 긴 편지를 쓰기","장로들에게 맡기기","기도로 대신하기","교회에서 읽게 하기"]]]},{"type":"match","ref":"요한이서 1:3-5, 7, 10-11","q":"요한이서의 말과 이어지는 내용을 바르게 짝지으세요.","L":"요한이서의 말","R":"이어지는 내용","pairs":[["은혜와 긍휼과","평강이 우리와 함께 있음"],["진리를 행하는 자녀들을 봄","심히 기쁨"],["서로 사랑하자","처음부터 우리가 가진 계명"],["미혹하는 자","그리스도께서 육체로 오심을 부인함"],["교훈을 가지지 않은 자","집에 들이지도 인사도 말라"],["그에게 인사하는 자","악한 일에 참여함"]],"h":"서로 사랑하라는 부탁은 새 계명처럼 쓰는 것이 아니라고 했어요.","ex":"요한이서는 은혜와 긍휼과 평강을 빌고, 진리를 행하는 자녀들을 보고 기뻐하며, 처음부터 가진 계명대로 서로 사랑하자고 해요. 또 그리스도께서 육체로 오심을 부인하는 자는 집에 들이지도 인사도 말라고 했어요."},{"ref":"요한삼서 1:1-2","h":"요한삼서는 장로가 참으로 사랑하는 한 사람에게 보낸 편지예요.","ex"
