    <section class="sheet">
      <div class="label">범위를 고르세요</div>
      <div class="ranges">${items}</div>
      <button class="primary" id="go">시작하기</button>
    </section>`;
  app.querySelectorAll('.range').forEach(b=>b.addEventListener('click',()=>{
    range=b.dataset.k; try{localStorage.setItem('bq-range',range);}catch(e){}
    app.querySelectorAll('.range').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  }));
  document.getElementById('go').addEventListener('click',startRound);
  top();
}

// 정답 하나 + 오답 후보 중 무작위 3개
function pickSingle(a){
  const opts=shuffle([a[0],...shuffle(a.slice(1)).slice(0,3)]);
  return {opts,correct:opts.indexOf(a[0])};
}

function build(f){
  const base={type:f.type,t:f.t,ref:f.ref,ex:f.ex,h:f.h};
  if(f.type==="multi"){
    const maxYes=Math.min(4,f.yes.length), minYes=Math.max(2,5-f.no.length);
    const k=minYes+rnd(maxYes-minYes+1);
    const items=[...shuffle(f.yes).slice(0,k).map(s=>({s,y:true})),...shuffle(f.no).slice(0,5-k).map(s=>({s,y:false}))];
    const mixed=shuffle(items);
    return {...base,q:pickQ(f.q),opts:mixed.map(x=>x.s),correct:mixed.map((x,i)=>x.y?i:-1).filter(i=>i>=0)};
  }
  if(f.type==="order"){
    const picks=shuffle(f.seq.map((_,i)=>i)).slice(0,4).sort((a,b)=>a-b);
    const truth=picks.map(i=>f.seq[i]);
    const opts=shuffle(truth);
    return {...base,q:pickQ(f.q),opts,correct:truth.map(s=>opts.indexOf(s))};
  }
  if(f.type==="match"){
    const chosen=[], usedL=new Set(), usedR=new Set();
    for(const p of shuffle(f.pairs)){
      if(usedL.has(p[0])||usedR.has(p[1])) continue;
      chosen.push(p); usedL.add(p[0]); usedR.add(p[1]);
      if(chosen.length===4) break;
    }
    const lefts=shuffle(chosen.map(p=>p[0]));
    const rights=shuffle(chosen.map(p=>p[1]));
    const correct=lefts.map(l=>rights.indexOf(chosen.find(p=>p[0]===l)[1]));
    return {...base,q:pickQ(f.q),L:f.L,R:f.R,opts:lefts,rights,correct};
  }
  if(f.type==="piece"){
    const opts=shuffle([...f.w,...shuffle(f.d).slice(0,2)]);
    return {...base,q:pickQ(f.q),opts,w:f.w,a:f.a||f.w.join('')};
  }
  if(f.type==="verse"){
    return {...base,q:f.q,url:verseUrl(f.l),...pickSingle(f.a)};
  }
  const [q,a]=f.v[rnd(2)];
  return {...base,q,...pickSingle(a)};
}

// 한 판 구성: 유형 비율(하나 고르기 45 · 모두 고르기/순서/짝짓기 각 15 · 본문 10)을 맞춰 뽑고,
// 같은 문제·같은 주제 묶음은 한 판에 한 번만. 주제 묶음은 내부용이라 화면에 나오지 않음.
function pickRound(pool,n){
  for(let k=0;k<50;k++){ const r=tryRound(pool,n); if(r.length>=n) return r; }
  return tryRound(pool,n);
}
// 한 판의 유형별 개수: 범위 안 문제 수 비율(하나 고르기는 2문제로 셈)을 그대로 따름
function quotaFor(pool,n){
  const w={}; let tot=0;
  for(const f of pool){ const x=f.type==="choice"?2:1; w[f.type]=(w[f.type]||0)+x; tot+=x; }
  const q={}, fr=[]; let sum=0;
  for(const t in w){ const e=n*w[t]/tot; q[t]=Math.floor(e); sum+=q[t]; fr.push([t,e-q[t]]); }
  for(let left=n-sum;left>0&&fr.length;left--){
    let r=Math.random()*fr.reduce((x,y)=>x+y[1],0), k=0;
    for(;k<fr.length-1;k++){ r-=fr[k][1]; if(r<0) break; }
    q[fr[k][0]]++; fr.splice(k,1);
  }
  return q;
}
function tryRound(pool,n){
  const quota=quotaFor(pool,n);
  const byType={};
  for(const f of shuffle(pool)) (byType[f.type]=byType[f.type]||[]).push(f);
  const usedG=new Set(), picked=new Set();
  const ok=f=>!picked.has(f)&&!(GMAP[f.id]||[]).some(g=>usedG.has(g));
  const take=f=>{picked.add(f);(GMAP[f.id]||[]).forEach(g=>usedG.add(g));};
  // 묶음에 많이 걸리는 유형부터 채워야 비율이 덜 흐트러짐
  for(const t of ["match","order","multi","piece","verse","choice"]){
    let need=quota[t]||0;
    for(const f of byType[t]||[]){ if(!need) break; if(ok(f)){take(f);need--;} }
  }
  // 모자라면 아무 유형으로나 채움
  for(const f of shuffle(pool)){ if(picked.size>=n) break; if(ok(f)) take(f); }
  return shuffle([...picked]).slice(0,n);
}
function startRound(){
  round=pickRound(RANGES[range].pool,ROUND).map(build);
  idx=0; answers=[];
  renderQuestion();
}

const btn=(i,txt,side='')=>`<button class="opt" data-i="${i}"${side?` data-side="${side}"`:''} aria-pressed="false"><span class="n"></span><span class="txt">${esc(txt)}</span><span class="mark"></span></button>`;

function renderQuestion(){
  const SCREEN='quiz';
  const it=round[idx];
  sel=single(it.type)?null:it.type==="match"?{active:null,map:it.opts.map(()=>-1)}:[];
  const verseCard=it.type==="verse"?`
    <a class="versecard leather" href="${it.url}" target="_blank" rel="noopener noreferrer">
      <span class="vlabel">이 구절</span>
      <span class="vref">${esc(it.ref)}</span>
      <span class="vopen">본문 열기
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></span>
    </a>`:'';
  const body=it.type==="piece"
    ? `<div class="slots" style="--n:${it.w.length}">${it.w.map((_,k)=>`<button class="slot" data-k="${k}" aria-label="${k+1}번째 칸"><span class="sn">${k+1}</span><span class="st"></span><span class="sm"></span></button>`).join('')}</div>
       <div class="opts piece">${it.opts.map((o,i)=>btn(i,o)).join('')}</div>`
    : it.type==="match"
    ? `<div class="matchwrap">
        <div class="mlabel">${esc(it.L||'왼쪽')}</div>
        <div class="opts match mL">${it.opts.map((o,i)=>btn(i,o,'L')).join('')}</div>
        <div class="mlabel">${esc(it.R||'오른쪽')}</div>
        <div class="opts match mR">${it.rights.map((o,i)=>btn(i,o,'R')).join('')}</div>
      </div>`
    : `<div class="opts ${single(it.type)?'choice':it.type}">${it.opts.map((o,i)=>btn(i,o)).join('')}</div>`;
  app.className='wrap '+SCREEN;
  app.innerHTML=`
    <div class="edge" aria-hidden="true"><i style="width:${(idx/round.length)*100}%"></i></div>
    <div class="ribbon" aria-label="${round.length}문제 중 ${idx+1}번째">${idx+1}<small>/ ${round.length}</small></div>
    <div class="qhead"><span class="notch" aria-hidden="true">${tNotch(it.t)}</span><span class="kind">${KIND[it.type]||'하나 고르기'}</span><span class="tname">${it.t}</span></div>
    ${verseCard}
    <h2 class="qtext">${esc(it.q)}</h2>
    <p class="howto">${HOWTO[it.type]}</p>
    <div class="tools">
      <button class="hintbtn" id="hintBtn" aria-expanded="false" aria-controls="hintBox">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>
        힌트 보기</button>
      ${it.type==="order"||it.type==="match"||it.type==="piece"?'<button class="resetbtn" id="resetBtn">다시 놓기</button>':''}
    </div>
    <p class="hintbox" id="hintBox" hidden><b>힌트</b>${esc(it.h)}</p>
    ${body}
    <button class="primary" id="submit" disabled>제출하기</button>
    <div id="fb"></div>`;
  it.hintUsed=false;
  const hb=document.getElementById('hintBtn');
  hb.addEventListener('click',()=>{
    it.hintUsed=true;
    document.getElementById('hintBox').hidden=false;
    hb.setAttribute('aria-expanded','true');
    hb.hidden=true;
  });
  const rb=document.getElementById('resetBtn');
  if(rb) rb.addEventListener('click',()=>{sel=it.type==="match"?{active:null,map:it.opts.map(()=>-1)}:[];paint();});
  app.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>pick(+b.dataset.i,b.dataset.side)));
  app.querySelectorAll('.slot').forEach(b=>b.addEventListener('click',()=>{
    if(answers.length>idx) return;
    const k=+b.dataset.k; if(k<sel.length){ sel.splice(k,1); paint(); }
  }));
  document.getElementById('submit').addEventListener('click',submit);
  paint();
  top();
}

function pick(i,side){
  const it=round[idx];
  if(answers.length>idx) return;
  if(single(it.type)) sel=i;
  else if(it.type==="match"){
    if(side==="L"){
      if(sel.map[i]>=0){ sel.map[i]=-1; sel.active=i; }
      else sel.active=sel.active===i?null:i;
    }else{
      const owner=sel.map.indexOf(i);
      if(owner>=0){ sel.map[owner]=-1; if(sel.active!==null){ sel.map[sel.active]=i; sel.active=null; } }
      else if(sel.active!==null){ sel.map[sel.active]=i; sel.active=null; }
    }
  }
  else{
    const at=sel.indexOf(i);
    if(at>=0) sel.splice(at,1); else if(it.type==="multi"||sel.length<(it.type==="piece"?it.w.length:it.opts.length)) sel.push(i);
  }
  paint();
}

function paint(){
  const it=round[idx];
  if(it.type==="match"){
    app.querySelectorAll('.mL .opt').forEach((b,i)=>{
      const on=sel.active===i, paired=sel.map[i]>=0;
      b.classList.toggle('sel',on); b.classList.toggle('paired',paired);
      b.setAttribute('aria-pressed',String(on));
      b.querySelector('.n').textContent=String(i+1);
    });
    app.querySelectorAll('.mR .opt').forEach((b,j)=>{
      const owner=sel.map.indexOf(j);
      b.classList.toggle('paired',owner>=0);
      b.classList.toggle('waiting',sel.active!==null&&owner<0);
      b.querySelector('.n').textContent=owner>=0?String(owner+1):'';
    });
    document.getElementById('submit').disabled=!sel.map.every(v=>v>=0);
    return;
  }
  app.querySelectorAll('.opt').forEach((b,i)=>{
    let on=false, label='';
    if(single(it.type)){on=sel===i;label=String(i+1);}
    else if(it.type==="multi"){on=sel.includes(i);label=on?'✓':'';}
    else{const p=sel.indexOf(i);on=p>=0;label=on?String(p+1):'';}
    b.classList.toggle('sel',on);
    b.setAttribute('aria-pressed',String(on));
    b.querySelector('.n').textContent=label;
  });
  if(it.type==="piece"){
    app.querySelectorAll('.slot').forEach((b,k)=>{
      const has=k<sel.length;
      b.classList.toggle('filled',has);
      b.classList.toggle('next',k===sel.length);
      b.querySelector('.st').textContent=has?it.opts[sel[k]]:'';
    });
  }
  const ready=single(it.type)?sel!==null:it.type==="multi"?sel.length>0:it.type==="piece"?sel.length===it.w.length:sel.length===it.opts.length;
  document.getElementById('submit').disabled=!ready;
}

function grade(it,s){
  if(single(it.type)) return s===it.correct;
  if(it.type==="multi") return s.length===it.correct.length&&it.correct.every(i=>s.includes(i));
  if(it.type==="match") return s.every((v,i)=>v===it.correct[i]);
  if(it.type==="piece") return s.length===it.w.length&&s.map(i=>it.opts[i]).join("")===it.w.join("");
  return s.length===it.correct.length&&s.every((v,k)=>v===it.correct[k]);
}
const pairsText=(it,m)=>it.opts.map((l,i)=>`${esc(l)} — ${esc(it.rights[m[i]])}`).join(' / ');
const answerText=it=>it.type==="piece"?esc(it.a):single(it.type)?esc(it.opts[it.correct]):it.type==="multi"?it.correct.map(i=>esc(it.opts[i])).join(', '):it.type==="match"?pairsText(it,it.correct):it.correct.map(i=>esc(it.opts[i])).join(' → ');
const pickText=(it,s)=>it.type==="piece"?esc(s.map(i=>it.opts[i]).join("")):single(it.type)?esc(it.opts[s]):it.type==="multi"?s.map(i=>esc(it.opts[i])).join(', '):it.type==="match"?pairsText(it,s):s.map(i=>esc(it.opts[i])).join(' → ');
const refHtml=it=>it.url?`<a class="ref" href="${it.url}" target="_blank" rel="noopener noreferrer">${esc(it.ref)} 본문 보기</a>`:`<div class="ref">${esc(it.ref)}</div>`;

function submit(){
  const it=round[idx];
  if(answers.length>idx) return;
  const s=it.type==="match"?sel.map.slice():Array.isArray(sel)?sel.slice():sel;
  const right=grade(it,s);
  answers.push({pick:s,right,hint:it.hintUsed});
  document.getElementById('hintBtn').hidden=true;
  const rb=document.getElementById('resetBtn'); if(rb) rb.hidden=true;
  document.getElementById('submit').hidden=true;
  if(it.type==="match"){
    app.querySelectorAll('.mL .opt').forEach((b,i)=>{
      b.disabled=true; b.classList.remove('sel','paired');
      const ok=s[i]===it.correct[i];
      b.classList.add(ok?'ok':'bad');
      if(!ok) b.querySelector('.mark').textContent='짝 틀림';
    });
    app.querySelectorAll('.mR .opt').forEach((b,j)=>{
      b.disabled=true; b.classList.remove('paired','waiting');
      const owner=s.indexOf(j), truth=it.correct.indexOf(j);
      b.classList.add(owner===truth?'ok':'bad');
      b.querySelector('.n').textContent=String(truth+1);
      if(owner!==truth) b.querySelector('.mark').textContent=`정답 ${truth+1}번`;
    });
  }else if(it.type==="piece"){
    app.querySelectorAll('.slot').forEach((b,k)=>{
      b.disabled=true; b.classList.remove('next');
      const ok=it.opts[s[k]]===it.w[k];
      b.classList.add(ok?'ok':'bad');
      if(!ok) b.querySelector('.sm').textContent=it.w[k];
    });
    app.querySelectorAll('.opt').forEach((b,i)=>{
      b.disabled=true; b.classList.remove('sel');
      if(it.w.includes(it.opts[i])) b.classList.add('ok');
      else { b.classList.add('dim'); b.querySelector('.mark').textContent='미끼'; }
    });
  }else app.querySelectorAll('.opt').forEach((b,i)=>{
    b.disabled=true; b.classList.remove('sel');
    const mark=b.querySelector('.mark');
    if(single(it.type)){
      if(i===it.correct) b.classList.add('ok'); else if(i===s) b.classList.add('bad'); else b.classList.add('dim');
    }else if(it.type==="multi"){
      const isY=it.correct.includes(i), chosen=s.includes(i);
      if(isY&&chosen) b.classList.add('ok');
      else if(isY){b.classList.add('miss');mark.textContent='놓친 정답';}
      else if(chosen){b.classList.add('bad');mark.textContent='오답';}
      else b.classList.add('dim');
    }else{
      const mine=s.indexOf(i), truth=it.correct.indexOf(i);
      b.classList.add(mine===truth?'ok':'bad');
      if(mine!==truth) mark.textContent=`정답 ${truth+1}번째`;
    }
  });
  app.querySelector('.edge i').style.width=((idx+1)/round.length*100)+'%';
  const last=idx===round.length-1;
  const fb=document.getElementById('fb');
  const correctLine=it.type==="piece"
    ? `<p>정답은 <b>${esc(it.a)}</b>예요. (${it.w.map(esc).join(' + ')})</p>`
    : it.type==="order"
    ? `<p>올바른 순서예요.</p><ol class="seqlist">${it.correct.map(i=>`<li>${esc(it.opts[i])}</li>`).join('')}</ol>`
    : it.type==="match"
    ? `<p>올바른 짝이에요.</p><ol class="seqlist">${it.opts.map((l,i)=>`<li>${esc(l)} — <b>${esc(it.rights[it.correct[i]])}</b></li>`).join('')}</ol>`
    : `<p>정답은 <b>${answerText(it)}</b>예요.</p>`;
  fb.innerHTML=`
    <div class="feedback ${right?'right':'wrong'}">
      <div class="verdict">${right?'정답이에요':'아쉬워요'}</div>
      ${right&&it.type!=="order"&&it.type!=="match"?'':correctLine}
      <p>${esc(it.ex)}</p>
      ${refHtml(it)}
    </div>
    <button class="primary" id="next" style="margin-top:14px">${last?'결과 보기':'다음 문제'}</button>`;
  const nb=document.getElementById('next');
  nb.addEventListener('click',()=>{ if(last) renderResult(); else { idx++; renderQuestion(); } });
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  fb.scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'});
  try{nb.focus({preventScroll:true});}catch(e){}
}

function renderResult(){
  const SCREEN='result';
  const score=answers.filter(a=>a.right).length;
  const hints=answers.filter(a=>a.hint).length;
  const prev=getBest(range);
  const record=isNaN(prev)||score>prev;
  if(record) setBest(range,score);
  const msg=score===round.length?'모두 맞히셨어요.':score>=round.length*0.8?'아주 잘하셨어요.':score>=round.length*0.5?'절반 넘게 맞히셨어요.':'다음 판에서 다시 도전해 보세요.';
  const wrong=round.map((it,i)=>({it,a:answers[i]})).filter(x=>!x.a.right);
  const label=(it,mine)=>it.type==="piece"?(mine?'내가 맞춘 답':'정답'):it.type==="order"?(mine?'내가 놓은 순서':'올바른 순서'):it.type==="match"?(mine?'내가 지은 짝':'올바른 짝'):(mine?'고른 답':'정답');
  const review=wrong.length?wrong.map(({it,a})=>`
    <div class="ritem">
      <div class="chips">${KIND[it.type]?`<span class="tag kindtag">${KIND[it.type]}</span>`:''}${a.hint?'<span class="tag">힌트 사용</span>':''}</div>
      <div class="rq">${esc(it.q)}</div>
      <div class="mine">${label(it,true)}: ${pickText(it,a.pick)}</div>
      <div class="ans">${label(it,false)}: ${answerText(it)}</div>
      <p>${esc(it.ex)}</p>
      ${refHtml(it)}
    </div>`).join(''):`<p class="allright">틀린 문제가 없어요.</p>`;
  const rank=rankOf(score,round.length), n=round.length;
  const scale=[['A',`${cutA(n)}점 이상`],['B',`${cutB(n)}~${cutA(n)-1}점`],['C',`${cutB(n)-1}점 이하`]]
    .map(([g,t])=>`<div class="${g===rank?'on':''}"><b>${g}</b>${t}</div>`).join('');
  app.className='wrap '+SCREEN;
  app.innerHTML=`
    <header class="rhead leather">
      <span class="rrange"><span class="notch rn" aria-hidden="true">${NOTCH[range]}</span>${RANGES[range].name}</span>
      <div class="seal g${rank}" role="img" aria-label="${rank}등급"><b>${rank}</b><small>등급</small></div>
      <div class="rscore"><b>${score}</b>/ ${n}점</div>
      <p class="rmsg">${msg}</p>
    </header>
    <section class="rsheet">
      <div class="scale">${scale}</div>
      <p class="note">${hints?'힌트를 '+hints+'번 썼어요. ':''}${record?'이 범위의 최고 점수예요.':'이 범위 최고 점수는 '+prev+'점('+rankOf(prev,n)+')이에요.'}</p>
      <div class="row"><button class="primary" id="again">같은 범위로 다시 하기</button><button class="secondary" id="home">범위 바꾸기</button></div>
      <div class="label">${wrong.length?'틀린 문제 다시 보기':'결과'}</div>
      <div class="review">${review}</div>
    </section>`;
  document.getElementById('again').addEventListener('click',startRound);
  document.getElementById('home').addEventListener('click',renderStart);
  top();
  // 안드로이드 앱 안에서만: 가끔 깜짝 사진 알림
  try{ if(window.BibleQuizApp) window.BibleQuizApp.onResult(rank); }catch(e){}
}

// 누를 때 금박이 번지는 효과
const RM=window.matchMedia('(prefers-reduced-motion: reduce)');
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.primary,.secondary,.opt,.slot,.range');
  if(!b||b.disabled||RM.matches) return;
  const r=b.getBoundingClientRect(), d=Math.max(r.width,r.height)*2.2;
  const ink=document.createElement('span');
  ink.className='ink';
  ink.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  b.appendChild(ink);
  ink.addEventListener('animationend',()=>ink.remove());
},{passive:true});

renderStart();
